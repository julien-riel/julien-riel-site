  // ---------- Night ----------
  function nightState(S, m) {
    try { return G.engine && G.engine.simulateNight ? G.engine.simulateNight(S.setup, m) : null; } catch (e) { return null; }
  }
  function jobHours(job) {
    var j = (cat().nightJobs || {})[job];
    return j && typeof j.gpuHours === 'number' ? j.gpuHours : null;
  }

  // Timeline segments, in hours since 7 p.m. (12 hours of night).
  function nightSegments(S, m, ns) {
    var segs = [];
    var jobs = (ns && ns.jobs) || [];
    var t = 0;
    var capH = 12;
    jobs.forEach(function (j) {
      var meta = (cat().nightJobs || {})[j.id] || {};
      var label = j.label || meta.label || j.id;
      if (j.startH != null && j.endH != null) {
        var st = j.startH - 19, len = Math.max(0, j.endH - j.startH), sw = Math.max(0, +j.swapH || 0);
        if (sw > 0.01) segs.push({ kind: 'swap', from: st - sw, len: sw, label: 'Loading the model' });
        segs.push({ kind: 'job', id: j.id, n: segs.filter(function (x) { return x.kind === 'job'; }).length + 1, from: st, len: len, label: label, done: j.done !== false });
        t = Math.max(t, j.endH - 19);
      } else {
        segs.push({ kind: 'job', id: j.id, n: segs.filter(function (x) { return x.kind === 'job'; }).length + 1, from: t, len: 0.6, label: label, done: false });
        t += 0.6;
      }
    });
    return { cap: capH, segs: segs };
  }
  function gpuCountH200(S) {
    var sv = (cat().servers || {})[S.setup.serverId] || {};
    return (sv.count || 1) * (S.setup.serverCount || 1);
  }

  function timeline(S, m, ns, fillFrac) {
    var data = nightSegments(S, m, ns);
    var cap = data.cap || 1;
    var html = '<div class="tl"><div class="tl-track">';
    data.segs.forEach(function (sg, i) {
      var left = sg.from / cap * 100, w = sg.len / cap * 100;
      if (left >= 100) { return; }
      var over = left + w > 100.01;
      var shownW = Math.max(0.8, Math.min(w, 100 - left));
      var fill = fillFrac == null ? 1 : Math.max(0, Math.min(1, (fillFrac * cap - sg.from) / Math.max(0.0001, sg.len)));
      html += '<div class="tl-seg tl-seg--' + sg.kind + (over || sg.done === false ? ' is-cut' : '') + '" style="left:' + left.toFixed(2) + '%;width:' + shownW.toFixed(2) + '%" title="' + esc(sg.label) + '">' +
        '<i style="width:' + (fill * 100).toFixed(1) + '%"></i><span>' + esc(sg.kind === 'swap' ? '' : String(sg.n)) + '</span></div>';
    });
    html += '</div><div class="tl-ticks mono">';
    for (var h = 0; h <= 12; h += 2) html += '<span style="left:' + (h / 12 * 100) + '%">' + (((19 + h) % 12) || 12) + ((19 + h) % 24 < 12 ? 'am' : 'pm') + '</span>';
    return html + '</div></div>';
  }
  ui.nightTimeline = timeline;
  ui.nightState = nightState;

  function nightPanel(S, m) {
    var J = cat().nightJobs || {};
    var allowed = Array.isArray(m.knobs && m.knobs.nightJobs) ? m.knobs.nightJobs : Object.keys(J);
    var chosen = S.setup.nightJobs || [];
    var need = Array.isArray(m.nightRequired) ? m.nightRequired : [];
    var ns = nightState(S, m);
    var ev = null;
    try { ev = G.engine.evaluateMission(S.setup, m); } catch (e) { ev = null; }
    var html = '<div class="night"><div class="room-head"><div><h3>Night schedule · 7 p.m. → 7 a.m.</h3><p class="muted">GPUs paid for by day can work at night. Every model swap costs a loading time that depends on the disk.</p></div></div>';
    html += timeline(S, m, ns);
    if (ns) {
      var used = ns.usedGPUh, cap = ns.capacityGPUh;
      var sw = ns.swapHours || 0;
      html += '<div class="night-sum">' +
        '<span><em>Capacity used (H200-h)</em><b class="mono">' + ui.num(used, 0) + ' / ' + ui.num(cap, 0) + '</b></span>' +
        '<span' + (sw > 0.5 ? ' class="is-warn"' : '') + '><em>Model loads</em><b class="mono">' + (sw > 0 ? ui.dur(Math.max(60, sw * 3600)) : 'none') + '</b></span>' +
        '<span><em>Value per night</em><b class="mono">' + ui.money(ns.value) + '</b></span>' +
        '<span><em>Night used</em><b class="mono">' + ui.num(ns.nightUtilPct, 0) + '%</b></span>' +
        (ev ? '<span><em>24-hour utilization</em><b class="mono">' + ui.metric('utilization', ev.metrics.utilization) + '</b></span>' +
          '<span><em>Purchase break-even</em><b class="mono">' + ui.metric('breakEvenMonths', ev.metrics.breakEvenMonths) + '</b></span>' : '') + '</div>';
      if (need.length) {
        html += '<div class="orders"><span class="mono orders-title">ORDERS</span>' + need.map(function (id) {
          var j = (ns.jobs || []).filter(function (x) { return x.id === id; })[0];
          var st = j && j.done ? 'ok' : (j ? 'crit' : 'warn');
          var lab = (J[id] || {}).label || id;
          return ui.led(st, lab + (j && j.done ? ': ready by 7 a.m.' : j ? ': not done by 7 a.m.' : ': not scheduled'));
        }).join('') + '</div>';
      }
      if (ns.warnings && ns.warnings.length) html += '<ul class="warns">' + ns.warnings.slice(0, 4).map(function (w) { return '<li>' + esc(typeof w === 'string' ? w : (w.text || '')) + '</li>'; }).join('') + '</ul>';
    }
    html += '<div class="jobs"><div class="jobs-col"><h4>Night queue <span class="muted">· in order</span></h4>';
    if (!chosen.length) html += '<p class="muted jobs-empty">No jobs: the GPUs sleep (and still cost money).</p>';
    html += '<ol class="joblist">' + chosen.map(function (id, i) {
      return '<li class="job job--on">' + jobInfo(id, i + 1, need.indexOf(id) >= 0) + '<span class="job-btns">' +
        '<button type="button" class="ibtn" id="jb-up-' + esc(id) + '" data-act="job-up" data-id="' + esc(id) + '" aria-label="Move up ' + esc((J[id] || {}).label || id) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="ibtn" id="jb-dn-' + esc(id) + '" data-act="job-down" data-id="' + esc(id) + '" aria-label="Move down ' + esc((J[id] || {}).label || id) + '"' + (i === chosen.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="ibtn ibtn--x" id="jb-rm-' + esc(id) + '" data-act="job-remove" data-id="' + esc(id) + '" aria-label="Remove ' + esc((J[id] || {}).label || id) + '">×</button></span></li>';
    }).join('') + '</ol></div>';
    var avail = allowed.filter(function (id) { return chosen.indexOf(id) < 0; });
    html += '<div class="jobs-col"><h4>Available jobs</h4><ul class="joblist">' + avail.map(function (id) {
      return '<li class="job">' + jobInfo(id, null, need.indexOf(id) >= 0) + '<span class="job-btns"><button type="button" class="ibtn ibtn--add" id="jb-add-' + esc(id) + '" data-act="job-add" data-id="' + esc(id) + '" aria-label="Add ' + esc((J[id] || {}).label || id) + '">+</button></span></li>';
    }).join('') + '</ul></div></div>';
    return html + '</div>';
  }

  function jobInfo(id, n, ordered) {
    var j = (cat().nightJobs || {})[id] || { label: id };
    var bits = [];
    bits.push(j.gpuHours === 'rest' ? 'all the rest' : ui.num(j.gpuHours, 0) + NB + 'H200-h');
    bits.push(j.valuePerGpuHour ? ui.money(j.valuePerGpuHour) + '/GPU-h' : ui.money(j.value));
    if (j.swapGB) bits.push('loads ' + ui.gb(j.swapGB));
    return '<span class="job-info">' + (n ? '<span class="job-n mono">' + n + '</span>' : '') + '<span><b>' + esc(j.label) + '</b>' + (ordered ? ' <span class="tag tag--accent">ordered</span>' : '') + '<small class="mono">' + esc(bits.join(' · ')) + '</small>' +
      (j.risk ? '<small class="job-risk">' + ui.led('warn', 'sensitive data exposed') + '</small>' : '') + '</span></span>';
  }

  // ---------- Events ----------
  function eventsPanel(S, m) {
    var evs = m.events || [];
    var T = G.eventTexts || {};
    return '<div class="week"><div class="room-head"><div><h3>The week ahead</h3><p class="muted">Things are going to happen. A complete stack and a little staffing turn them into non-events.</p></div></div>' +
      '<ol class="week-days">' + evs.map(function (id) {
        var t = T[id] || {};
        return '<li><span class="mono">' + esc(t.day || '') + '</span><b>?</b></li>';
      }).join('') + '</ol></div>';
  }

  // ============ Simulation ============
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  ui.simStop = function () { timers.forEach(clearTimeout); timers = []; };

  ui.simScreen = function (S) {
    var m = G.app.mission(S.mid);
    var r = S.result;
    var html = '<section class="sim">' + ui.missionHead(m, 'Simulation');
    html += '<div class="sim-board">' +
      '<div class="sim-clock"><span class="mono sim-phase" id="sim-phase">Office day</span><b class="mono" id="sim-time">08:00</b></div>' +
      '<div class="sim-counters" id="sim-counters"></div>' +
      '<div class="sim-servers" id="sim-servers" aria-hidden="true">' + serverLeds(S) + '</div>' +
      '</div>';
    html += '<div class="sim-main"><div class="sim-chart" id="sim-chart">' + ui.dayChart((r.day && r.day.steps) || [], -1) + '</div><div id="sim-extra" class="sim-extra"></div></div>';
    html += '<div class="actions actions--end" id="sim-actions">' + ui.btn('Skip', 'sim-skip', { cls: 'btn--ghost', id: 'btn-skip' }) + '</div>';
    return html + '</section>';
  };

  function serverLeds(S) {
    var sv = (cat().servers || {})[S.setup.serverId] || {};
    var n = Math.min(4, S.setup.serverCount || 1);
    var g = Math.min(8, sv.count || 1);
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<div class="srv"><span class="mono">' + esc(sv.short || 'server') + '</span><span class="srv-leds">';
      for (var j = 0; j < g; j++) html += '<i style="--d:' + ((i * 3 + j) * 0.13 % 0.9).toFixed(2) + 's"></i>';
      html += '</span></div>';
    }
    return html;
  }

  function counters(step, m) {
    if (!step) return '';
    var ttft = step.ttft || {};
    var wl = ((m && m.workloads) || []).map(function (w) { return w.id; });
    var tt = wl.length ? wl.filter(function (id) { return ttft[id] != null; })[0] : 'chat';
    function c(label, v, cls) { return '<span class="ctr' + (cls ? ' ' + cls : '') + '"><em>' + esc(label) + '</em><b class="mono">' + v + '</b></span>'; }
    return c('Demand', ui.num(step.demand, 0)) + c('Served', ui.num(step.served, 0)) +
      c('Queued', ui.num(step.queued || 0, 0), step.queued > 0 ? 'is-warn' : '') +
      c('Rejected', ui.num(step.rejected || 0, 0), step.rejected > 0 ? 'is-crit' : '') +
      c('tok/s', ui.num(step.tokPerUser, 0)) +
      (tt ? c('1st token', ui.dur(ttft[tt])) : '') +
      (step.satisfaction != null ? c('Satisfaction', ui.num(step.satisfaction, 0)) : '');
  }

  function setLeds(step) {
    var box = document.getElementById('sim-servers');
    if (!box || !step) return;
    var u = step.gpuUtil != null ? step.gpuUtil : 0;
    if (u > 1.5) u = u / 100;
    box.style.setProperty('--util', u);
    box.classList.toggle('is-busy', u > 0.05);
    box.classList.toggle('is-hot', (step.memUsePct || 0) > 98 || (step.rejected || 0) > 0);
  }

  // Runs the sequence: room → day → night → events.
  ui.simRun = function (S, done) {
    ui.simStop();
    var m = G.app.mission(S.mid);
    var r = S.result || {};
    var steps = (r.day && r.day.steps) || [];
    var reduce = ui.reducedMotion();
    var phases = [];
    if (m.special === 'room' && r.room && !(S.setup.room && S.setup.room.colocation)) phases.push('room');
    if (steps.some(function (st) { return (st.demand || 0) > 0; }) || !m.special) phases.push('day');
    if (m.special === 'night' && r.night) phases.push('night');
    if (m.special === 'events' && r.events && r.events.length) phases.push('events');
    S.simPhases = phases;
    var chartBox = document.getElementById('sim-chart');
    var anyDemand = steps.some(function (st) { return (st.demand || 0) > 0; });
    if (chartBox) {
      chartBox.hidden = !anyDemand;
      if (anyDemand) chartBox.innerHTML = ui.dayChart(steps, -1, chartBox.clientWidth - 26);
    }

    function finish() {
      ui.simStop();
      // Final state of every phase
      drawDay(steps, steps.length - 1, m);
      var extra = document.getElementById('sim-extra');
      if (extra) {
        var h = '';
        if (phases.indexOf('room') >= 0) h += roomPower(S, m, r.room, 99);
        if (phases.indexOf('night') >= 0) h += nightFill(S, m, r.night, 1);
        if (phases.indexOf('events') >= 0) h += eventCards(r.events, r.events.length, true);
        extra.innerHTML = h;
      }
      var ph = document.getElementById('sim-phase');
      if (ph) ph.textContent = 'Simulation over';
      var tm = document.getElementById('sim-time');
      if (tm) tm.textContent = phases.indexOf('night') >= 0 ? '07:00' : '18:00';
      var act = document.getElementById('sim-actions');
      if (act) {
        act.innerHTML = ui.btn('See the debriefing', 'to-debrief', { cls: 'btn--primary btn--lg', id: 'btn-debrief' });
        var b = document.getElementById('btn-debrief');
        if (b) b.focus();
      }
      ui.announce('Simulation complete.');
      if (done) done();
    }
    S.simFinish = finish;
    if (reduce) { finish(); return; }

    var i = 0;
    function nextPhase() {
      var p = phases[i++];
      if (!p) { finish(); return; }
      if (p === 'room') runRoom(nextPhase);
      else if (p === 'day') runDay(nextPhase);
      else if (p === 'night') runNight(nextPhase);
      else if (p === 'events') runEvents(nextPhase);
    }

    function runRoom(next) {
      setPhase('Powering up', '07:45');
      var extra = document.getElementById('sim-extra');
      var n = (r.room.racks || []).length;
      var k = 0;
      (function step() {
        if (extra) extra.innerHTML = roomPower(S, m, r.room, k);
        if (k++ < n) later(step, 900); else later(next, 900);
      })();
    }
    function runDay(next) {
      setPhase('Office day', '08:00');
      var k = 0;
      var dt = Math.max(60, Math.round(9500 / Math.max(1, steps.length)));
      (function step() {
        if (k >= steps.length) { later(next, 400); return; }
        drawDay(steps, k, m);
        k++;
        later(step, dt);
      })();
    }
    function runNight(next) {
      setPhase('Night: batch jobs', '19:00');

    var b = document.getElementById(d < 0 ? 'jb-up-' + id : 'jb-dn-' + id);
    if (b && b.disabled) b = document.getElementById(d < 0 ? 'jb-dn-' + id : 'jb-up-' + id);
    if (b) b.focus();
  }

  // ---------- Levers (form changes) ----------
  function onKnobChange(el) {
    var key = el.getAttribute('data-knob');
    var s = S.setup;
    switch (key) {
      case 'serverCount': case 'maxContext': s[key] = parseInt(el.value, 10); break;
      case 'staffFTE': s[key] = parseFloat(el.value); break;
      case 'prefixCache': s[key] = !!el.checked; break;
      case 'colocation': s.room = s.room || {}; s.room.colocation = !!el.checked; S.roomSel = null; break;
      case 'stack': toggleStack(el.value, el.checked); break;
      default: s[key] = el.value;
    }
    refresh();
  }

  function toggleStack(id, on) {
    var L = (G.catalog && G.catalog.stackLayers) || {};
    var st = S.setup.stack = (S.setup.stack || []).slice();
    function add(x) {
      if (st.indexOf(x) < 0) st.push(x);
      ((L[x] && L[x].requires) || []).forEach(add);
    }
    function remove(x) {
      var i = st.indexOf(x);
      if (i >= 0) st.splice(i, 1);
      Object.keys(L).forEach(function (y) { if ((L[y].requires || []).indexOf(x) >= 0 && st.indexOf(y) >= 0) remove(y); });
    }
    if (on) add(id); else remove(id);
    S.setup.stack = st;
    document.querySelectorAll('input[data-knob="stack"]').forEach(function (cb) { cb.checked = st.indexOf(cb.value) >= 0; });
  }

  function onRoomUpgrade(el) {
    var room = S.setup.room;
    if (el.hasAttribute('data-room-rack')) {
      var rk = el.getAttribute('data-room-rack');
      room.rackUpgrades = room.rackUpgrades || {};
      var arr = (room.rackUpgrades[rk] || []).filter(function (x) { return x !== el.value; });
      if (el.checked) arr.push(el.value);
      room.rackUpgrades[rk] = arr;
    } else {
      var g = (room.upgrades || []).filter(function (x) { return x !== el.value; });
      if (el.checked) g.push(el.value);
      room.upgrades = g;
    }
    refresh();
  }

  // ---------- Glossary ----------
  var lastFocus = null;
  function openGlossary() {
    var d = document.getElementById('glossary');
    var bd = document.getElementById('backdrop');
    if (!d) return;
    lastFocus = document.activeElement;
    d.innerHTML = ui.glossaryPanel();
    d.hidden = false;
    if (bd) bd.hidden = false;
    document.body.classList.add('has-drawer');
    var c = document.getElementById('gloss-close'); if (c) c.focus();
  }
  function closeGlossary() {
    var d = document.getElementById('glossary');
    var bd = document.getElementById('backdrop');
    if (!d || d.hidden) return;
    d.hidden = true;
    if (bd) bd.hidden = true;
    document.body.classList.remove('has-drawer');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // ---------- Hot reload (claude.ai viewer) ----------
  function snapshot() { /* data is read on demand by hot.snapshot */ }
  function hotData() {
    return { screen: S.screen, mid: S.mid, setup: S.setup, introIdx: S.introIdx };
  }

  // ---------- Boot ----------
  var booted = false;
  function start(data) {
    if (booted) return;
    booted = true;
    applyTheme();
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-act]');
      if (t && !t.disabled) {
        var fn = actions[t.getAttribute('data-act')];
        if (fn) { ev.preventDefault(); fn(t, ev); }
        return;
      }
      if (ev.target.id === 'backdrop') closeGlossary();
    });
    document.addEventListener('change', function (ev) {
      var el = ev.target;
      if (!el || !S.setup) return;
      if (el.hasAttribute('data-knob')) onKnobChange(el);
      else if (el.hasAttribute('data-room-rack') || el.hasAttribute('data-room-global')) onRoomUpgrade(el);
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeGlossary();
    });
    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(hotData);
    } catch (e) { /* ignore */ }

    // Restore saved state, if any
    data = data || {};
    var m = data.mid && app.mission(data.mid);
    if (m && ['briefing', 'config', 'debrief', 'comite', 'sim'].indexOf(data.screen) >= 0) {
      S.mid = m.id;
      S.setup = data.setup ? baseSetup(m, data.setup) : initSetup(m);
      if (data.screen === 'briefing') { S.screen = 'briefing'; }
      else if (data.screen === 'config') { S.screen = 'config'; }
      else {
        try { S.result = G.engine.evaluateMission(clone(S.setup), m); S.resultMid = m.id; S.screen = 'debrief'; } catch (e) { S.screen = 'config'; }
      }
      render({ focus: false });
    } else if (data.screen === 'intro') {
      S.introIdx = data.introIdx || 0;
      go('intro', { focus: false });
    } else {
      render({ focus: false });
    }
  }

  function boot() {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(start);
    else start((hot && hot.data) || {});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(globalThis.G = globalThis.G || {});

</script>
