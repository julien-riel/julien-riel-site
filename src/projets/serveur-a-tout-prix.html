    return { placed: placed, ups: ups, cap: cap, load: load, needTri: needTri, hasTri: hasTri, ok: ok, issues: cr && cr.issues };
  }

  function roomPanel(S, m) {
    if (!m.room) return '<p class="muted">Pas de salle à configurer.</p>';
    var room = S.setup.room || {};
    var computed = roomState(S, m);
    var sel = S.roomSel;
    var coloc = !!room.colocation;
    var servers = m.room.servers || [];
    var unplaced = servers.filter(function (s) { return !(room.placement || {})[s.uid]; });
    var html = '<div class="room' + (coloc ? ' is-coloc' : '') + '">';
    html += '<div class="room-head"><div><h3>Salle des machines</h3><p class="muted">Choisis un serveur, puis touche une baie pour l\'y installer.</p></div></div>';
    // Quai
    html += '<div class="dock"><span class="dock-label mono">QUAI DE LIVRAISON</span><div class="dock-list">' +
      (unplaced.length ? unplaced.map(function (s) { return serverChip(s, sel, false); }).join('') : '<span class="muted">Tout est installé.</span>') + '</div></div>';
    // Baies
    html += '<div class="racks">';
    (m.room.racks || []).forEach(function (rack) {
      var info = rackInfo(S, m, rack, computed);
      var pct = info.cap ? info.load / info.cap * 100 : 0;
      var state = !info.ok ? 'crit' : pct > 85 ? 'warn' : 'ok';
      html += '<div class="rack rack--' + state + '">' +
        '<button type="button" class="rack-body" id="rack-' + esc(rack.id) + '" data-act="rack-place" data-rack="' + esc(rack.id) + '"' + (coloc ? ' disabled' : '') +
        ' aria-label="Baie ' + esc(rack.id) + (sel ? ', installer le serveur choisi ici' : '') + '">' +
        '<span class="rack-top"><b class="mono">BAIE ' + esc(rack.id) + '</b><span class="mono">' + ui.num(info.load, 1) + ' / ' + ui.num(info.cap, 0) + NB + 'kW</span></span>' +
        '<span class="rack-units">' + info.placed.map(function (s) {
          var sv = (cat().servers || {})[s.serverId] || {};
          return '<span class="unit" style="--h:' + Math.max(18, (sv.kW || 1) * 5) + 'px"><span class="mono">' + esc(sv.short || s.serverId) + '</span><span class="mono">' + ui.num(sv.kW, 1) + NB + 'kW</span></span>';
        }).join('') + (info.placed.length ? '' : '<span class="rack-empty mono">vide</span>') + '</span>' +
        '<span class="rack-meter">' + ui.meterBar(info.load, info.cap || 1, { state: state }) + '</span>' +
        '<span class="rack-leds">' + ui.led(info.needTri ? (info.hasTri ? 'ok' : 'crit') : (info.hasTri ? 'ok' : 'off'), 'Triphasé') +
        ui.led(state, pct > 100 ? 'Surcharge' : ui.num(pct, 0) + NB + '%') + '</span>' +
        '</button>';
      if (info.placed.length) {
        html += '<div class="rack-chips">' + info.placed.map(function (s) { return serverChip(s, sel, true); }).join('') + '</div>';
      }
      html += '<div class="rack-ups">' + rackUpgradeBoxes(rack.id, info.ups, coloc) + '</div></div>';
    });
    html += '</div>';
    // Global
    var cool = computed || {};
    var capCool = cool.coolingCapKW != null ? cool.coolingCapKW : m.room.coolingKW;
    var usedCool = cool.coolingUsedKW != null ? cool.coolingUsedKW : cool.totalKW;
    html += '<div class="room-global"><div class="room-cool"><div class="cz-head"><span>Climatisation de la salle</span><b class="mono">' +
      (usedCool != null ? ui.num(usedCool, 1) : '—') + ' / ' + ui.num(capCool, 0) + NB + 'kW</b></div>' +
      ui.meterBar(usedCool || 0, capCool || 1) + '</div>' +
      '<fieldset class="ups-global"><legend>Améliorations de la salle</legend>' + globalUpgradeBoxes(room.upgrades || [], coloc) + '</fieldset>' +
      '<label class="switch" for="k-colocation"><input type="checkbox" role="switch" id="k-colocation" data-knob="colocation"' + (coloc ? ' checked' : '') + '>' +
      '<span class="switch-track" aria-hidden="true"><i></i></span><span class="switch-text"><b>Tout envoyer en colocation</b><small>' +
      ui.money(C().colocPerKWMonth || 280) + ' par kW par mois, plus ' + ui.money(C().colocMigration || 10000) + ' de déménagement.</small></span></label>';
    if (computed) {
      html += '<div class="room-sum">' + ui.led(computed.powerOk ? 'ok' : 'crit', computed.powerOk ? 'Alimentation OK' : 'Alimentation insuffisante') +
        ui.led(computed.coolingOk ? 'ok' : 'crit', computed.coolingOk ? 'Refroidissement OK' : 'Refroidissement insuffisant') +
        (computed.cost3y != null ? '<span class="mono">Salle sur 3 ans : ' + ui.money(computed.cost3y) + '</span>' : '') + '</div>';
      if (computed.issues && computed.issues.length) {
        html += '<ul class="warns">' + computed.issues.slice(0, 5).map(function (x) { return '<li>' + esc(typeof x === 'string' ? x : (x.text || x.label || '')) + '</li>'; }).join('') + '</ul>';
      }
    }
    html += '</div>';
    return html + '</div>';
  }

  function serverChip(s, sel, placed) {
    var sv = (cat().servers || {})[s.serverId] || {};
    var on = sel === s.uid;
    return '<span class="schip' + (on ? ' is-sel' : '') + '"><button type="button" class="schip-main" id="sc-' + esc(s.uid) + '" data-act="room-select" data-uid="' + esc(s.uid) + '" aria-pressed="' + on + '">' +
      '<b>' + esc(sv.label || s.serverId) + '</b><span class="mono">' + ui.num(sv.kW, 1) + NB + 'kW · ' + (sv.cooling === 'liquid' ? 'liquide' : 'air') + '</span></button>' +
      (placed ? '<button type="button" class="schip-x" id="sx-' + esc(s.uid) + '" data-act="room-unplace" data-uid="' + esc(s.uid) + '" aria-label="Retirer ' + esc(sv.label || s.serverId) + ' de la baie">×</button>' : '') + '</span>';
  }

  function rackUpgradeBoxes(rackId, ups, disabled) {
    var R = cat().roomUpgrades || {};
    return Object.keys(R).filter(function (id) { return R[id].scope === 'rack'; }).map(function (id) {
      var u = R[id];
      var iid = 'ru-' + rackId + '-' + id;
      return '<label class="check check--sm" for="' + esc(iid) + '"><input type="checkbox" id="' + esc(iid) + '" data-room-rack="' + esc(rackId) + '" value="' + esc(id) + '"' +
        (ups.indexOf(id) >= 0 ? ' checked' : '') + (disabled ? ' disabled' : '') + '><span><b>' + esc(u.label) + '</b><small class="mono">' + ui.money(u.cost) + '</small></span></label>';
    }).join('');
  }
  function globalUpgradeBoxes(ups, disabled) {
    var R = cat().roomUpgrades || {};
    return Object.keys(R).filter(function (id) { return R[id].scope === 'global'; }).map(function (id) {
      var u = R[id];
      var iid = 'gu-' + id;
      return '<label class="check check--sm" for="' + esc(iid) + '"><input type="checkbox" id="' + esc(iid) + '" data-room-global="1" value="' + esc(id) + '"' +
        (ups.indexOf(id) >= 0 ? ' checked' : '') + (disabled ? ' disabled' : '') + '><span><b>' + esc(u.label) + '</b><small class="mono">' + ui.money(u.cost) + (u.blurb ? ' · ' + esc(u.blurb) : '') + '</small></span></label>';
    }).join('');
  }

  // ---------- Nuit ----------
  function nightState(S, m) {
    try { return G.engine && G.engine.simulateNight ? G.engine.simulateNight(S.setup, m) : null; } catch (e) { return null; }
  }
  function jobHours(job) {
    var j = (cat().nightJobs || {})[job];
    return j && typeof j.gpuHours === 'number' ? j.gpuHours : null;
  }

  // Segments de la ligne de temps, en heures depuis 19 h (12 h de nuit).
  function nightSegments(S, m, ns) {
    var segs = [];
    var jobs = (ns && ns.jobs) || [];
    var t = 0;
    var capH = 12;
    jobs.forEach(function (j) {
      var meta = (cat().nightJobs || {})[j.id] || {};
      var label = j.label || meta.label || j.id;
      if (j.startH != null && j.endH != null) {
        var st = j.startH - 19, len = Math.max(0, j.endH - j.startH), sw = Math.max(0, +j.swapH || 0);
        if (sw > 0.01) segs.push({ kind: 'swap', from: st - sw, len: sw, label: 'Chargement du modèle' });
        segs.push({ kind: 'job', id: j.id, n: segs.filter(function (x) { return x.kind === 'job'; }).length + 1, from: st, len: len, label: label, done: j.done !== false });
        t = Math.max(t, j.endH - 19);
      } else {
        segs.push({ kind: 'job', id: j.id, n: segs.filter(function (x) { return x.kind === 'job'; }).length + 1, from: t, len: 0.6, label: label, done: false });
        t += 0.6;
      }
    });
    return { cap: capH, segs: segs };
  }
  function gpuCountH200(S) {
    var sv = (cat().servers || {})[S.setup.serverId] || {};
    return (sv.count || 1) * (S.setup.serverCount || 1);
  }

  function timeline(S, m, ns, fillFrac) {
    var data = nightSegments(S, m, ns);
    var cap = data.cap || 1;
    var html = '<div class="tl"><div class="tl-track">';
    data.segs.forEach(function (sg, i) {
      var left = sg.from / cap * 100, w = sg.len / cap * 100;
      if (left >= 100) { return; }
      var over = left + w > 100.01;
      var shownW = Math.max(0.8, Math.min(w, 100 - left));
      var fill = fillFrac == null ? 1 : Math.max(0, Math.min(1, (fillFrac * cap - sg.from) / Math.max(0.0001, sg.len)));
      html += '<div class="tl-seg tl-seg--' + sg.kind + (over || sg.done === false ? ' is-cut' : '') + '" style="left:' + left.toFixed(2) + '%;width:' + shownW.toFixed(2) + '%" title="' + esc(sg.label) + '">' +
        '<i style="width:' + (fill * 100).toFixed(1) + '%"></i><span>' + esc(sg.kind === 'swap' ? '' : String(sg.n)) + '</span></div>';
    });
    html += '</div><div class="tl-ticks mono">';
    for (var h = 0; h <= 12; h += 2) html += '<span style="left:' + (h / 12 * 100) + '%">' + ((19 + h) % 24) + NB + 'h</span>';
    return html + '</div></div>';
  }
  ui.nightTimeline = timeline;
  ui.nightState = nightState;

  function nightPanel(S, m) {
    var J = cat().nightJobs || {};
    var allowed = Array.isArray(m.knobs && m.knobs.nightJobs) ? m.knobs.nightJobs : Object.keys(J);
    var chosen = S.setup.nightJobs || [];
    var need = Array.isArray(m.nightRequired) ? m.nightRequired : [];
    var ns = nightState(S, m);
    var ev = null;
    try { ev = G.engine.evaluateMission(S.setup, m); } catch (e) { ev = null; }
    var html = '<div class="night"><div class="room-head"><div><h3>Planning de nuit · 19 h → 7 h</h3><p class="muted">Les GPU payés le jour peuvent travailler la nuit. Chaque changement de modèle coûte un temps de chargement qui dépend du disque.</p></div></div>';
    html += timeline(S, m, ns);
    if (ns) {
      var used = ns.usedGPUh, cap = ns.capacityGPUh;
      var sw = ns.swapHours || 0;
      html += '<div class="night-sum">' +
        '<span><em>Capacité utilisée (H200-h)</em><b class="mono">' + ui.num(used, 0) + ' / ' + ui.num(cap, 0) + '</b></span>' +
        '<span' + (sw > 0.5 ? ' class="is-warn"' : '') + '><em>Chargements</em><b class="mono">' + (sw > 0 ? ui.dur(Math.max(60, sw * 3600)) : 'aucun') + '</b></span>' +
        '<span><em>Valeur par nuit</em><b class="mono">' + ui.money(ns.value) + '</b></span>' +
        '<span><em>Nuit utilisée</em><b class="mono">' + ui.num(ns.nightUtilPct, 0) + NB + '%</b></span>' +
        (ev ? '<span><em>Utilisation sur 24 h</em><b class="mono">' + ui.metric('utilization', ev.metrics.utilization) + '</b></span>' +
          '<span><em>Point mort de l\'achat</em><b class="mono">' + ui.metric('breakEvenMonths', ev.metrics.breakEvenMonths) + '</b></span>' : '') + '</div>';
      if (need.length) {
        html += '<div class="orders"><span class="mono orders-title">COMMANDES</span>' + need.map(function (id) {
          var j = (ns.jobs || []).filter(function (x) { return x.id === id; })[0];
          var st = j && j.done ? 'ok' : (j ? 'crit' : 'warn');
          var lab = (J[id] || {}).label || id;
          return ui.led(st, lab + (j && j.done ? ' : prêt à 7 h' : j ? ' : pas fini à 7 h' : ' : pas planifié'));
        }).join('') + '</div>';
      }
      if (ns.warnings && ns.warnings.length) html += '<ul class="warns">' + ns.warnings.slice(0, 4).map(function (w) { return '<li>' + esc(typeof w === 'string' ? w : (w.text || '')) + '</li>'; }).join('') + '</ul>';
    }
    html += '<div class="jobs"><div class="jobs-col"><h4>File de la nuit <span class="muted">· dans l\'ordre</span></h4>';
    if (!chosen.length) html += '<p class="muted jobs-empty">Aucun travail : les GPU dorment (et coûtent quand même).</p>';
    html += '<ol class="joblist">' + chosen.map(function (id, i) {
      return '<li class="job job--on">' + jobInfo(id, i + 1, need.indexOf(id) >= 0) + '<span class="job-btns">' +
        '<button type="button" class="ibtn" id="jb-up-' + esc(id) + '" data-act="job-up" data-id="' + esc(id) + '" aria-label="Monter ' + esc((J[id] || {}).label || id) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="ibtn" id="jb-dn-' + esc(id) + '" data-act="job-down" data-id="' + esc(id) + '" aria-label="Descendre ' + esc((J[id] || {}).label || id) + '"' + (i === chosen.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="ibtn ibtn--x" id="jb-rm-' + esc(id) + '" data-act="job-remove" data-id="' + esc(id) + '" aria-label="Retirer ' + esc((J[id] || {}).label || id) + '">×</button></span></li>';
    }).join('') + '</ol></div>';
    var avail = allowed.filter(function (id) { return chosen.indexOf(id) < 0; });
    html += '<div class="jobs-col"><h4>Travaux disponibles</h4><ul class="joblist">' + avail.map(function (id) {
      return '<li class="job">' + jobInfo(id, null, need.indexOf(id) >= 0) + '<span class="job-btns"><button type="button" class="ibtn ibtn--add" id="jb-add-' + esc(id) + '" data-act="job-add" data-id="' + esc(id) + '" aria-label="Ajouter ' + esc((J[id] || {}).label || id) + '">+</button></span></li>';
    }).join('') + '</ul></div></div>';
    return html + '</div>';
  }

  function jobInfo(id, n, ordered) {
    var j = (cat().nightJobs || {})[id] || { label: id };
    var bits = [];
    bits.push(j.gpuHours === 'rest' ? 'tout le reste' : ui.num(j.gpuHours, 0) + NB + 'H200-h');
    bits.push(j.valuePerGpuHour ? ui.money(j.valuePerGpuHour) + '/GPU-h' : ui.money(j.value));
    if (j.swapGB) bits.push('charge ' + ui.gb(j.swapGB));
    return '<span class="job-info">' + (n ? '<span class="job-n mono">' + n + '</span>' : '') + '<span><b>' + esc(j.label) + '</b>' + (ordered ? ' <span class="tag tag--accent">commande</span>' : '') + '<small class="mono">' + esc(bits.join(' · ')) + '</small>' +
      (j.risk ? '<small class="job-risk">' + ui.led('warn', 'données sensibles exposées') + '</small>' : '') + '</span></span>';
  }

  // ---------- Événements ----------
  function eventsPanel(S, m) {
    var evs = m.events || [];
    var T = G.eventTexts || {};
    return '<div class="week"><div class="room-head"><div><h3>La semaine à venir</h3><p class="muted">Des choses vont arriver. Une pile complète et un peu de personnel les transforment en non-événements.</p></div></div>' +
      '<ol class="week-days">' + evs.map(function (id) {
        var t = T[id] || {};
        return '<li><span class="mono">' + esc(t.day || '') + '</span><b>?</b></li>';
      }).join('') + '</ol></div>';
  }

  // ============ Simulation ============
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  ui.simStop = function () { timers.forEach(clearTimeout); timers = []; };

  ui.simScreen = function (S) {
    var m = G.app.mission(S.mid);
    var r = S.result;
    var html = '<section class="sim">' + ui.missionHead(m, 'Simulation');
    html += '<div class="sim-board">' +
      '<div class="sim-clock"><span class="mono sim-phase" id="sim-phase">Journée de bureau</span><b class="mono" id="sim-time">08:00</b></div>' +
      '<div class="sim-counters" id="sim-counters"></div>' +
      '<div class="sim-servers" id="sim-servers" aria-hidden="true">' + serverLeds(S) + '</div>' +
      '</div>';
    html += '<div class="sim-main"><div class="sim-chart" id="sim-chart">' + ui.dayChart((r.day && r.day.steps) || [], -1) + '</div><div id="sim-extra" class="sim-extra"></div></div>';
    html += '<div class="actions actions--end" id="sim-actions">' + ui.btn('Passer', 'sim-skip', { cls: 'btn--ghost', id: 'btn-skip' }) + '</div>';
    return html + '</section>';
  };

  function serverLeds(S) {
    var sv = (cat().servers || {})[S.setup.serverId] || {};
    var n = Math.min(4, S.setup.serverCount || 1);
    var g = Math.min(8, sv.count || 1);
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<div class="srv"><span class="mono">' + esc(sv.short || 'serveur') + '</span><span class="srv-leds">';
      for (var j = 0; j < g; j++) html += '<i style="--d:' + ((i * 3 + j) * 0.13 % 0.9).toFixed(2) + 's"></i>';
      html += '</span></div>';
    }
    return html;
  }

  function counters(step, m) {
    if (!step) return '';
    var ttft = step.ttft || {};
    var wl = ((m && m.workloads) || []).map(function (w) { return w.id; });
    var tt = wl.length ? wl.filter(function (id) { return ttft[id] != null; })[0] : 'chat';
    function c(label, v, cls) { return '<span class="ctr' + (cls ? ' ' + cls : '') + '"><em>' + esc(label) + '</em><b class="mono">' + v + '</b></span>'; }
    return c('Demande', ui.num(step.demand, 0)) + c('Servies', ui.num(step.served, 0)) +
      c('En file', ui.num(step.queued || 0, 0), step.queued > 0 ? 'is-warn' : '') +
      c('Refusées', ui.num(step.rejected || 0, 0), step.rejected > 0 ? 'is-crit' : '') +
      c('tok/s', ui.num(step.tokPerUser, 0)) +
      (tt ? c('1er jeton', ui.dur(ttft[tt])) : '') +
      (step.satisfaction != null ? c('Satisfaction', ui.num(step.satisfaction, 0)) : '');
  }

  function setLeds(step) {
    var box = document.getElementById('sim-servers');
    if (!box || !step) return;
    var u = step.gpuUtil != null ? step.gpuUtil : 0;
    if (u > 1.5) u = u / 100;
    box.style.setProperty('--util', u);
    box.classList.toggle('is-busy', u > 0.05);
    box.classList.toggle('is-hot', (step.memUsePct || 0) > 98 || (step.rejected || 0) > 0);
  }

  // Lance la séquence : salle → journée → nuit → événements.
  ui.simRun = function (S, done) {
    ui.simStop();
    var m = G.app.mission(S.mid);
    var r = S.result || {};
    var steps = (r.day && r.day.steps) || [];
    var reduce = ui.reducedMotion();
    var phases = [];
    if (m.special === 'room' && r.room && !(S.setup.room && S.setup.room.colocation)) phases.push('room');
    if (steps.some(function (st) { return (st.demand || 0) > 0; }) || !m.special) phases.push('day');
    if (m.special === 'night' && r.night) phases.push('night');
    if (m.special === 'events' && r.events && r.events.length) phases.push('events');
    S.simPhases = phases;
    var chartBox = document.getElementById('sim-chart');
    var anyDemand = steps.some(function (st) { return (st.demand || 0) > 0; });
    if (chartBox) {
      chartBox.hidden = !anyDemand;
      if (anyDemand) chartBox.innerHTML = ui.dayChart(steps, -1, chartBox.clientWidth - 26);
    }

    function finish() {
      ui.simStop();
      // État final de toutes les phases
      drawDay(steps, steps.length - 1, m);
      var extra = document.getElementById('sim-extra');
      if (extra) {
        var h = '';
        if (phases.indexOf('room') >= 0) h += roomPower(S, m, r.room, 99);
        if (phases.indexOf('night') >= 0) h += nightFill(S, m, r.night, 1);
        if (phases.indexOf('events') >= 0) h += eventCards(r.events, r.events.length, true);
        extra.innerHTML = h;
      }
      var ph = document.getElementById('sim-phase');
      if (ph) ph.textContent = 'Fin de la simulation';
      var tm = document.getElementById('sim-time');
      if (tm) tm.textContent = phases.indexOf('night') >= 0 ? '07:00' : '18:00';
      var act = document.getElementById('sim-actions');
      if (act) {
        act.innerHTML = ui.btn('Voir le débriefing', 'to-debrief', { cls: 'btn--primary btn--lg', id: 'btn-debrief' });
        var b = document.getElementById('btn-debrief');
        if (b) b.focus();
      }
      ui.announce('Simulation terminée.');
      if (done) done();
    }
    S.simFinish = finish;
    if (reduce) { finish(); return; }

    var i = 0;
    function nextPhase() {
      var p = phases[i++];
      if (!p) { finish(); return; }
      if (p === 'room') runRoom(nextPhase);
      else if (p === 'day') runDay(nextPhase);
      else if (p === 'night') runNight(nextPhase);
      else if (p === 'events') runEvents(nextPhase);
    }

    function runRoom(next) {
      setPhase('Mise sous tension', '07:45');
      var extra = document.getElementById('sim-extra');
      var n = (r.room.racks || []).length;
      var k = 0;
      (function step() {
        if (extra) extra.innerHTML = roomPower(S, m, r.room, k);
        if (k++ < n) later(step, 900); else later(next, 900);
      })();
    }
    function runDay(next) {
      setPhase('Journée de bureau', '08:00');
      var k = 0;
      var dt = Math.max(60, Math.round(9500 / Math.max(1, steps.length)));
      (function step() {
        if (k >= steps.length) { later(next, 400); return; }
        drawDay(steps, k, m);
        k++;
        later(step, dt);
      })();
    }
    function runNight(next) {
      setPhase('Nuit : travaux en lot', '19:00');
      var extra = document.getElementById('sim-extra');
      var t0 = 0, N = 40;
      (function step() {
        var f = t0 / N;
        if (extra) extra.innerHTML = nightFill(S, m, r.night, f);

    var i = a.indexOf(id), j = i + d;
    if (i < 0 || j < 0 || j >= a.length) return;
    a.splice(i, 1); a.splice(j, 0, id);
    refresh();
    var b = document.getElementById(d < 0 ? 'jb-up-' + id : 'jb-dn-' + id);
    if (b && b.disabled) b = document.getElementById(d < 0 ? 'jb-dn-' + id : 'jb-up-' + id);
    if (b) b.focus();
  }

  // ---------- Leviers (changements de formulaires) ----------
  function onKnobChange(el) {
    var key = el.getAttribute('data-knob');
    var s = S.setup;
    switch (key) {
      case 'serverCount': case 'maxContext': s[key] = parseInt(el.value, 10); break;
      case 'staffFTE': s[key] = parseFloat(el.value); break;
      case 'prefixCache': s[key] = !!el.checked; break;
      case 'colocation': s.room = s.room || {}; s.room.colocation = !!el.checked; S.roomSel = null; break;
      case 'stack': toggleStack(el.value, el.checked); break;
      default: s[key] = el.value;
    }
    refresh();
  }

  function toggleStack(id, on) {
    var L = (G.catalog && G.catalog.stackLayers) || {};
    var st = S.setup.stack = (S.setup.stack || []).slice();
    function add(x) {
      if (st.indexOf(x) < 0) st.push(x);
      ((L[x] && L[x].requires) || []).forEach(add);
    }
    function remove(x) {
      var i = st.indexOf(x);
      if (i >= 0) st.splice(i, 1);
      Object.keys(L).forEach(function (y) { if ((L[y].requires || []).indexOf(x) >= 0 && st.indexOf(y) >= 0) remove(y); });
    }
    if (on) add(id); else remove(id);
    S.setup.stack = st;
    document.querySelectorAll('input[data-knob="stack"]').forEach(function (cb) { cb.checked = st.indexOf(cb.value) >= 0; });
  }

  function onRoomUpgrade(el) {
    var room = S.setup.room;
    if (el.hasAttribute('data-room-rack')) {
      var rk = el.getAttribute('data-room-rack');
      room.rackUpgrades = room.rackUpgrades || {};
      var arr = (room.rackUpgrades[rk] || []).filter(function (x) { return x !== el.value; });
      if (el.checked) arr.push(el.value);
      room.rackUpgrades[rk] = arr;
    } else {
      var g = (room.upgrades || []).filter(function (x) { return x !== el.value; });
      if (el.checked) g.push(el.value);
      room.upgrades = g;
    }
    refresh();
  }

  // ---------- Glossaire ----------
  var lastFocus = null;
  function openGlossary() {
    var d = document.getElementById('glossary');
    var bd = document.getElementById('backdrop');
    if (!d) return;
    lastFocus = document.activeElement;
    d.innerHTML = ui.glossaryPanel();
    d.hidden = false;
    if (bd) bd.hidden = false;
    document.body.classList.add('has-drawer');
    var c = document.getElementById('gloss-close'); if (c) c.focus();
  }
  function closeGlossary() {
    var d = document.getElementById('glossary');
    var bd = document.getElementById('backdrop');
    if (!d || d.hidden) return;
    d.hidden = true;
    if (bd) bd.hidden = true;
    document.body.classList.remove('has-drawer');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // ---------- Rechargement à chaud (visionneuse claude.ai) ----------
  function snapshot() { /* les données sont lues à la demande par hot.snapshot */ }
  function hotData() {
    return { screen: S.screen, mid: S.mid, setup: S.setup, introIdx: S.introIdx };
  }

  // ---------- Démarrage ----------
  var booted = false;
  function start(data) {
    if (booted) return;
    booted = true;
    applyTheme();
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-act]');
      if (t && !t.disabled) {
        var fn = actions[t.getAttribute('data-act')];
        if (fn) { ev.preventDefault(); fn(t, ev); }
        return;
      }
      if (ev.target.id === 'backdrop') closeGlossary();
    });
    document.addEventListener('change', function (ev) {
      var el = ev.target;
      if (!el || !S.setup) return;
      if (el.hasAttribute('data-knob')) onKnobChange(el);
      else if (el.hasAttribute('data-room-rack') || el.hasAttribute('data-room-global')) onRoomUpgrade(el);
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeGlossary();
    });
    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(hotData);
    } catch (e) { /* ignore */ }

    // Restauration éventuelle
    data = data || {};
    var m = data.mid && app.mission(data.mid);
    if (m && ['briefing', 'config', 'debrief', 'comite', 'sim'].indexOf(data.screen) >= 0) {
      S.mid = m.id;
      S.setup = data.setup ? baseSetup(m, data.setup) : initSetup(m);
      if (data.screen === 'briefing') { S.screen = 'briefing'; }
      else if (data.screen === 'config') { S.screen = 'config'; }
      else {
        try { S.result = G.engine.evaluateMission(clone(S.setup), m); S.resultMid = m.id; S.screen = 'debrief'; } catch (e) { S.screen = 'config'; }
      }
      render({ focus: false });
    } else if (data.screen === 'intro') {
      S.introIdx = data.introIdx || 0;
      go('intro', { focus: false });
    } else {
      render({ focus: false });
    }
  }

  function boot() {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(start);
    else start((hot && hot.data) || {});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(globalThis.G = globalThis.G || {});

</script>
