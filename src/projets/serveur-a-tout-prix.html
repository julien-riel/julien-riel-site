<style>
/* styles.css */
/* Serveur à tout prix — « console de supervision rencontre bon de commande ».
   Mise en page : HUD collant en haut ; contenu centré (max 1200 px) ; configuration en deux colonnes
   (leviers à gauche, console sombre à droite), une seule colonne sous 900 px. */
:root {
  /* Neutres acier, légèrement bleutés */
  --bg: #e9edf2;
  --surface: #f7f9fb;
  --surface-2: #dfe5ec;
  --paper: #fbfcfd;
  --fg: #141b24;
  --muted: #546070;
  --line: #c6cfda;
  --line-strong: #8a96a7;
  /* Un accent : bleu cobalt de bon de commande */
  --accent: #2448e0;
  --accent-ink: #ffffff;
  --accent-soft: #dbe3ff;
  --accent-line: #9fb1f5;
  /* Voyants (sémantique séparée) */
  --ok: #18874a;
  --ok-soft: #d6efdf;
  --warn: #b86e00;
  --warn-soft: #f8e7c8;
  --crit: #cc2e26;
  --crit-soft: #f8dbd8;
  --led-off: #9aa5b3;
  /* Console de supervision (sombre dans les deux thèmes) */
  --console: #121a24;
  --console-2: #1b2532;
  --console-fg: #dbe3ec;
  --console-muted: #8795a7;
  --console-line: #2b3848;
  --console-accent: #7e97ff;
  --console-ok: #3fd486;
  --console-warn: #f3b443;
  --console-crit: #ff6258;
  --hatch: #5d6c80;
  --kv: #7e97ff;
  --kv-edge: #3b55c9;
  --weights: #c9d3e0;
  --weights-edge: #8a99ad;
  /* Graphique */
  --ch-demand: #8795a7;
  --ch-served: #7e97ff;
  --ch-tok: #3fd486;
  /* Avatars */
  --av-s: 52%;
  --av-l: 50%;
  --av-bg-s: 45%;
  --av-bg-l: 86%;
  --av-ink: #1b2129;
  --av-shirt: #f4f6f8;
  --av-robe: #23262d;
  --skin-1: #f1c9a5;
  --skin-2: #d49a70;
  --skin-3: #9a6443;
  --hair-gray: #b7bcc4;
  --hair-dark: #2b2523;
  --hair-brown: #6a4227;
  --hair-blond: #d8b05b;
  --stamp: #cc2e26;
  --shadow: 0 1px 0 rgba(20, 27, 36, .06), 0 8px 24px -12px rgba(20, 27, 36, .25);
  --backdrop: rgba(12, 18, 26, .45);

  --font-display: 'Chakra Petch', 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --fs-xs: .75rem; --fs-s: .8125rem; --fs-m: .9375rem; --fs-l: 1.0625rem; --fs-xl: 1.375rem; --fs-2xl: 1.875rem; --fs-3xl: clamp(2.25rem, 6vw, 3.75rem);
  --r: 4px;
  --r-l: 8px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c25; --surface-2: #1d2631; --paper: #18202a; --fg: #e4e9f0; --muted: #94a1b3;
    --line: #2a3542; --line-strong: #4b596b; --accent: #7e97ff; --accent-ink: #0b1230; --accent-soft: #1d2753; --accent-line: #3f53a8;
    --ok: #3fd486; --ok-soft: #12321f; --warn: #f3b443; --warn-soft: #3a2b0f; --crit: #ff6258; --crit-soft: #3d1614; --led-off: #4b596b;
    --console: #0a0f15; --console-2: #121a24; --console-fg: #dbe3ec; --console-muted: #7f8da0; --console-line: #223040;
    --weights: #aab6c6; --weights-edge: #6f7f94; --hatch: #4e5c70;
    --av-l: 56%; --av-bg-s: 30%; --av-bg-l: 26%; --av-shirt: #e9edf2; --av-robe: #0d0f13;
    --stamp: #ff6258;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .7);
    --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --surface-2: #1d2631; --paper: #18202a; --fg: #e4e9f0; --muted: #94a1b3;
  --line: #2a3542; --line-strong: #4b596b; --accent: #7e97ff; --accent-ink: #0b1230; --accent-soft: #1d2753; --accent-line: #3f53a8;
  --ok: #3fd486; --ok-soft: #12321f; --warn: #f3b443; --warn-soft: #3a2b0f; --crit: #ff6258; --crit-soft: #3d1614; --led-off: #4b596b;
  --console: #0a0f15; --console-2: #121a24; --console-fg: #dbe3ec; --console-muted: #7f8da0; --console-line: #223040;
  --weights: #aab6c6; --weights-edge: #6f7f94; --hatch: #4e5c70;
  --av-l: 56%; --av-bg-s: 30%; --av-bg-l: 26%; --av-shirt: #e9edf2; --av-robe: #0d0f13;
  --stamp: #ff6258;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .7);
  --backdrop: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--fs-m); line-height: 1.5;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }
.mono, .mono * { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
b.mono, .mono b { font-weight: 500; }
.muted { color: var(--muted); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.app:focus { outline: none; }

.eyebrow { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.title-xl { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -.01em; }
.title-l { font-size: var(--fs-2xl); font-weight: 700; }
.lede { font-size: var(--fs-l); max-width: 62ch; color: var(--fg); }
.h-sec { font-size: var(--fs-l); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

/* ---------- Coquille ---------- */
.shell { min-height: 100%; }
.app {
  max-width: 1240px; margin: 0 auto;
  padding-left: var(--gutter); padding-right: var(--gutter-r);
  padding-block: 24px 64px;
}

/* ---------- HUD ---------- */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.hud-inner {
  max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px 18px;
  padding-left: var(--gutter); padding-right: var(--gutter-r); padding-block: 8px;
  min-height: 52px;
}
.logo { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; letter-spacing: .02em; white-space: nowrap; }
.logo em { font-style: normal; color: var(--accent); }
.logo-mark { display: inline-grid; gap: 2px; width: 18px; }
.logo-mark i { display: block; height: 4px; border-radius: 1px; background: var(--fg); position: relative; }
.logo-mark i::after { content: ""; position: absolute; right: 2px; top: 1px; width: 2px; height: 2px; background: var(--ok); }
.logo-mark i:nth-child(2)::after { background: var(--accent); }
.hud-mission { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.hud-tag { font-size: var(--fs-xs); padding: 2px 6px; border: 1px solid var(--line-strong); border-radius: 2px; }
.hud-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud-stats { display: flex; gap: 16px; }
.hud-budget { margin-left: auto; padding-left: 12px; }
.hud-stat { display: flex; flex-direction: column; line-height: 1.1; }
.hud-stat em { font-style: normal; font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hud-stat b { font-size: var(--fs-m); }
.hud-tools { display: flex; gap: 6px; }
.tool { background: transparent; border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; cursor: pointer; font-size: var(--fs-s); font-weight: 600; min-height: 36px; }
.tool:hover { border-color: var(--line-strong); background: var(--surface-2); }
.tool--theme { width: 38px; padding: 0; display: grid; place-items: center; }
.tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
@media (max-width: 640px) {
  .hud-inner { flex-wrap: wrap; gap: 6px 12px; }
  .hud-mission { order: 3; flex-basis: 100%; }
  .hud-stats { margin-left: auto; gap: 12px; }
  .hud-mission { align-items: center; }
  .hud-mission:has(.hud-title.muted) { display: none; }
  .hud { position: static; }
  .hud-inner { min-height: 0; }
  .tool { min-height: 34px; padding: 4px 8px; }
}
.pv-mini { display: none; }
@media (max-width: 960px) {
  .app[data-screen="config"] { padding-bottom: 96px; }
  .pv-mini {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; align-items: center; gap: 14px;
    padding-left: var(--gutter); padding-right: var(--gutter-r); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--console); color: var(--console-fg); border-top: 1px solid var(--console-line);
  }
  .pv-mini span { display: grid; line-height: 1.15; min-width: 0; }
  .pv-mini em { font-style: normal; font-size: .625rem; letter-spacing: .08em; text-transform: uppercase; color: var(--console-muted); }
  .pv-mini b { font-size: var(--fs-s); white-space: nowrap; }
  .pv-mini .btn { margin-left: auto; min-height: 36px; padding: 4px 14px; }
  .pv-mini .led--ok i { background: var(--console-ok); box-shadow: 0 0 6px var(--console-ok); }
}

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 16px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  font-weight: 600; cursor: pointer; text-align: center; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn--ghost { background: transparent; }
.btn--lg { min-height: 48px; padding: 10px 22px; font-size: var(--fs-l); }
.btn--block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: var(--fs-s); }
.linkbtn--crit { color: var(--crit); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 24px; }
.actions--end { justify-content: flex-end; border-top: 1px dashed var(--line); padding-top: 18px; }
.ibtn { width: 32px; height: 32px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--font-mono); font-size: 15px; display: grid; place-items: center; }
.ibtn:hover:not([disabled]) { border-color: var(--line-strong); background: var(--surface-2); }
.ibtn[disabled] { opacity: .35; cursor: default; }
.ibtn--x:hover:not([disabled]) { color: var(--crit); border-color: var(--crit); }
.ibtn--add { color: var(--accent); border-color: var(--accent-line); }

/* ---------- Voyants, étoiles, jauges ---------- */
.led { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-s); }
.led i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--led-off); }
.led--ok i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.led--warn i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.led--crit i { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.stars { display: inline-flex; gap: 2px; }
.star { width: 18px; height: 18px; fill: none; stroke: var(--line-strong); stroke-width: 1.6; stroke-linejoin: round; }
.star.on { fill: var(--warn); stroke: var(--warn); }
.stars--big .star { width: 40px; height: 40px; }
.stars--big .star.on { animation: starpop .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--i) * 180ms + 200ms); }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }

.gauge { display: grid; gap: 6px; }
.gauge + .gauge { margin-top: 12px; }
.gauge-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.gauge-head b { font-size: var(--fs-xl); }
.gauge-track { position: relative; height: 10px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.gauge-track i { display: block; height: 100%; background: var(--led-off); transition: width .8s ease; }
.gauge-track s { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line-strong); opacity: .6; }
.gauge--ok .gauge-track i { background: var(--ok); }
.gauge--warn .gauge-track i { background: var(--warn); }
.gauge--crit .gauge-track i { background: var(--crit); }
.gauge--ok .gauge-head b { color: var(--ok); }
.gauge--crit .gauge-head b { color: var(--crit); }

.mbar { position: relative; height: 8px; background: var(--console-line); border-radius: 1px; overflow: hidden; display: flex; }
.mbar i { display: block; height: 100%; background: var(--console-ok); transition: width .35s ease; }
.mbar u { display: block; height: 100%; background: repeating-linear-gradient(135deg, var(--console-crit) 0 4px, transparent 4px 7px); position: absolute; right: 0; top: 0; }
.mbar--warn i { background: var(--console-warn); }
.mbar--crit i { background: var(--console-crit); }

.tag { display: inline-block; font-family: var(--font-mono); font-size: .6875rem; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag--accent { border-color: var(--accent-line); color: var(--accent); }
.tag--ok { border-color: var(--ok); color: var(--ok); }
.tag--warn { border-color: var(--warn); color: var(--warn); }
.tag--crit { border-color: var(--crit); color: var(--crit); }

/* ---------- Avatars et dialogues ---------- */
.avatar { display: inline-block; width: 52px; height: 52px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px hsl(var(--hue) var(--av-s) var(--av-l)); }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar--xl { width: 96px; height: 96px; }
.convo { display: grid; gap: 14px; }
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .bubble { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 2px var(--r-l) var(--r-l) var(--r-l); padding: 10px 14px 12px; min-width: 0; flex: 1; max-width: 68ch; box-shadow: var(--shadow); }
.say .bubble::before { content: ""; position: absolute; left: -7px; top: 14px; width: 12px; height: 12px; background: var(--surface); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble-who { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; margin-bottom: 4px; }
.bubble-who b { font-family: var(--font-display); font-size: var(--fs-m); color: hsl(var(--hue) 60% 38%); }
:root[data-theme="dark"] .bubble-who b { color: hsl(var(--hue) 70% 72%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bubble-who b { color: hsl(var(--hue) 70% 72%); } }
.bubble-who span { font-size: var(--fs-xs); color: var(--muted); }
.say.is-new { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Écrans génériques ---------- */
.notice { max-width: 640px; margin: 40px auto; padding: 24px; border: 1px dashed var(--line-strong); border-radius: var(--r-l); background: var(--surface); display: grid; gap: 12px; }
.mhead { display: grid; gap: 6px; margin-bottom: 22px; }
.mhead-sub { color: var(--muted); font-size: var(--fs-l); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 28px; align-items: start; }
.split > * { min-width: 0; }
.split-side { display: grid; gap: 18px; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Accueil ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; padding: 20px 0 28px; border-bottom: 2px solid var(--fg); }
.hero-text { display: grid; gap: 16px; min-width: 0; }
.hero .actions { margin-top: 4px; }
.org { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); max-width: 560px; }
.org > div { display: grid; min-width: 0; }
.org span { color: var(--muted); font-size: var(--fs-s); }
.org-badge { font-weight: 600; padding: 6px 8px; background: var(--fg); color: var(--bg); border-radius: 2px; font-size: var(--fs-s); }
.hero-art { width: 220px; }
.rack-art { background: var(--console); border: 3px solid var(--console-line); border-radius: 4px; padding: 10px 10px 14px; display: grid; gap: 5px; position: relative; box-shadow: var(--shadow); }
.rack-top { color: var(--console-muted); font-size: .625rem; letter-spacing: .1em; padding-bottom: 4px; border-bottom: 1px solid var(--console-line); }
.ru { height: 22px; background: var(--console-2); border: 1px solid var(--console-line); border-radius: 2px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.ru-2 { height: 36px; } .ru-3 { height: 50px; }
.ru-label { color: var(--console-muted); font-size: .5625rem; letter-spacing: .08em; }
.ru-leds { display: flex; gap: 3px; }
.ru-leds i { width: 5px; height: 5px; border-radius: 50%; background: var(--console-ok); animation: blink 1.4s steps(2, start) infinite; animation-delay: var(--d); }
.ru-leds i:nth-child(4) { background: var(--console-accent); }
.rack-tag { position: absolute; right: -26px; bottom: 26px; transform: rotate(8deg); background: var(--warn-soft); color: var(--fg); border: 1px solid var(--warn); font-size: .625rem; line-height: 1.2; padding: 6px 8px; box-shadow: var(--shadow); }
.rack-tag small { font-size: .5625rem; color: var(--muted); }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero-art { display: none; } }

.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 28px 0 14px; }
.sec-head h2 { font-size: var(--fs-xl); }
.mgrid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mgrid > li { min-width: 0; display: flex; }
.mtile {
  width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr auto; gap: 8px 14px;
  padding: 14px 14px 12px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--paper);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.mtile:hover:not([disabled]) { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
.mtile-num { grid-row: 1 / 3; font-size: 1.5rem; font-weight: 600; color: var(--accent); border-right: 1px dashed var(--line-strong); padding-right: 12px; }
.mtile-body { display: grid; gap: 2px; min-width: 0; }
.mtile-body b { font-family: var(--font-display); font-size: var(--fs-l); line-height: 1.2; }
.mtile-body span { color: var(--muted); font-size: var(--fs-s); }
.mtile-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--muted); }
.mtile.is-locked { opacity: .55; cursor: not-allowed; background-image: repeating-linear-gradient(135deg, transparent 0 10px, var(--surface-2) 10px 12px); }
.mtile.is-done .mtile-num { color: var(--ok); }
.mtile--finale { border-style: dashed; }
.home-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 18px; font-size: var(--fs-s); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--crit); }

/* ---------- Intro ---------- */
.dialog-screen { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }

/* ---------- Briefing ---------- */
.po-card { background: var(--paper); border: 1px solid var(--line-strong); border-radius: 2px; padding: 0 16px 16px; box-shadow: var(--shadow); }
.po-head { display: flex; justify-content: space-between; gap: 8px; font-size: .6875rem; letter-spacing: .08em; color: var(--accent); border-bottom: 2px solid var(--accent); padding: 10px 0 6px; margin-bottom: 12px; }
.po-card h3 { font-size: var(--fs-xl); margin-bottom: 8px; }
.po-sub { font-weight: 600; font-size: var(--fs-s); margin-top: 10px; }
.po-list { list-style: none; display: grid; gap: 6px; margin-top: 6px; }
.po-list li { display: flex; gap: 10px; align-items: flex-start; }
.box { flex: none; width: 14px; height: 14px; margin-top: 4px; border: 1.5px solid var(--fg); border-radius: 1px; }
.po-list--bonus .box { border-style: dashed; border-color: var(--muted); }
.po-meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 22px; margin: 16px 0 0; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
.po-meta dt { font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.po-meta dd { margin: 0; font-weight: 500; }
.concepts h3 { font-size: var(--fs-m); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: help; font-size: var(--fs-s); }
.chip[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip-def { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--accent-line); border-radius: var(--r); background: var(--accent-soft); font-size: var(--fs-s); }

/* ---------- Configuration ---------- */
.cfg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 24px; align-items: start; }
.cfg > * { min-width: 0; }
.cfg-left { display: grid; gap: 18px; }
.cfg-right { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); }
@media (max-width: 960px) { .cfg { grid-template-columns: minmax(0, 1fr); } .cfg-right { position: static; } }
.knobs { display: grid; gap: 18px; }
.kgroup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 16px; display: grid; gap: 16px; }
.kgroup-title { font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.kgroup-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.knob { display: grid; gap: 8px; min-width: 0; }
.knob-label { font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.opt { position: relative; display: flex; min-width: 0; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.opt-body { flex: 1; display: grid; gap: 6px; align-content: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); transition: border-color .15s, box-shadow .15s; min-width: 0; }
.opt:hover .opt-body { border-color: var(--line-strong); }
.opt input:checked + .opt-body { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
.opt input:focus-visible + .opt-body { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt-head { display: grid; }
.opt-head b { font-family: var(--font-display); font-size: var(--fs-m); line-height: 1.2; }
.opt-head small { color: var(--muted); font-size: var(--fs-xs); }
.opt-stats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.stat { display: flex; justify-content: space-between; gap: 6px; font-size: var(--fs-xs); border-bottom: 1px dotted var(--line); padding-bottom: 1px; min-width: 0; }
.stat em { font-style: normal; color: var(--muted); }
.stat b { font-weight: 500; white-space: nowrap; }
.opt-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.opt-blurb { font-size: var(--fs-xs); color: var(--muted); line-height: 1.4; }
.seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; width: fit-content; max-width: 100%; }
.seg-opt { position: relative; cursor: pointer; }
.seg-opt + .seg-opt { border-left: 1px solid var(--line); }
.seg-opt input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.seg-opt span { display: block; padding: 7px 12px; font-size: var(--fs-s); min-height: 36px; background: var(--paper); }
.seg-opt:hover span { background: var(--surface-2); }
.seg-opt input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg-opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: -3px; }
.switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch-track { flex: none; width: 40px; height: 22px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-strong); position: relative; transition: background .15s; margin-top: 1px; }
.switch-track i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--line-strong); transition: transform .15s, background .15s; }
.switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .switch-track i { transform: translateX(18px); background: var(--accent-ink); }
.switch input:focus-visible + .switch-track { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch-text { display: grid; min-width: 0; }
.switch-text small { color: var(--muted); font-size: var(--fs-xs); }
.stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.stack-group { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px 10px; margin: 0; min-width: 0; display: grid; gap: 8px; background: var(--paper); }
.stack-group legend { font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; min-width: 0; }
.check input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.check > span { display: grid; min-width: 0; }
.check small { font-size: var(--fs-xs); color: var(--muted); }
.check small.mono { color: var(--fg); }
.check small.req { color: var(--warn); }
.check--sm b { font-weight: 500; font-size: var(--fs-s); }
.locked { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 16px; margin: 0; }
.locked > div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line-strong); padding-bottom: 3px; font-size: var(--fs-s); min-width: 0; }
.locked dt { color: var(--muted); }
.locked dd { margin: 0; font-family: var(--font-mono); text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kgroup--locked { background: transparent; border-style: dashed; }

/* ---------- Console d'aperçu ---------- */
.console { background: var(--console); color: var(--console-fg); border-radius: var(--r-l); padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); border: 1px solid var(--console-line); }
.console .muted { color: var(--console-muted); }
.console-head { display: flex; justify-content: space-between; align-items: center; font-size: .6875rem; letter-spacing: .12em; color: var(--console-muted); }
.console .led--ok i { background: var(--console-ok); box-shadow: 0 0 6px var(--console-ok); }
.console .led--warn i { background: var(--console-warn); box-shadow: 0 0 6px var(--console-warn); }
.console .led--crit i { background: var(--console-crit); box-shadow: 0 0 6px var(--console-crit); }
.console-hint:empty { display: none; }
.console-hint .say { animation: rise .3s ease both; }
.console-hint .avatar { width: 40px; height: 40px; box-shadow: 0 0 0 2px var(--console), 0 0 0 3px hsl(var(--hue) var(--av-s) var(--av-l)); }
.console-hint .bubble { background: var(--console-2); border-color: var(--console-line); color: var(--console-fg); box-shadow: none; font-size: var(--fs-s); }
.console-hint .bubble::before { background: var(--console-2); border-color: var(--console-line); }
.console-hint .bubble-who b { color: hsl(var(--hue) 70% 74%); }
.console-hint .bubble-who span { color: var(--console-muted); }
.cz { border-top: 1px solid var(--console-line); padding-top: 10px; display: grid; gap: 6px; }
.cz-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: var(--fs-s); }
.cz-head span { color: var(--console-muted); text-transform: uppercase; letter-spacing: .08em; font-size: .6875rem; }
.cz-head b { font-size: var(--fs-m); text-align: right; }
.cz-note { font-size: var(--fs-xs); color: var(--console-muted); }
.kv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: var(--fs-s); }
.kv-row span { color: var(--console-muted); }
.kv-row em { font-style: normal; font-size: var(--fs-xs); color: var(--console-accent); }
.kv-row--big b { font-size: var(--fs-xl); color: var(--console-fg); }
.leds { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.warns { list-style: none; display: grid; gap: 4px; font-size: var(--fs-xs); color: var(--console-muted); }
.warns li::before { content: "› "; color: var(--console-warn); }
.special .warns, .room .warns { color: var(--muted); }
.console-msg { color: var(--console-warn); font-size: var(--fs-s); }
.console-actions { display: grid; gap: 8px; border-top: 1px solid var(--console-line); padding-top: 12px; }
.console .btn--ghost { color: var(--console-fg); border-color: var(--console-line); }
.console .btn--ghost:hover { background: var(--console-2); }
.console-foot { font-size: .6875rem; color: var(--console-muted); line-height: 1.4; }

/* Barre de VRAM façon Tetris */
.vram { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); gap: 14px; align-items: end; }
.vram-stage { position: relative; height: 250px; padding-top: 10px; overflow: hidden; }
.well { position: absolute; left: 0; right: 48px; top: 10px; bottom: 0; border: 3px solid var(--console-muted); border-top: 0; border-radius: 0 0 3px 3px; overflow: hidden; background: var(--console-2); }
.well-grid { position: absolute; inset: 0; background-image: linear-gradient(90deg, var(--console-line) 1px, transparent 1px); background-size: calc(100% / 6) 100%; opacity: .7; }
.blk { position: absolute; left: 0; right: 0; bottom: 0; transition: height .4s cubic-bezier(.3, 1.3, .5, 1), bottom .4s cubic-bezier(.3, 1.3, .5, 1); }
.blk-w { background: var(--weights); border-top: 2px solid var(--weights-edge); display: grid; place-items: center; overflow: hidden; }
.blk-w span { font-family: var(--font-mono); font-size: .6875rem; color: var(--console); letter-spacing: .1em; text-transform: uppercase; }
.blk-o { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); border-top: 1px dashed var(--weights-edge); }
.kv-layer { position: absolute; inset: 0; }
.kv-layer i { position: absolute; display: block; padding: 1px; transition: bottom .3s ease, height .3s ease, left .3s ease; }
.kv-layer i::before { content: ""; display: block; width: 100%; height: 100%; background: var(--kv); border: 1px solid var(--kv-edge); border-radius: 1px; }
.kv-layer i.drop { animation: dropin .45s cubic-bezier(.4, 1.5, .6, 1) both; }
@keyframes dropin { from { transform: translateY(-260px); } to { transform: none; } }
.well.is-over { border-color: var(--console-crit); }
.well.is-over .blk-w { background: repeating-linear-gradient(0deg, var(--weights) 0 10px, var(--console-crit) 10px 12px); }
.well-over { position: absolute; top: 6px; left: 6px; right: 6px; padding: 4px 6px; background: var(--console-crit); color: var(--console); font-family: var(--font-mono); font-size: .6875rem; font-weight: 600; text-align: center; border-radius: 2px; z-index: 2; }
.spill { position: absolute; right: 0; top: 0; bottom: 0; width: 44px; }
.spill i { position: absolute; top: -14px; left: var(--x); width: 12px; height: 10px; background: var(--console-crit); border: 1px solid var(--console); animation: spill 2.4s cubic-bezier(.5, 0, .9, .6) infinite; animation-delay: var(--d); }
@keyframes spill { 0% { transform: translateY(0) rotate(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(270px) rotate(var(--r)); opacity: 0; } }
.vram-legend { display: grid; gap: 5px; font-size: var(--fs-xs); min-width: 0; }
.lg { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.lg span { color: var(--console-muted); min-width: 0; }
.lg b { color: var(--console-fg); }
.lg-sub { grid-template-columns: minmax(0, 1fr); padding-left: 18px; }
.lg-total { grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid var(--console-line); padding-top: 5px; }
.lg-crit span, .lg-crit b { color: var(--console-crit); }
.sw { width: 12px; height: 12px; display: inline-block; border-radius: 1px; }
.sw-w { background: var(--weights); }
.sw-o { background: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 4px); border: 1px solid var(--hatch); }
.sw-k { background: var(--kv); }
.sw-f { background: var(--console-2); border: 1px solid var(--console-muted); }
.sw-x { background: var(--console-crit); }
@media (max-width: 420px) { .vram { grid-template-columns: minmax(0, 130px) minmax(0, 1fr); gap: 10px; } }

/* ---------- Panneaux spéciaux ---------- */
.special { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 16px; }
.room-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.room-head h3 { font-size: var(--fs-xl); }
.room-head p { font-size: var(--fs-s); }
.pilot { display: grid; gap: 10px; }
.pilot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.pilot-tag { font-size: var(--fs-xs); letter-spacing: .1em; color: var(--accent); }
.pilot .btn { justify-self: start; }
.pilot.is-done .pilot-head { border-color: var(--ok); }

.dock { border: 2px dashed var(--line-strong); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; margin-bottom: 14px; background: repeating-linear-gradient(135deg, transparent 0 14px, var(--surface-2) 14px 16px); }
.dock-label { font-size: .6875rem; letter-spacing: .12em; color: var(--muted); }
.dock-list, .rack-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.schip { display: inline-flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--paper); overflow: hidden; max-width: 100%; }
.schip-main { border: 0; background: none; cursor: pointer; padding: 6px 10px; text-align: left; display: grid; min-width: 0; }
.schip-main b { font-size: var(--fs-s); }
.schip-main span { font-size: var(--fs-xs); color: var(--muted); }
.schip-x { border: 0; border-left: 1px solid var(--line); background: none; cursor: pointer; padding: 0 10px; font-size: 16px; }
.schip-x:hover { color: var(--crit); }
.schip.is-sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.schip.is-sel .schip-main { background: var(--accent); color: var(--accent-ink); }
.schip.is-sel .schip-main span { color: var(--accent-ink); }
.racks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .racks { grid-template-columns: minmax(0, 1fr); } }
.rack { display: grid; gap: 8px; align-content: start; min-width: 0; }
.rack-body { display: grid; gap: 8px; text-align: left; cursor: pointer; padding: 10px; border-radius: var(--r); background: var(--console); color: var(--console-fg); border: 3px solid var(--console-line); min-height: 210px; align-content: start; transition: border-color .15s, transform .1s; }
.rack-body:hover:not([disabled]) { border-color: var(--console-accent); }
.rack-body[disabled] { opacity: .45; cursor: not-allowed; }
.rack-body.is-flash { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.rack--crit .rack-body { border-color: var(--console-crit); }
.rack--warn .rack-body { border-color: var(--console-warn); }
.rack-top { display: flex; justify-content: space-between; gap: 6px; font-size: var(--fs-xs); flex-wrap: wrap; }
.rack-top span { color: var(--console-muted); }
.rack-units { display: grid; gap: 4px; min-height: 90px; align-content: end; padding: 6px; background: var(--console-2); border-radius: 2px; background-image: linear-gradient(var(--console-line) 1px, transparent 1px); background-size: 100% 10px; }
.unit { min-height: var(--h); display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 6px; background: var(--console-line); border-left: 3px solid var(--console-accent); font-size: .6875rem; border-radius: 1px; }
.rack-empty { color: var(--console-muted); font-size: .6875rem; text-align: center; padding: 20px 0; }
.rack-leds { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: var(--fs-xs); }
.rack-leds .led { font-size: var(--fs-xs); }
.rack-leds .led--ok i { background: var(--console-ok); box-shadow: 0 0 6px var(--console-ok); }
.rack-leds .led--warn i { background: var(--console-warn); box-shadow: 0 0 6px var(--console-warn); }
.rack-leds .led--crit i { background: var(--console-crit); box-shadow: 0 0 6px var(--console-crit); }
.rack-ups { display: grid; gap: 6px; }
.room-global { display: grid; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-strong); }
.room-cool { background: var(--console); color: var(--console-fg); padding: 10px 12px; border-radius: var(--r); display: grid; gap: 6px; }
.ups-global { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px 10px; margin: 0; display: grid; gap: 8px; }
.ups-global legend { font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px; }
.room-sum { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: var(--fs-s); }
.room.is-coloc .racks, .room.is-coloc .dock { opacity: .5; }

/* Nuit */
.tl { position: relative; padding-bottom: 22px; }
.tl-track { position: relative; height: 44px; background: var(--console); border-radius: var(--r); overflow: hidden; border: 1px solid var(--console-line); background-image: linear-gradient(90deg, var(--console-line) 1px, transparent 1px); background-size: calc(100% / 12) 100%; }
.tl-seg { position: absolute; top: 5px; bottom: 5px; border-radius: 2px; overflow: hidden; background: var(--console-2); border: 1px solid var(--console-accent); display: grid; place-items: center; }
.tl-seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--console-accent); opacity: .85; }
.tl-seg span { position: relative; font-family: var(--font-mono); font-size: .6875rem; color: var(--console-fg); font-weight: 600; }
.tl-seg--swap { border-color: var(--console-warn); background: repeating-linear-gradient(135deg, var(--console-2) 0 3px, transparent 3px 6px); }
.tl-seg--swap i { background: var(--console-warn); opacity: .6; }
.tl-seg.is-cut { border-color: var(--console-crit); }
.tl-seg.is-cut i { background: var(--console-crit); }
.tl-ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; font-size: .6875rem; color: var(--muted); }
.tl-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-ticks span:first-child { transform: none; }
.tl-ticks span:last-child { transform: translateX(-100%); }
.night-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
.night-sum span { display: grid; padding: 8px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.night-sum em { font-style: normal; font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.night-sum b { font-size: var(--fs-l); }
.jobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
@media (max-width: 700px) { .jobs { grid-template-columns: minmax(0, 1fr); } }
.jobs-col { min-width: 0; display: grid; gap: 8px; align-content: start; }
.jobs-col h4 { font-size: var(--fs-m); }
.joblist { list-style: none; display: grid; gap: 6px; }
.job { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); min-width: 0; }
.job--on { border-color: var(--accent-line); background: var(--accent-soft); }
.job-info { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.job-info > span:last-child { display: grid; min-width: 0; }
.job-info b { font-size: var(--fs-s); font-weight: 600; }
.job-info small { font-size: var(--fs-xs); color: var(--muted); }
.job-n { flex: none; width: 22px; height: 22px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 2px; font-size: var(--fs-xs); }
.job-btns { display: flex; gap: 4px; flex: none; }
.jobs-empty { font-size: var(--fs-s); }

/* Événements (aperçu) */
.week-days { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.week-days li { display: grid; place-items: center; width: 72px; height: 72px; border: 1px dashed var(--line-strong); border-radius: var(--r); background: var(--paper); }
.week-days li span { font-size: .6875rem; color: var(--muted); }
.week-days li b { font-family: var(--font-display); font-size: 1.5rem; color: var(--accent); }

/* ---------- Simulation ---------- */
.sim-board { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--console); color: var(--console-fg); border-radius: var(--r-l); padding: 14px 16px; border: 1px solid var(--console-line); }
@media (max-width: 760px) { .sim-board { grid-template-columns: minmax(0, 1fr); } }
.sim-clock { display: grid; }
.sim-phase { font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--console-muted); }
.sim-clock b { font-size: 2.5rem; line-height: 1; color: var(--console-ok); font-weight: 500; }
.sim-counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px 12px; min-width: 0; }
.ctr { display: grid; }
.ctr em { font-style: normal; font-size: .6875rem; color: var(--console-muted); text-transform: uppercase; letter-spacing: .06em; }
.ctr b { font-size: var(--fs-l); }
.ctr.is-warn b { color: var(--console-warn); }
.ctr.is-crit b { color: var(--console-crit); }
.sim-servers { display: grid; gap: 6px; }
.srv { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 4px 8px; background: var(--console-2); border: 1px solid var(--console-line); border-radius: 2px; font-size: .6875rem; color: var(--console-muted); }
.srv-leds { display: flex; gap: 3px; }
.srv-leds i { width: 7px; height: 7px; border-radius: 50%; background: var(--console-line); }
.sim-servers.is-busy .srv-leds i { background: var(--console-ok); animation: blink calc(1.4s - var(--util, .5) * 1.1s) steps(2, start) infinite; animation-delay: var(--d); }
.sim-servers.is-hot .srv-leds i { background: var(--console-warn); }
.sim-main { display: grid; gap: 16px; margin-top: 16px; }
.sim-chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.chart { width: 100%; height: auto; display: block; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-tick { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.ch-tick--t { fill: var(--ok); }
.ch-axis { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.ch-demand-area { fill: var(--ch-demand); opacity: .18; }
.ch-served-area { fill: var(--accent); opacity: .28; }
.ch-demand { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.ch-served { fill: none; stroke: var(--accent); stroke-width: 2.2; }
.ch-tok { fill: none; stroke: var(--ok); stroke-width: 2; }
.ch-dot { fill: var(--ok); stroke: var(--surface); stroke-width: 2; }
.ch-now { stroke: var(--line-strong); stroke-dasharray: 2 3; }
.ch-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }
.ch-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw-demand { background: none; border-top: 2px dashed var(--muted); height: 0; width: 16px; }
.sw-served { background: var(--accent); }
.sw-tok { background: var(--ok); height: 3px; width: 16px; }
.sim-extra:empty { display: none; }
.power { display: grid; gap: 10px; }
.power-racks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.prack { display: grid; gap: 6px; justify-items: center; padding: 12px; background: var(--console); color: var(--console-fg); border-radius: var(--r); border: 2px solid var(--console-line); transition: border-color .3s; }
.prack--ok { border-color: var(--console-ok); }
.prack--crit { border-color: var(--console-crit); }
.prack--crit .mono:last-child { color: var(--console-crit); }
.breaker { width: 28px; height: 40px; border: 2px solid var(--console-muted); border-radius: 3px; position: relative; }
.breaker i { position: absolute; left: 4px; right: 4px; height: 14px; bottom: 4px; background: var(--console-muted); border-radius: 2px; transition: bottom .2s; }
.prack--ok .breaker i { bottom: 20px; background: var(--console-ok); }
.breaker.is-tripped i { bottom: 4px; background: var(--console-crit); }
.prack--crit { animation: shake .35s 2; }
.thermo { display: flex; align-items: center; gap: 12px; }
.thermo-bar { width: 14px; height: 70px; border: 2px solid var(--line-strong); border-radius: 7px; position: relative; overflow: hidden; background: var(--surface); }
.thermo-bar i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ok); transition: height .6s; }
.thermo-bar i.is-hot { background: var(--crit); }
.thermo > span { display: grid; }
.thermo em { font-style: normal; font-size: var(--fs-xs); color: var(--muted); }
.thermo b { font-size: var(--fs-xl); }
.nightsim .tl { margin-top: 4px; }
.evlist { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.ev { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.ev--ok { border-color: var(--ok); background: var(--ok-soft); }
.ev--crit { border-color: var(--crit); background: var(--crit-soft); }
.ev.is-new { animation: rise .4s ease both; }
.ev-head { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); }
.ev-verdict { font-weight: 600; letter-spacing: .08em; }
.ev--ok .ev-verdict { color: var(--ok); }
.ev--crit .ev-verdict { color: var(--crit); }
.ev h4 { font-size: var(--fs-l); }
.ev p { font-size: var(--fs-s); }
.ev-out { padding-top: 6px; border-top: 1px dashed var(--line); }

/* ---------- Débriefing ---------- */
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 16px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); margin-bottom: 24px; }
.verdict--ok { border-color: var(--ok); background: var(--ok-soft); }
.verdict--crit { border-color: var(--crit); background: var(--crit-soft); }
.verdict-stamp { font-size: var(--fs-l); font-weight: 600; letter-spacing: .1em; padding: 4px 10px; border: 2px solid currentColor; transform: rotate(-2deg); }
.verdict--ok .verdict-stamp { color: var(--ok); }
.verdict--crit .verdict-stamp { color: var(--crit); }
.verdict p { flex: 1 1 220px; min-width: 0; }
.objs { list-style: none; display: grid; gap: 6px; margin-bottom: 20px; }
.obj { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.obj-label small { color: var(--muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; margin-left: 4px; }
.obj b { white-space: nowrap; }
.obj--crit b { color: var(--crit); }
.obj--ok b { color: var(--ok); }
.lesson { margin-top: 22px; padding: 16px 18px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r); display: grid; gap: 8px; }
.lesson h3 { font-size: var(--fs-xl); }
.lesson ul { padding-left: 20px; display: grid; gap: 4px; }
.hood { margin-top: 18px; border: 1px solid var(--console-line); background: var(--console); color: var(--console-fg); border-radius: var(--r); }
.hood summary { cursor: pointer; padding: 12px 14px; font-family: var(--font-display); font-weight: 600; }
.hood summary .muted { color: var(--console-muted); font-family: var(--font-body); font-weight: 400; font-size: var(--fs-s); }
.hood dl { margin: 0; padding: 0 14px 14px; display: grid; gap: 10px; }
.hood dt { font-size: var(--fs-xs); color: var(--console-muted); text-transform: uppercase; letter-spacing: .06em; }
.hood dd { margin: 0; font-size: var(--fs-s); color: var(--console-ok); overflow-wrap: anywhere; }
.gauges, .costs, .risks { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.table-wrap { overflow-x: auto; }
.ct { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.ct td { padding: 4px 0; border-bottom: 1px dotted var(--line-strong); vertical-align: top; }
.ct td.mono { text-align: right; white-space: nowrap; padding-left: 12px; }
.ct-group th { text-align: left; font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 0 2px; font-weight: 600; }
.ct-total td { font-weight: 600; border-bottom: 0; border-top: 2px solid var(--fg); padding-top: 6px; }
.ct-total + .ct-total td { border-top: 0; }
.risks ul { list-style: none; display: grid; gap: 6px; }
.risks li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: var(--fs-s); }
.risks b { color: var(--crit); }

/* ---------- Comité ---------- */
.boardroom { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 22px; align-items: start; padding: 22px; border-radius: var(--r-l); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.board-wall { grid-column: 1 / -1; font-size: .6875rem; letter-spacing: .14em; color: var(--muted); border-bottom: 1px solid var(--line-strong); padding-bottom: 8px; }
.board-chair { display: grid; justify-items: center; gap: 6px; text-align: center; max-width: 140px; }
.board-name { display: grid; }
.board-name span { font-size: var(--fs-xs); color: var(--muted); }
.board-q { background: var(--paper); border: 1px solid var(--line-strong); padding: 16px 18px; border-radius: 2px var(--r-l) var(--r-l) var(--r-l); font-size: var(--fs-l); font-weight: 500; min-width: 0; position: relative; box-shadow: var(--shadow); }
.board-table { grid-column: 1 / -1; height: 16px; border-radius: 50% / 100% 100% 0 0; background: var(--line-strong); opacity: .5; margin: 0 -10px -22px; }
@media (max-width: 560px) { .boardroom { grid-template-columns: minmax(0, 1fr); } .board-chair { grid-auto-flow: column; justify-items: start; align-items: center; max-width: none; text-align: left; } .avatar--xl { width: 64px; height: 64px; } }
.stamp { position: absolute; right: 24px; bottom: 26px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 5vw, 2.5rem); letter-spacing: .12em; color: var(--stamp); border: 4px double var(--stamp); padding: 4px 14px; transform: rotate(-12deg); background: var(--paper); opacity: .92; pointer-events: none; }
.stamp--anim { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.6); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-12deg) scale(1); opacity: .92; } }
.answers { display: grid; gap: 8px; margin-top: 16px; }
.answer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.answer:hover:not([disabled]) { border-color: var(--accent); background: var(--paper); }
.answer-key { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 2px; font-size: var(--fs-s); }
.answer.is-wrong { border-color: var(--crit); background: var(--crit-soft); opacity: .85; cursor: not-allowed; text-decoration: line-through; text-decoration-color: var(--crit); }
.answer.is-right { border-color: var(--ok); background: var(--ok-soft); }
.answer.is-right .answer-key { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.answer[disabled] { cursor: default; }
.feedback { margin-top: 14px; }
.feedback--crit .say { animation: shake .35s; }

/* ---------- Finale ---------- */
.memo { background: var(--paper); border: 1px solid var(--line-strong); border-radius: 2px; padding: 22px clamp(16px, 4vw, 34px); box-shadow: var(--shadow); display: grid; gap: 18px; max-width: 860px; }
@media (min-width: 641px) { .memo { padding-left: 64px; background-image: linear-gradient(90deg, transparent 40px, var(--crit-soft) 40px, var(--crit-soft) 42px, transparent 42px); } }
.memo-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; border-bottom: 3px double var(--fg); padding-bottom: 14px; }
@media (max-width: 640px) { .memo-head { grid-template-columns: minmax(0, 1fr); } }
.memo-org { font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.memo-head h2 { font-size: var(--fs-xl); margin-top: 6px; }
.memo-meta { margin: 0; font-size: var(--fs-xs); display: grid; gap: 2px; }
.memo-meta > div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px; }
.memo-meta dt { color: var(--muted); }
.memo-meta dd { margin: 0; }
.memo-sec h3 { font-size: var(--fs-m); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; color: var(--accent); }
.memo-sec ul { padding-left: 20px; display: grid; gap: 4px; }
.memo-note { font-size: var(--fs-s); color: var(--warn); }
.memo-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px dashed var(--line-strong); padding-top: 14px; }
.dossier-raw { width: 100%; min-height: 220px; font-family: var(--font-mono); font-size: var(--fs-xs); background: var(--surface); color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 10px; }
.final-title { text-align: center; padding: 30px 16px; margin: 22px 0; border: 2px solid var(--fg); border-radius: 2px; background: var(--paper); display: grid; gap: 10px; justify-items: center; }
.final-title .lede { margin: 0 auto; }
.recap { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.recap th { text-align: left; font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--fg); }
.recap td { padding: 8px; border-bottom: 1px dotted var(--line-strong); }

/* ---------- Glossaire (tiroir) ---------- */
.backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(420px, 100%);
  background: var(--surface); border-left: 1px solid var(--line-strong); overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  box-shadow: var(--shadow); animation: slidein .25s ease both;
}
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; position: sticky; top: -16px; background: var(--surface); padding: 6px 0; }
.drawer-head h2 { font-size: var(--fs-xl); }
.gloss { margin: 0; display: grid; gap: 14px; }
.gloss dt { font-family: var(--font-display); font-weight: 600; }
.gloss dd { margin: 2px 0 0; font-size: var(--fs-s); color: var(--fg); }
body.has-drawer { overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .spill i { display: none; }
}

/* ---------- Pourquoi ça a raté : leviers, diagnostic, dernière journée ---------- */
.obj-lever { display: block; margin-top: 2px; font-size: var(--fs-xs); color: var(--muted); }
.obj--crit .obj-lever { color: var(--fg); }
.diag { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--crit); background: var(--crit-soft); border-radius: var(--r); display: grid; gap: 10px; }
.diag .h-sec { margin-bottom: 0; }
.diag .warns { color: var(--fg); font-size: var(--fs-s); }
.diag .warns li::before { color: var(--crit); }
.lastrun { padding: 12px 14px; border: 1px solid var(--crit); background: var(--crit-soft); border-radius: var(--r); display: grid; gap: 6px; margin-bottom: 16px; }
.lastrun--warn { border-color: var(--warn); background: var(--warn-soft); }
.lastrun ul { list-style: none; display: grid; gap: 6px; }
.lastrun li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: var(--fs-s); }
.lastrun li .led { padding-top: 3px; }
.lastrun small { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; }
.knob.is-flagged { padding: 10px 12px; margin-inline: -12px; border: 1px dashed var(--warn); border-radius: var(--r); }
.knob-label .tag { margin-left: 6px; vertical-align: 1px; }

/* ---------- Comité : les chiffres du joueur ---------- */
.figs { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 14px; }
@media (max-width: 560px) { .figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } .figs-title { grid-column: 1 / -1; } .stamp { font-size: 1.25rem; right: 12px; bottom: 10px; } }
.figs-title { align-self: center; font-size: .6875rem; letter-spacing: .12em; color: var(--muted); margin-right: 4px; }
.fig { display: grid; padding: 6px 10px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); min-width: 0; }
.fig em { font-style: normal; font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fig b { font-size: var(--fs-m); }

/* ---------- Nuit : commandes et chargements ---------- */
.orders { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.orders-title { font-size: .6875rem; letter-spacing: .12em; color: var(--muted); }
.night-sum span.is-warn { border-color: var(--warn); background: var(--warn-soft); }
.job-info .tag { justify-self: start; width: max-content; margin: 2px 0; }

/* ---------- Barre mobile : un indice attend ---------- */
.mini-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--console-warn); margin-left: 6px; box-shadow: 0 0 6px var(--console-warn); }

</style>
</head>

  function num(n, digits) {
    if (n === Infinity) return '∞';
    if (n == null || isNaN(n)) return '—';
    var d = digits == null ? (Math.abs(n) >= 100 ? 0 : 1) : digits;
    return Number(n).toLocaleString('fr-CA', { maximumFractionDigits: d, minimumFractionDigits: 0 }).replace(/^-/, '−');
  }

  // 1234567 → « 1,2 M$ » ; 45000 → « 45 000 $ » ; 0,35 → « 0,35 $ »

    var a = Math.abs(n);

  var CARD = { serverId: serverCard, modelId: modelCard, engineId: engineCard, storageId: storageCard };

  function cardsKnob(key, opts, value) {
    return '<div class="cards" role="radiogroup" aria-labelledby="lbl-' + key + '">' + opts.map(function (id) {
      var d = CARD[key](id);

        '<input type="radio" id="' + esc(iid) + '" name="k-' + key + '" value="' + esc(id) + '" data-knob="' + key + '"' + (String(value) === String(id) ? ' checked' : '') + '>' +
        '<span class="opt-body"><span class="opt-head"><b>' + esc(d.title) + '</b>' + (d.sub ? '<small>' + esc(d.sub) + '</small>' : '') + '</span>' +

        (d.blurb ? '<span class="opt-blurb">' + esc(d.blurb) + '</span>' : '') +

  function segKnob(key, opts, value, labelFn) {
    return '<div class="seg" role="radiogroup" aria-labelledby="lbl-' + key + '">' + opts.map(function (v) {
      var iid = 'k-' + key + '-' + String(v).replace(/\./g, '_');
      return '<label class="seg-opt" for="' + esc(iid) + '"><input type="radio" id="' + esc(iid) + '" name="k-' + key + '" value="' + esc(v) + '" data-knob="' + key + '"' +

  function toggleKnob(key, checked, label, desc) {
    var iid = 'k-' + key;
    return '<label class="switch" for="' + iid + '"><input type="checkbox" role="switch" id="' + iid + '" data-knob="' + key + '"' + (checked ? ' checked' : '') + '>' +
      '<span class="switch-track" aria-hidden="true"><i></i></span><span class="switch-text"><b>' + esc(label) + '</b>' + (desc ? '<small>' + esc(desc) + '</small>' : '') + '</span></label>';
  }

  function stackKnob(opts, value) {
    var layers = cat().stackLayers || {};
    var groups = {};
    var order = [];
    opts.forEach(function (id) {
      var L = layers[id] || { label: id };
      var g = L.group || 'Autres';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(id);
    });
    var on = value || [];
    return '<div class="stack">' + order.map(function (g) {
      return '<fieldset class="stack-group"><legend>' + esc(g) + '</legend>' + groups[g].map(function (id) {
        var L = layers[id] || { label: id };
        var iid = 'k-stack-' + id;
        var cost = [];
        cost.push('mise en place ' + (L.setup ? ui.money(L.setup) : '0' + NB + '$'));
        if (L.opexYear) cost.push(ui.money(L.opexYear) + '/an');
        if (L.opexYearPctOfServers) cost.push(ui.num(L.opexYearPctOfServers * 100, 0) + NB + '% des serveurs/an');
        if (L.opexYearPerGpu) cost.push(ui.money(L.opexYearPerGpu) + '/GPU/an');
        var req = (L.requires || []).map(function (r) { return ui.catalogLabel('stackLayers', r); });
        return '<label class="check" for="' + esc(iid) + '"><input type="checkbox" id="' + esc(iid) + '" value="' + esc(id) + '" data-knob="stack"' +
          (on.indexOf(id) >= 0 ? ' checked' : '') + '><span><b>' + esc(L.label || id) + '</b>' +
          '<small class="mono">' + esc(cost.join(' · ')) + '</small>' +
          (L.blurb ? '<small>' + esc(L.blurb) + '</small>' : '') +
          (req.length ? '<small class="req">Requiert : ' + esc(req.join(', ')) + '</small>' : '') + '</span></label>';
      }).join('') + '</fieldset>';
    }).join('') + '</div>';
  }

  function countKnob(range, value) {
    var lo = range[0] || 1, hi = range[1] || lo;
    var opts = [];
    for (var i = lo; i <= hi; i++) opts.push(i);
    return segKnob('serverCount', opts, value, function (v) { return '×' + NB + v; });
  }

  function knobControl(key, mission, setup) {
    var k = mission.knobs[key];
    var opts = knobOptions(key, k);
    var v = setup[key];
    switch (key) {
      case 'serverId': case 'modelId': case 'engineId': case 'storageId':
        return cardsKnob(key, opts, v);
      case 'serverCount':
        return countKnob(Array.isArray(k) ? k : [1, 4], v);
      case 'weightPrec': case 'kvPrec':
        return segKnob(key, opts, v, function (x) { return ui.valueLabel(key, x); });
      case 'maxContext':
        return segKnob(key, opts, v, ctxLabel);
      case 'staffFTE':
        return segKnob(key, opts, v, staffLabel);
      case 'procurement':
        return segKnob(key, opts, v, procLabel);
      case 'prefixCache':
        return toggleKnob(key, !!v, 'Réutiliser les débuts de prompts communs', 'Le prompt système partagé n\'est calculé qu\'une fois.');
      case 'colocation':
        return toggleKnob(key, !!(setup.room && setup.room.colocation), 'Envoyer les serveurs en colocation', 'Payé au kW par mois, électricité et climatisation comprises.');
      case 'stack':
        return stackKnob(opts, v);
    }
    return '';
  }

  // Panneau complet des leviers (rendu une fois, les entrées natives gardent leur état).
  ui.knobsPanel = function (mission, setup, flagged) {

      keys.forEach(function (key) {
        shown[key] = true;
        var fl = flagged.indexOf(key) >= 0 || (key === 'colocation' && flagged.indexOf('room') >= 0);
        html += '<div class="knob' + (fl ? ' is-flagged' : '') + '" data-knob-wrap="' + key + '"><div class="knob-label" id="lbl-' + key + '">' + esc(KNOB_LABEL[key] || key) +
          (fl ? ' <span class="tag tag--warn">à revoir</span>' : '') + '</div>' +

        locked.map(function (key) {

        }).join('') + '</dl></section>';
    }
    return html || (mission.special ? '' : '<p class="muted">Aucun levier pour cette mission.</p>');

  // ---------- Barre de VRAM façon Tetris ----------
  var COLS = 6;
  ui.wellShell = function () {
    return '<div class="vram" id="vram">' +
      '<div class="vram-stage">' +
      '<div class="well" id="well"><div class="well-grid" aria-hidden="true"></div>' +
      '<div class="blk blk-w" id="blk-w"><span>poids</span></div>' +
      '<div class="blk blk-o" id="blk-o"></div>' +
      '<div class="kv-layer" id="kv-layer"></div>' +
      '<div class="well-over" id="well-over" hidden></div></div>' +
      '<div class="spill" id="spill" aria-hidden="true"></div>' +
      '</div>' +
      '<div class="vram-legend" id="vram-legend"></div>' +
      '</div>';
  };

  ui.updateWell = function (vram, meta) {
    var well = document.getElementById('well');
    if (!well) return;
    meta = meta || {};
    var U = Math.max(0.0001, +vram.usableGB || 0);
    var W = Math.max(0, +vram.weightsGB || 0);
    var O = Math.max(0, +vram.overheadGB || 0);
    var k = Math.max(0, +vram.kvPerReqGB || 0);
    var kvPeak = Math.max(0, +vram.kvAtPeakGB || 0);
    var n = k > 0 ? Math.round(kvPeak / k) : 0;
    if (meta.unknownDemand) n = 0;

    var wPct = Math.min(W / U, 1) * 100;
    var oPct = Math.max(0, Math.min(O / U * 100, 100 - wPct));
    var bw = document.getElementById('blk-w'), bo = document.getElementById('blk-o');
    bw.style.height = wPct + '%';
    bo.style.bottom = wPct + '%';
    bo.style.height = oPct + '%';
    var base = (W + O) / U * 100;
    var over = document.getElementById('well-over');
    well.classList.toggle('is-over', base > 100);
    over.hidden = !(base > 100);
    if (base > 100) over.textContent = '+' + ui.gb(W + O - U) + ' ne rentrent pas';

    // Regroupement : 1 bloc = g requêtes, rangées d'au moins ~3,4 % de hauteur.
    var g = 1;
    if (k > 0) g = Math.max(1, Math.ceil(3.4 * U / (100 * COLS * k)));
    var cells = Math.ceil(n / g);
    if (cells > 156) { g = Math.ceil(n / 156); cells = Math.ceil(n / g); }
    var rowPct = k > 0 ? COLS * g * k / U * 100 : 0;
    var inWell = 0, spilled = 0;
    var pos = [];
    for (var i = 0; i < cells; i++) {
      var row = Math.floor(i / COLS), col = i % COLS;
      var bottom = base + row * rowPct;
      if (bottom + rowPct > 100.01) { spilled++; continue; }
      pos.push({ bottom: bottom, col: col });
      inWell++;
    }
    var layer = document.getElementById('kv-layer');
    var reduce = ui.reducedMotion();
    while (layer.children.length > inWell) layer.removeChild(layer.lastChild);
    for (var j = 0; j < inWell; j++) {
      var cell = layer.children[j];
      if (!cell) {
        cell = document.createElement('i');
        if (!reduce) { cell.className = 'drop'; cell.style.animationDelay = Math.min(j - layer.children.length, 30) * 12 + 'ms'; }
        layer.appendChild(cell);
      }
      cell.style.bottom = pos[j].bottom + '%';
      cell.style.left = (pos[j].col * 100 / COLS) + '%';
      cell.style.height = rowPct + '%';
      cell.style.width = (100 / COLS) + '%';
    }
    var spill = document.getElementById('spill');
    var shownSpill = Math.min(spilled, 14) + (base > 100 ? 3 : 0);
    if (spill.childElementCount !== shownSpill) {
      var s = '';
      for (var q = 0; q < shownSpill; q++) {
        s += '<i style="--d:' + (q * 0.37 % 2.2).toFixed(2) + 's;--x:' + ((q * 37) % 70) + '%;--r:' + (((q * 53) % 90) - 45) + 'deg"></i>';
      }
      spill.innerHTML = s;
    }
    var rejected = spilled * g;
    var leg = document.getElementById('vram-legend');
    var kvIn = Math.min(n, inWell * g);
    var free = Math.max(0, U - W - O - kvIn * k);
    // Demande inconnue (pas de pilote) : on ne révèle pas le débordement du cache KV, seulement celui des poids.
    var overflowGB = meta.unknownDemand ? Math.max(0, W + O - U) : vram.overflowGB != null ? +vram.overflowGB : Math.max(0, W + O + n * k - U);
    leg.innerHTML =
      '<div class="lg"><i class="sw sw-w"></i><span>Poids</span><b class="mono">' + ui.gb(W) + '</b></div>' +
      '<div class="lg"><i class="sw sw-o"></i><span>Surcoût</span><b class="mono">' + ui.gb(O) + '</b></div>' +
      '<div class="lg"><i class="sw sw-k"></i><span>Cache KV ' + (meta.unknownDemand ? '(demande ?)' : '· ' + ui.num(Math.min(n, kvIn), 0) + NB + 'req.') + '</span><b class="mono">' + ui.gb(kvIn * k) + '</b></div>' +
      '<div class="lg lg-sub"><span>1 requête = ' + ui.gb(k) + (g > 1 ? ' · 1 bloc = ' + g + ' req.' : '') + '</span></div>' +
      (overflowGB > 0.05 ?
        '<div class="lg lg-crit"><i class="sw sw-x"></i><span>Déborde' + (rejected ? ' · ' + ui.num(n - kvIn, 0) + NB + 'req.' : '') + '</span><b class="mono">' + ui.gb(overflowGB) + '</b></div>' :
        '<div class="lg"><i class="sw sw-f"></i><span>Libre</span><b class="mono">' + ui.gb(meta.unknownDemand ? Math.max(0, U - W - O) : vram.freeGB != null ? Math.max(0, vram.freeGB) : free) + '</b></div>') +
      '<div class="lg lg-total"><span>VRAM utile / serveur</span><b class="mono">' + ui.gb(U) + '</b></div>';
  };

    licence: 'Licence non conforme',
    overBudget: 'Budget dépassé',
    noBatching: 'Pas de batching continu',
    ctxTooShort: 'Contexte trop court pour certains prompts',
    kvFull: 'Cache KV plein au pic',
    prefillSaturated: 'Prefill saturé',
    pilotNeeded: 'Demande inconnue',
    lowQuality: 'Qualité insuffisante',
    noEcc: 'Mémoire sans ECC',
    staffShort: 'Personnel insuffisant',
    roomOver: 'Salle surchargée',
    spof: 'Point de défaillance unique',
    slow: 'Trop lent au pic',
    deprecated: 'Moteur en mode maintenance',
    vendorMismatch: 'Moteur incompatible avec ce GPU',
    diskSmall: 'Disque trop petit',
    slowLoads: 'Chargements de modèles trop lents',
    nightCut: 'Travail de nuit annulé (pas fini à 7 h)',
    nightMissing: 'Commande de nuit absente',
    staffLow: 'Personnel insuffisant',
    liquidNeeded: 'Refroidissement liquide requis',

  };
  var FLAG_WARN = { pilotNeeded: 1, spof: 1, staffShort: 1, prefillSaturated: 1 };
  ui.flagLabel = function (key) {
    if (FLAG_LABEL[key]) return FLAG_LABEL[key];
    return String(key).replace(/([A-Z])/g, ' $1').replace(/^./, function (c) { return c.toUpperCase(); }).toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); });
  };

  ui.activeFlags = function (flags) {
    if (!flags) return [];
    return Object.keys(flags).filter(function (k) { return !!flags[k]; });
  };

  ui.firstHint = function (mission, flags) {
    var hints = (mission && mission.hints) || [];
    for (var i = 0; i < hints.length; i++) {
      var h = hints[i];
      if (!h) continue;
      if (!h['if'] || (flags && flags[h['if']])) return h;
    }
    return null;
  };

  ui.meterBar = function (value, max, opts) {
    opts = opts || {};
    var pct = max > 0 ? value / max * 100 : 0;
    var state = opts.state || (pct > 100 ? 'crit' : pct > 85 ? 'warn' : 'ok');
    return '<div class="mbar mbar--' + state + '"><i style="width:' + Math.max(0, Math.min(100, pct)).toFixed(1) + '%"></i>' +
      (pct > 100 ? '<u style="width:' + Math.min(100, pct - 100).toFixed(1) + '%"></u>' : '') + '</div>';
  };

  // Valeur de maxConcurrent (tous serveurs) à partir de l'aperçu.
  ui.previewMaxConcurrent = function (pv, setup) {
    if (!pv) return null;
    if (pv.maxConcurrent != null) return pv.maxConcurrent;
    if (pv.perfAtPeak && pv.perfAtPeak.maxConcurrent != null) return pv.perfAtPeak.maxConcurrent;
    var m = pv.memory || {};
    if (m.maxConcurrent == null) return null;
    return m.perServer ? m.maxConcurrent * (setup.serverCount || 1) : m.maxConcurrent;
  };

  ui.consoleBody = function (pv, setup, mission) {
    if (!pv) return '<p class="console-msg">Aperçu indisponible : le moteur n\'est pas encore chargé.</p>';
    if (mission.special === 'room') return roomConsole(pv, setup, mission);
    var flags = pv.flags || {};
    var perf = pv.perfAtPeak || pv.perf || {};
    var html = '';
    // Demande vs capacité
    var maxC = ui.previewMaxConcurrent(pv, setup);
    var peak = pv.peakDemand;
    html += '<div class="cz"><div class="cz-head"><span>Demande au pic</span>';
    if (peak == null) {
      html += '<b class="mono">inconnue</b></div><p class="cz-note">Inconnue — faites un pilote. Capacité : <b class="mono">' + ui.num(maxC, 0) + NB + 'req.</b></p>';
    } else {
      html += '<b class="mono">' + ui.num(peak, 0) + ' / ' + ui.num(maxC, 0) + NB + 'req.</b></div>' +
        ui.meterBar(peak, Math.max(1, maxC || 0)) +
        '<p class="cz-note">demande simultanée / capacité de tous les serveurs</p>';
    }
    html += '</div>';
    // Vitesse
    var ttft = perf.ttft || {};
    var wl = (mission.workloads || []).map(function (w) { return w.id; });
    if (!wl.length) wl = ['chat'];
    var ttftRows = wl.filter(function (id) { return ttft[id] != null; }).map(function (id) {
      var lab = ui.catalogLabel('workloads', id);
      return '<div class="kv-row"><span>Premier jeton · ' + esc(lab) + '</span><b class="mono">' + ui.dur(ttft[id]) + '</b></div>';
    }).join('');
    html += '<div class="cz"><div class="kv-row kv-row--big"><span>Vitesse au pic</span><b class="mono">' + ui.metric('tokPerUser', perf.tokPerUser) + '</b></div>' +
      '<div class="kv-row"><span>par utilisateur, décodage</span>' + (perf.bound ? '<em class="mono">limité par ' + (perf.bound === 'compute' ? 'le calcul' : 'la mémoire') + '</em>' : '') + '</div>' +
      ttftRows + '</div>';
    // Dépense
    // Dépense comparée au budget : investissement à l'achat, première année en location.
    var capex = pv.spend != null ? pv.spend : pv.capex != null ? pv.capex : (pv.costs && pv.costs.capex);
    var budget = mission.budget;
    if (capex != null) {
      html += '<div class="cz"><div class="cz-head"><span>Dépense' + (setup.procurement === 'rent' ? ' (1re année)' : '') + '</span><b class="mono">' + ui.money(capex) +
        (budget ? ' / ' + ui.money(budget) : '') + '</b></div>' + (budget ? ui.meterBar(capex, budget) : '') + '</div>';
    }
    // Fiabilité des agents (missions 7 et 8)
    if (pv.agentSuccess != null) {
      var target = mission.agentMinSuccess || 0;
      html += '<div class="cz"><div class="cz-head"><span>Tâches d\'agent menées à bout</span><b class="mono">' + ui.num(pv.agentSuccess, 0) + NB + '%' + (target ? ' / ' + target + NB + '%' : '') + '</b></div>' +
        ui.meterBar(pv.agentSuccess, 100, { state: pv.agentSuccess >= target ? 'ok' : 'crit' }) +
        '<p class="cz-note">qualité ' + ui.num(pv.quality, 1) + ' sur 10, ' + esc(mission.agentSteps) + ' étapes par tâche</p></div>';
    }
    // Voyants
    var active = ui.activeFlags(flags);
    html += '<div class="cz"><div class="cz-head"><span>Voyants</span></div><div class="leds">';
    if (!active.length) html += ui.led('ok', 'Tout est au vert');
    active.forEach(function (f) { html += ui.led(FLAG_WARN[f] ? 'warn' : 'crit', ui.flagLabel(f)); });
    html += '</div>';
    if (pv.warnings && pv.warnings.length) {
      html += '<ul class="warns">' + pv.warnings.slice(0, 4).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
    }
    html += '</div>';
    return html;
  };

  // Mission « salle » : pas de VRAM ni de demande, seulement l'électricité, le froid et la facture.
  function roomConsole(pv, setup, mission) {
    var rm = null;
    try { rm = G.engine.computeRoom(setup, mission); } catch (e) { rm = null; }
    if (!rm) return '<p class="console-msg">État de la salle indisponible.</p>';
    var coloc = setup.room && setup.room.colocation;
    var html = '<div class="cz"><div class="cz-head"><span>Puissance totale</span><b class="mono">' + ui.num(rm.totalKW, 1) + NB + 'kW</b></div>';
    if (coloc) {
      html += '<p class="cz-note">En colocation : l\'hébergeur fournit l\'électricité et le refroidissement, facturés au kW.</p></div>';
    } else {
      html += '<div class="kv-row"><span>Climatisation</span><b class="mono">' + ui.num(rm.coolingUsedKW != null ? rm.coolingUsedKW : rm.totalKW, 1) + ' / ' + ui.num(rm.coolingCapKW, 0) + NB + 'kW</b></div>' +
        ui.meterBar(rm.coolingUsedKW != null ? rm.coolingUsedKW : rm.totalKW, Math.max(1, rm.coolingCapKW || 0)) + '</div>';
    }
    var spend = pv.capex != null ? pv.capex : 0;
    html += '<div class="cz"><div class="kv-row kv-row--big"><span>Coût de la salle sur 3 ans</span><b class="mono">' + ui.money(rm.cost3y) + '</b></div>' +
      '<div class="kv-row"><span>dont améliorations</span><b class="mono">' + ui.money(spend) + '</b></div>' +
      (mission.budget ? ui.meterBar(rm.cost3y, mission.budget) : '') + '</div>';
    var issues = rm.issues || [];
    html += '<div class="cz"><div class="cz-head"><span>Voyants</span></div><div class="leds">';
    html += issues.length ? ui.led('crit', issues.length + ' problème' + (issues.length > 1 ? 's' : '')) : ui.led('ok', 'Tout est au vert');
    html += '</div>';
    if (issues.length) html += '<ul class="warns">' + issues.slice(0, 5).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
    return html + '</div>';
  }

  ui.hintBubble = function (mission, pv) {
