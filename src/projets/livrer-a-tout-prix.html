.profil-tampon { position: absolute; top: 16px; right: 18px; font-family: var(--font-titre); font-weight: 700; font-size: 1rem; letter-spacing: .14em; color: var(--accent); border: 3px double var(--accent); padding: 2px 10px; transform: rotate(8deg); opacity: .8; }
.profil-titre { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -.01em; line-height: 1.02; max-width: 16ch; }
.profil-sous { font-size: var(--fs-l); color: var(--muted); max-width: 52ch; }
.etoiles { display: flex; gap: 4px; font-size: 2rem; line-height: 1; }
.etoiles span { color: var(--line-strong); }
.etoiles span.is-on { color: var(--soleil); text-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
.etoiles span.is-on:nth-child(1) { animation: etoile .4s .1s both; }
.etoiles span.is-on:nth-child(2) { animation: etoile .4s .25s both; }
.etoiles span.is-on:nth-child(3) { animation: etoile .4s .4s both; }
.etoiles span.is-on:nth-child(4) { animation: etoile .4s .55s both; }
.etoiles span.is-on:nth-child(5) { animation: etoile .4s .7s both; }
@keyframes etoile { from { transform: scale(2.2) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.profil-score { color: var(--muted); font-size: var(--fs-s); }
.profil-texte { max-width: 62ch; font-size: var(--fs-l); text-align: left; }
.profil-replique { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; max-width: 640px; width: 100%; }
.profil-replique blockquote { margin: 0; }
.profil-replique footer { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }
.profil-lecon { display: grid; gap: 8px; max-width: 560px; width: 100%; text-align: left; }
.bilan-criteres { display: grid; gap: 10px; max-width: 640px; }
.bilan-criteres h2, .bilan-courbes h2 { font-size: var(--fs-xl); }
.bilan-criteres .jauge { font-size: var(--fs-m); }
.bilan-courbes { display: grid; gap: 10px; }
.courbes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px; margin-top: 6px; }
.courbe { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 12px 8px; display: grid; gap: 6px; }
.courbe figcaption { display: flex; gap: 4px 8px; align-items: baseline; flex-wrap: wrap; font-size: var(--fs-s); line-height: 1.25; min-height: 2.5em; }
.courbe-fin { margin-left: auto; font-weight: 600; }
.courbe-cadre { position: relative; }
.courbe-svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.courbe-grille { stroke: var(--line); stroke-width: 1; }
.courbe-trim { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.courbe-axe { fill: var(--muted); font-family: var(--font-mono); font-size: 9.5px; }
.courbe-ligne { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.courbe-point { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.courbe-curseur { stroke: var(--fg); stroke-width: 1; opacity: .4; }
.courbe-bulle { position: absolute; transform: translate(-50%, calc(-100% - 10px)); background: var(--fg); color: var(--bg); font-size: var(--fs-xs); padding: 3px 7px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
.bilan-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 8px; }

/* 60-mobile.css */
/* Tablette et téléphone (dès 360 px) : HUD sur deux lignes, panneau en feuille du bas, tableau de bord
   un groupe à la fois, modales pleine largeur. Aucun défilement horizontal. Propriétaire : agent F. */

@media (max-width: 1440px) {
  .hud-inner { gap: 8px 14px; }
  .btn--semaine .btn-lib { display: none; }
  .btn--semaine::after { content: "+1 sem."; }
}
@media (max-width: 1180px) {
  .hud-inner { gap: 8px 12px; }
  .hud-phase { display: none; }
  .hud .tool--back { font-size: var(--fs-xs); }
}

@media (max-width: 900px) {
  /* ---------- HUD ---------- */
  .hud-inner { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "marque outils" "temps stats" "commandes commandes"; gap: 6px 10px; padding-top: 6px; padding-bottom: 8px; }
  .hud-marque { grid-area: marque; gap: 10px; flex-wrap: wrap; }
  .hud-outils { grid-area: outils; }
  .hud-temps { grid-area: temps; min-width: 0; }
  .hud-stats { grid-area: stats; justify-self: end; }
  .hud-commandes { grid-area: commandes; margin-left: 0; justify-content: stretch; }
  .hud-commandes .btn--lecture { flex: 1 1 auto; }
  .hud-titre { font-size: var(--fs-m); }
  .hud-stat { padding: 2px 8px; }
  .hud-stat-val { font-size: var(--fs-s); }
  .tiroir { left: var(--gutter); right: var(--gutter-r); width: auto; }

  /* ---------- Panneau en feuille du bas ---------- */
  .zone-panneau { min-height: 0; }
  .panneau {
    position: fixed; z-index: 32; left: 0; right: 0; bottom: 0; max-height: min(82vh, calc(100vh - 56px));
    border-radius: 16px 16px 0 0; border-bottom: 0; box-shadow: 0 -12px 40px -16px rgba(30, 20, 10, .55);
    transform: translateY(calc(100% - 60px - env(safe-area-inset-bottom, 0px))); transition: transform .28s cubic-bezier(.2, .8, .3, 1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panneau[data-ouvert="true"] { transform: none; }
  .panneau-poignee {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "barre barre" "lib fleche";
    align-items: center; gap: 4px 8px; width: 100%; min-height: 60px; padding: 6px var(--gutter-r) 8px var(--gutter);
    border: 0; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-align: left; flex: none;
  }
  .poignee-barre { grid-area: barre; justify-self: center; width: 44px; height: 4px; border-radius: 2px; background: var(--line-strong); }
  .poignee-lib { grid-area: lib; display: flex; align-items: center; gap: 8px; font-family: var(--font-titre); font-weight: 600; min-width: 0; }
  .poignee-texte { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poignee-fleche { grid-area: fleche; transform: rotate(180deg); transition: transform .2s; color: var(--muted); }
  .panneau[data-ouvert="true"] .poignee-fleche { transform: none; }
  .panneau-titre { display: none; }
  .panneau-tete { padding: 10px var(--gutter-r) 10px var(--gutter); }
  .onglets { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter-r) 2px var(--gutter); }
  .onglets::-webkit-scrollbar { display: none; }
  .onglet { flex: none; }
  .panneau-corps { padding: 12px var(--gutter-r) 24px var(--gutter); }

  /* ---------- Tableau de bord compact : un groupe à la fois ---------- */
  .tableau-entete { display: block; width: 100%; }
  .tableau-entete .choix { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tableau-entete .choix::-webkit-scrollbar { display: none; }
  .tableau-entete .choix-opt { flex: none; font-size: var(--fs-xs); }
  .groupe:not(.is-mobile-actif) { display: none; }
  .tableau-corps { grid-template-columns: minmax(0, 1fr); }
  .groupe-titre { display: none; }
  .groupe { padding-top: 4px; }

  .journal-liste { max-height: 260px; }

  /* ---------- Toast au-dessus de la poignée ---------- */
  .couche-toast { left: var(--gutter); right: var(--gutter-r); width: auto; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
}

@media (max-width: 720px) {
  .accueil { gap: 28px; padding-top: 12px; }
  .accueil-hero { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-bottom: 24px; }
  .accueil-art { max-width: 280px; margin: 0 auto; }
  .trims { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions .btn--grand { flex: 1 1 100%; }

  /* Modales en feuille pleine largeur */
  @keyframes monte-bas { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modale { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; transform: none; max-height: calc(100vh - 24px); padding: 18px 16px 20px; animation-name: monte-bas; }
  .comite { top: 8px; bottom: 8px; padding: 16px 14px 20px; }
  .ev-bande { margin: 0 -16px; }
  .ev-titre { font-size: var(--fs-xl); }
  .ev-corps { grid-template-columns: minmax(0, 1fr); }
  .ev-perso, .fauteuil { display: flex; gap: 12px; align-items: center; max-width: none; text-align: left; }
  .ev-perso .visage svg, .fauteuil .visage svg { width: 48px; height: 48px; }
  .comite-jauge { display: flex; gap: 10px; align-items: baseline; justify-items: start; }
  .comite-jauge b { font-size: var(--fs-xl); }
  .salle { padding: 14px 12px; }
  .salle-question { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .fiche-tete { grid-template-columns: 72px minmax(0, 1fr); }
  .fiche-visage svg { width: 72px; height: 72px; }
  .comite-resume li { grid-template-columns: auto minmax(0, 1fr); }
  .comite-resume .verdict { grid-column: 2; justify-self: start; }
  .profil-replique { grid-template-columns: minmax(0, 1fr); justify-items: center; }
}

@media (max-width: 480px) {
  .hud-inner { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "marque temps outils" "stats stats stats" "commandes commandes commandes"; gap: 6px 8px; padding-top: 4px; padding-bottom: 6px; }
  .hud:not([data-phase="accueil"]) .hud-nom { display: none; }
  .hud .tool--back { font-size: 0; padding: 6px 4px; min-width: 28px; }
  .hud .tool--back::before { content: "←"; font-size: var(--fs-l); }
  .hud-phase { display: none; }
  .hud-temps { min-width: 84px; gap: 3px; }
  .hud-quand { gap: 4px; }
  .hud-sem { font-size: var(--fs-xs); }
  .hud-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; justify-self: stretch; }
  .hud-stat { padding: 0 8px; }
  .hud-stat-lib { font-size: .625rem; letter-spacing: .04em; }
  .hud-stat-val { font-size: var(--fs-xs); }
  .hud .ibtn { min-width: 36px; height: 36px; }
  .hud-commandes .btn { min-height: 38px; }
  .hud-commandes .btn--semaine .btn-lib { display: none; }
  .btn--semaine::after { content: "+1"; }
  .cap-attr > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .jauge { grid-template-columns: minmax(0, 1fr) minmax(60px, 1fr) auto; gap: 8px; }
  .trims { grid-template-columns: minmax(0, 1fr); }
  .titre-jeu { font-size: 2.5rem; }
}

<script>

/* 00-noyau.js */
/* Espace de noms, hasard déterministe, outils numériques, formatage fr-CA et textes.
   Aucun accès au DOM : ce fichier est aussi chargé dans Node pour les tests. */
(function (LTP) {
  'use strict';

  LTP.K = LTP.K || {};               // constantes d'équilibrage, un bloc par système
  LTP.systemes = LTP.systemes || {}; // systèmes du moteur (voir 31-boucle.js)
  LTP.donnees = LTP.donnees || {};   // contenu : îlots, personnages, leviers, cartes, événements…
  LTP.textes = LTP.textes || { fr: {} };
  LTP.langue = LTP.langue || 'fr';
  LTP.q = LTP.q || {};               // requêtes sur l'état (voir 20-etat.js)

  var NBSP = ' ';
  var NNBSP = ' '; // espace fine insécable, avant « ; ! ? » et le symbole %

  // --- Hasard déterministe (mulberry32). L'état est un entier sérialisable. ---
  function rngSuivant(s) {
    s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return { etat: s, valeur: ((t ^ (t >>> 14)) >>> 0) / 4294967296 };
  }

  // Crée un générateur lié à un porteur { rngEtat } (l'état du jeu) : chaque tirage avance porteur.rngEtat.
  function creerRng(porteur) {
    var r = {
      suivant: function () {
        var x = rngSuivant(porteur.rngEtat | 0);
        porteur.rngEtat = x.etat;
        return x.valeur;
      },
      entre: function (a, b) { return a + (b - a) * r.suivant(); },
      entier: function (a, b) { return a + Math.floor(r.suivant() * (b - a + 1)); },
      chance: function (p) { return r.suivant() < p; },
      choisir: function (liste) { return liste.length ? liste[Math.floor(r.suivant() * liste.length)] : undefined; },
      // poids : fonction(element) → nombre ≥ 0, ou nom de propriété
      choisirPondere: function (liste, poids) {
        var f = typeof poids === 'function' ? poids : function (e) { return e[poids || 'poids'] || 0; };
        var total = 0, i;
        for (i = 0; i < liste.length; i++) total += Math.max(0, f(liste[i]) || 0);
        if (total <= 0) return undefined;
        var x = r.suivant() * total;
        for (i = 0; i < liste.length; i++) {
          x -= Math.max(0, f(liste[i]) || 0);
          if (x < 0) return liste[i];
        }
        return liste[liste.length - 1];
      },
      // Bruit centré : moyenne 0, écart-type ≈ e (somme de trois uniformes).
      bruit: function (e) { return ((r.suivant() + r.suivant() + r.suivant()) / 3 - 0.5) * 2 * 1.732 * (e || 1); },
      melanger: function (liste) {
        var a = liste.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(r.suivant() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      },
    };
    return r;
  }

  // Graine à partir d'un texte ou d'un nombre.
  function graineDe(x) {
    if (typeof x === 'number' && isFinite(x)) return x | 0;
    var s = String(x == null ? Date.now() : x), h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h | 0;
  }

  // Hachage stable d'un texte en [0, 1) : sert aux variations visuelles déterministes.
  function hachage(s) {
    var h = 2166136261;
    s = String(s);
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  // --- Outils numériques ---
  function borner(v, min, max) {

/* 19-effets.js */
/* Effets déclaratifs : le seul moyen pour le contenu (événements, comités, capacités) de modifier l'état.
   Forme d'un effet (voir ARCHITECTURE.md §4.4) :
     { cible, chemin, op, valeur, pendant?, dans?, filtre? }
       cible : 'org' | 'ilot' | 'dev' | 'ilots' | 'devs' | 'ilot:<id>' | 'dev:<id>'
               'ilot' et 'dev' désignent la référence courante (cible de l'événement)
       op : 'add' | 'mul' | 'set' ; pendant : n semaines puis annulé ; dans : appliqué dans n semaines
       filtre (pour 'ilots' et 'devs') : { ilot, trait, niveau, sauf }
     { drapeau: 'nom', valeur?: true }
     { carte: 'id', op: 'decouvrir' | 'retirer' | 'equiper', ilot? }
     { incident: { gravite, cause }, ilot? }
     { levier: 'id', valeur, ilot? }                 // force un levier (sans délai)
     { journal: 'cle', vars? }
     { evenement: 'id', dans?: n }                   // planifie un événement de suite
     { confiance: +5 }  { budget: -20000 }           // raccourcis vers org */
(function (LTP) {
  'use strict';
  var O = LTP.outils;

  function bornesDe(type, chemin) {
    var b = LTP.etat.BORNES[type];
    return b ? b[chemin] : undefined;
  }

  function entites(etat, cible, ref, filtre) {
    var c = String(cible || 'org');
    if (c === 'org') return [{ type: 'org', obj: etat.org }];
    if (c === 'ilot') return ref && ref.ilot && etat.ilots[ref.ilot] ? [{ type: 'ilot', obj: etat.ilots[ref.ilot] }] : [];
    if (c === 'dev') return ref && ref.dev && etat.devs[ref.dev] ? [{ type: 'dev', obj: etat.devs[ref.dev] }] : [];
    if (c.indexOf('ilot:') === 0) { var i = etat.ilots[c.slice(5)]; return i ? [{ type: 'ilot', obj: i }] : []; }
    if (c.indexOf('dev:') === 0) { var d = etat.devs[c.slice(4)]; return d ? [{ type: 'dev', obj: d }] : []; }
    if (c === 'ilots') {
      return LTP.q.ilots(etat).filter(function (x) {
        return !filtre || ((!filtre.ilot || x.id === filtre.ilot) && (!filtre.sauf || x.id !== filtre.sauf));
      }).map(function (x) { return { type: 'ilot', obj: x }; });
    }
    if (c === 'devs') {
      return LTP.q.devsPresents(etat).filter(function (x) {
        if (!filtre) return true;
        if (filtre.ilot && x.ilot !== (filtre.ilot === 'courant' ? ref && ref.ilot : filtre.ilot)) return false;
        if (filtre.trait && x.traits.indexOf(filtre.trait) < 0) return false;
        if (filtre.niveau && x.niveau !== filtre.niveau) return false;
        if (filtre.sauf && x.id === filtre.sauf) return false;
        return true;

    var avant = O.lireChemin(ent.obj, chemin);
    var apres;
    if (op === 'set') apres = valeur;
    else if (op === 'mul') apres = (typeof avant === 'number' ? avant : 0) * valeur;
    else apres = (typeof avant === 'number' ? avant : 0) + valeur;
    if (typeof apres === 'number') {
      var b = bornesDe(ent.type, chemin);
      if (b) apres = O.borner(apres, b[0], b[1]);
      else if (!(LTP.etat.NEGATIFS_PERMIS[ent.type] || {})[chemin] && apres < 0) apres = 0;
      if (!isFinite(apres)) apres = 0;

    O.ecrireChemin(ent.obj, chemin, apres);

  // Applique une liste d'effets. ref = { ilot, dev, source }. ctx (facultatif) = contexte de la boucle.
  function appliquer(etat, effets, ref, ctx) {

    if (e.dans > 0) {
      var copie = O.cloner(e);
      delete copie.dans;
      etat.differes.push({ semaine: etat.semaine + e.dans, effets: [copie], ref: O.cloner(ref) });
      return;
    }
    if (e.confiance != null) return appliquerUn(etat, { cible: 'org', chemin: 'confiance', op: 'add', valeur: e.confiance }, ref, ctx);
    if (e.budget != null) return appliquerUn(etat, { cible: 'org', chemin: 'budget', op: 'add', valeur: e.budget }, ref, ctx);
    if (e.drapeau) { etat.org.drapeaux[e.drapeau] = e.valeur === undefined ? true : e.valeur; return; }
    if (e.journal) { noter(etat, ctx, 'evenement', e.journal, e.vars || {}, ref); return; }
    if (e.evenement) {
      etat.evenementsForces.push({ id: e.evenement, semaine: etat.semaine + (e.dans || 1), ref: O.cloner(ref) });
      return;
    }
    if (e.levier) {
      if (e.ilot) {
        etat.leviers.surcharges[e.ilot] = etat.leviers.surcharges[e.ilot] || {};
        etat.leviers.surcharges[e.ilot][e.levier] = e.valeur;
      } else etat.leviers.global[e.levier] = e.valeur;
      if (e.levier === 'objectif') etat.org.objectif = e.valeur;
      return;
    }
    if (e.incident) {
      var il = e.ilot === 'ilot' || !e.ilot ? ref.ilot : e.ilot;
      if (il) LTP.q.creerIncident(etat, { ilot: il, gravite: e.incident.gravite, cause: e.incident.cause }, ctx);
      return;
    }
    if (e.carte) {
      var etc = etat.capacites[e.carte];
      if (!etc) return;
      var ilotCarte = e.ilot === 'ilot' || (!e.ilot && e.op === 'equiper') ? ref.ilot : e.ilot;
      if (e.op === 'decouvrir') etc.decouverte = true;
      else if (e.op === 'retirer') {
        (ilotCarte ? [ilotCarte] : etc.equipeeSur.slice()).forEach(function (iid) { retirerCarte(etat, e.carte, iid); });
      } else if (e.op === 'equiper' && ilotCarte) {
        etc.decouverte = true;
        if (etc.equipeeSur.indexOf(ilotCarte) < 0) etc.equipeeSur.push(ilotCarte);
        if (etat.ilots[ilotCarte].capacites.indexOf(e.carte) < 0) etat.ilots[ilotCarte].capacites.push(e.carte);
      }
      return;
    }
    if (e.chemin) {
      var op = e.op || 'add';
      entites(etat, e.cible, ref, e.filtre).forEach(function (ent) {
        var r = appliquerValeur(ent, e.chemin, op, e.valeur);
        if (e.pendant > 0 && typeof r.apres === 'number') {
          var inverse;
          if (op === 'add') inverse = { op: 'add', valeur: -(r.apres - (typeof r.avant === 'number' ? r.avant : 0)) };
          else if (op === 'mul') inverse = e.valeur ? { op: 'mul', valeur: 1 / e.valeur } : { op: 'set', valeur: r.avant };
          else inverse = { op: 'set', valeur: r.avant };
          var cibleInv = ent.type === 'org' ? 'org' : ent.type + ':' + ent.obj.id;
          etat.differes.push({
            semaine: etat.semaine + e.pendant,
            effets: [{ cible: cibleInv, chemin: e.chemin, op: inverse.op, valeur: inverse.valeur }],
            ref: O.cloner(ref),
          });
        }
      });
    }
  }

  function retirerCarte(etat, carteId, ilotId) {
    var etc = etat.capacites[carteId], il = etat.ilots[ilotId];
    if (etc) etc.equipeeSur = etc.equipeeSur.filter(function (x) { return x !== ilotId; });
    if (il) il.capacites = il.capacites.filter(function (x) { return x !== carteId; });
  }

  function noter(etat, ctx, type, cle, vars, ref) {
    if (ctx && ctx.noter) ctx.noter(type, cle, vars, ref);
    else etat.journal.push({ semaine: etat.semaine, type: type, cle: cle, vars: vars || {}, ilot: ref && ref.ilot, dev: ref && ref.dev });
  }

  // Étape 1 de la boucle : applique les effets différés arrivés à échéance.
  function differes(etat, ctx) {
    var restants = [], echus = [];
    etat.differes.forEach(function (d) { (d.semaine <= etat.semaine ? echus : restants).push(d); });
    etat.differes = restants;
    echus.forEach(function (d) { appliquer(etat, d.effets, d.ref, ctx); });

  function cheminsNumeriques(obj, prefixe, acc) {

  // Répartit la file de revue de l'îlot sur ses réviseurs (revues faites cette semaine, ou trait reviseur).

  function cleBulle(d) {

  // Une ou deux bulles visibles : celles des personnes dont l'état a changé cette semaine, sinon une rotation.
  function choisirBulles(etat, precedent, ids) {

    var candidats = [];
    var semaineChangee = precedent && precedent.semaine !== etat.semaine;
    ids.forEach(function (id) {
      var d = etat.devs[id];
      if (!d || !d.present) return;
      var avant = precedent && precedent.devs && precedent.devs[id];
      var change = semaineChangee ? (avant && avant.etat !== d.etat) : (!precedent && d.etat === 'incident');
      if (change) candidats.push([id, (prio[d.etat] || 1) + O.hachage(id + etat.semaine)]);
    });
    candidats.sort(function (a, b) { return b[1] - a[1]; });
    var choisis = [], ilotsPris = {};
    candidats.forEach(function (c) {
      var il = etat.devs[c[0]].ilot;
      if (choisis.length < K.bullesMax && !ilotsPris[il]) { choisis.push(c[0]); ilotsPris[il] = true; }
    });
    if (!choisis.length) {
      var presents = ids.filter(function (id) { var d = etat.devs[id]; return d && d.present && cleBulle(d); });
      if (presents.length) {

      }

    return m;

    } else if (vh - bas > bh + 16) { by = bas + 12; bx = Math.min(Math.max(16, r.left), vw - bw - 16); }
    else if (top > bh + 16) { by = top - bh - 12; bx = Math.min(Math.max(16, r.left), vw - bw - 16); }
    else if (vw - droite > bw + 24) { bx = droite + 12; by = Math.min(Math.max(16, r.top), vh - bh - 16); }
    else if (left > bw + 24) { bx = left - bw - 12; by = Math.min(Math.max(16, r.top), vh - bh - 16); }

    bulle.style.top = Math.round(Math.max(8, by)) + 'px';

  function terminer(etat, app) {

    if (LTP.app.etat.phase === 'tutoriel') app.dispatch({ type: 'phase', phase: 'planification' });
  }

  LTP.ui.tutoriel = {
    actif: function (etat, ui) { return etat.phase === 'tutoriel' || !!(ui.visite && (etat.phase === 'planification' || etat.phase === 'execution')); },
    rendre: function (couche, etat, ui, app) {

          if (r && document.contains(r)) r.focus(); else { var b = document.getElementById('btn-lecture'); if (b) b.focus(); }

      var liste = etapes();
      var n = Math.max(0, Math.min(liste.length - 1, (ui.visite && ui.visite.etape) || 0));
      var et = liste[n] || {};

      var cle = 'tuto:' + n + ':' + liste.length;
      var change = F.reconstruire(couche, cle, function () {
        var p = F.personne(et.personnage || 'ginette');
        var dernier = n === liste.length - 1;
        var action = typeof et.action === 'string' ? et.action : (et.action && et.action.texte) || null;
        return [
          h('div', { class: 'tuto-spot', 'aria-hidden': 'true' }),
          h('div', { class: 'tuto-bulle', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'tuto-titre', 'aria-describedby': 'tuto-texte',
            onkeydown: function (ev) { if (ev.key === 'Escape') { ev.preventDefault(); terminer(etat, app); } } },
            h('div', { class: 'tuto-tete' }, F.visage(p.id, 44),
              h('div', null, h('p', { class: 'eyebrow', id: 'tuto-titre' }, t('tuto.titre') + ' · ' + t('tuto.etape', { n: n + 1, total: liste.length })), h('b', null, p.nom))),
            h('p', { class: 'tuto-texte', id: 'tuto-texte' }, F.texte(et.texte, etat)),
            action ? h('p', { class: 'tuto-action' }, F.texte(action, etat)) : null,
            h('div', { class: 'tuto-points', 'aria-hidden': 'true' }, liste.map(function (x, i) { return h('i', { class: i === n ? 'is-on' : '' }); })),
            h('div', { class: 'tuto-actions' },
              h('button', { type: 'button', class: 'lien', 'data-cle': 'tuto-passer', onclick: function () { terminer(etat, app); } }, t('action.passerVisite')),
              h('span', { class: 'tuto-nav' },
                n > 0 ? h('button', { type: 'button', class: 'btn btn--petit btn--fantome', 'data-cle': 'tuto-prec', onclick: function () { app.setUI({ visite: { etape: n - 1 } }); } }, t('action.precedent')) : null,
                h('button', { type: 'button', class: 'btn btn--petit btn--primaire', id: 'btn-tuto-suivant', 'data-cle': 'tuto-suiv', onclick: function () {

      if (change) {

        if (cible && et.region !== 'hud') {
          try { cible.scrollIntoView({ block: 'nearest', behavior: F.reduit() ? 'auto' : 'smooth' }); } catch (e) { cible.scrollIntoView(); }

        var boite = couche.querySelector('.tuto-bulle');
        if (boite && !boite.contains(document.activeElement)) F.focusPremier(boite, '#btn-tuto-suivant');

        var debut = Date.now();

/* 49-ui-sauvegarde.js */
/* Sauvegarde automatique dans localStorage, protégée (navigation privée, stockage bloqué). Propriétaire : agent F.
   API : enregistrer(etat), charger() → etat | null, effacer(), existe() → booléen. */
(function (LTP) {
  'use strict';
  var CLE = 'livrer-a-tout-prix:v1';
  LTP.sauvegarde = {
    enregistrer: function (etat) {
      try { if (etat && etat.phase !== 'accueil') localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* ignoré */ }
    },
    charger: function () {
      try {
        var s = localStorage.getItem(CLE);
        if (!s) return null;
        var etat = JSON.parse(s);
        return etat && etat.version === 1 && etat.devs && etat.ilots ? etat : null;
      } catch (e) { return null; }
    },
    effacer: function () { try { localStorage.removeItem(CLE); } catch (e) { /* ignoré */ } },
    existe: function () { return !!LTP.sauvegarde.charger(); },
  };
})(globalThis.LTP = globalThis.LTP || {});

/* 90-main.js */
/* Démarrage : paramètres d'URL, sauvegarde, horloge de lecture, raccourcis clavier globaux.
   ?graine=123 · ?animateur=1 · ?demo=<nom> · ?neuf=1 (ignore la sauvegarde) */
(function (LTP) {
  'use strict';

  function parametres() {
    var p = {};
    try { new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; }); } catch (e) { /* ignoré */ }
    return p;
  }

  var minuterie = null;
  function planifierTic() {
    clearTimeout(minuterie);
    var ui = LTP.app.ui;
    var delai = ui.vitesse ? LTP.K.ui.dureeSemaineMs / ui.vitesse : 250;
    minuterie = setTimeout(tic, delai);
  }
  function tic() {
    var app = LTP.app, etat = app.etat;
    if (app.ui.vitesse && etat && etat.phase === 'execution' && !etat.evenementEnAttente && !app.ui.modaleBloquante) app.avancer();
    planifierTic();
  }

  function demarrer() {
    var p = parametres();
    var etat = null;
    var options = { animateur: p.animateur === '1', toutDebloque: p.animateur === '1' && p.tout === '1' };
    if (p.demo && LTP.demo) etat = LTP.demo.etat(p.demo);
    else if (!p.graine && p.neuf !== '1' && LTP.sauvegarde) etat = LTP.sauvegarde.charger();
    if (!etat) etat = LTP.moteur.creer(p.graine != null ? p.graine : Date.now(), options);
    LTP.app.demarrer(etat);

    document.addEventListener('keydown', function (ev) {
      if (ev.target && /input|select|textarea|button/i.test(ev.target.tagName)) return;
      if (ev.key === ' ' && LTP.app.etat.phase === 'execution') {
        ev.preventDefault();
        LTP.app.setUI({ vitesse: LTP.app.ui.vitesse ? 0 : 1 });
      }
      if (ev.key === 'Escape' && LTP.app.ui.modale) LTP.app.setUI({ modale: null });
    });
    planifierTic();
  }

  if (typeof document === 'undefined') return;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})(globalThis.LTP = globalThis.LTP || {});
