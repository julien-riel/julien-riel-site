ehension":"Compréhension","critere.securite":"Sécurité","critere.confiance":"Confiance","tuto.titre":"Visite guidée","tuto.etape":"Étape {n} sur {total}","tuto.defaut.1":"Bienvenue ! Moi, c'est Ginette. 27 ans de service, trois « révolutions », zéro panique. Je te fais faire le tour.","tuto.defaut.2":"L'open space. Vingt et un développeurs, sept îlots. Pour commencer, sept d'entre eux ont une licence Copilot : une personne par îlot. Clique sur quelqu'un pour voir sa fiche.","tuto.defaut.3":"Tes leviers. Au début, il n'y a que les licences. Les autres arrivent un à un, par notes de service : tu auras le temps de voir ce que chacun change.","tuto.defaut.4":"Le tableau de bord, c'est le rapport du vendredi. Les tuiles grises, c'est ce que tu ne mesures pas encore.","tuto.defaut.5":"Ce qu'on entend : ce que les développeurs disent tout haut, et pourquoi. On y voit l'effet d'une décision avant qu'il arrive dans les chiffres.","tuto.defaut.6":"En haut : la semaine et le jour, le budget, les jetons et la confiance de Mme Lavigueur. « +1 jour » avance d'une journée ; la lecture fait défiler les jours. Espace met en pause.","anim.titre":"Mode animateur","anim.ouvrir":"Animateur","anim.graine":"Graine","anim.nouvelle":"Nouvelle partie avec cette graine","anim.sauter":"Sauter","anim.semaines":"semaines","anim.sauterBouton":"Simuler","anim.cachees":"Voir les métriques cachées","anim.tout":"Tout débloquer","anim.note":"Les décisions sautées prennent le premier choix.","divers.chargement":"Chargement de l'open space…","divers.semaines":function(D){return D.n+" "+k(D.n,"semaine","semaines")},"divers.oui":"Oui","divers.non":"Non","levier.change":function(D){return"Réglage : "+D.levier+(D.ilot?" ("+D.ilot+")":"")+"."},"levier.programme":function(D){return"Changement programmé : "+D.levier+(D.ilot?" ("+D.ilot+")":"")+", en vigueur dans "+D.delai+" "+k(D.delai,"semaine","semaines")+"."},"levier.effectif":function(D){return"C'est en vigueur : "+D.levier+(D.ilot?" ("+D.ilot+")":"")+"."},"levier.retire":"Retour au réglage global : {levier} ({ilot}).","levier.reaction":"{dev} réagit : {levier}.","comite.convoque":"Fin du trimestre {trimestre} : le comité de direction vous attend au 4e.","comite.repondu":"Comité : réponse notée.","comite.convaincu":"Le comité est convaincu. La confiance monte.","comite.sceptique":"Le comité reste sceptique. La confiance baisse.","comite.termine":"Le comité est terminé.","trimestre.debut":"Début du trimestre {trimestre}.","trimestre.deblocage":"Nouveaux leviers disponibles.","calendrier.deblocage":function(D){return D&&D.titre?"Note de service : « "+D.titre+" ».":"Note de service : une nouveauté est disponible."},"partie.debut":"Première semaine. Le café est frais, les agents aussi.","partie.fin":function(D){return D.raison==="confiance"?"Fin de la partie : Mme Lavigueur vous remercie pour votre contribution.":"Fin de l'année. Le bilan vous attend."},"partie.sauvegarde":"Partie sauvegardée.","incident.bogue":"Bogue en production : {ilot}. Quelqu'un va passer la soirée dessus.","incident.injection":"Injection de prompt : {ilot}. L'agent a obéi à un texte caché dans un document.","incident.paquet":"Paquet halluciné installé : {ilot}. Le nom avait l'air plausible.","incident.empoisonnement":"MCP empoisonné : {ilot}. L'outil faisait plus que ce qu'il annonçait.","incident.changementSilencieux":"Changement silencieux d'un MCP de fournisseur : {ilot}. Personne n'a rien vu passer.","incident.destruction":"Un agent a détruit des données en production : {ilot}. UPDATE sans WHERE.","incident.fuite":"Fuite de données : {ilot}. Me Bérubé ouvre un dossier.","incident.exfiltration":"Exfiltration : {ilot}. Des secrets sont partis par la porte d'en arrière.","incident.typosquat":"Typosquattage : {ilot}. Ce n'était pas le bon dépôt.","incident.perime":"Une carte périmée a réintroduit un vieux bogue : {ilot}.","incident.resolu":"Incident résolu : {ilot}."})})(globalThis.LTP=globalThis.LTP||{}),(function(r){"use strict";r.donnees.calendrier=[{semaine:1,leviers:["licences"],signataire:"lavigueur",titre:"Sept licences Copilot, pour commencer",texte:"J'ai signé pour sept licences GitHub Copilot de base : une personne volontaire par îlot, c'est notre groupe pilote. Pour l'instant, c'est de l'autocomplétion, rien de plus. Je ne veux pas une révolution, je veux savoir ce que ça change : comparez les pilotes à leurs voisins, chaque vendredi.",surveiller:["pointsLivres","prFusionnees","coutSemaine"],reactions:[{dev:"yannick",texte:"Volontaire ? J'avais levé la main avant la fin de la phrase.",ton:"plus"},{dev:"jeremy",texte:"Je ne suis pas dans le pilote ? Je code comment, moi ?",ton:"moins"},{dev:"raymond",texte:"Sept licences. Pas la mienne. Je vais survivre."},{dev:"marieeve",texte:"Sept pilotes, quatorze témoins. Enfin une vraie expérience.",ton:"plus"}]},{semaine:3,leviers:["autonomie"],signataire:"ginette",titre:"Le clavardage est arrivé",texte:"Bonne nouvelle pour ceux qui ont une licence : on peut maintenant jaser avec l'assistant, directement dans l'éditeur. Le niveau d'autonomie se règle îlot par îlot, de 0 (autocomplétion) à 1 (clavardage). Monte-le dans un îlot à la fois, et regarde la valeur livrée de cet îlot-là le vendredi.",surveiller:["pointsLivres","volumeCode","bogues"],reactions:[{dev:"chloe",texte:"Je vais enfin pouvoir lui demander pourquoi mon CSS fait ça.",ton:"plus"},{dev:"karim",texte:"Il sait ce que veut dire « hors ligne », au moins ?"},{dev:"amira",texte:"Clavarder avec du firmware. On aura tout vu."},{dev:"hugo",texte:"Je vais lui demander d'où viennent ses seuils."}]},{semaine:5,leviers:["reviseurs"],signataire:"ginette",titre:"Combien de regards par PR ?",texte:"Le code arrive un peu plus vite chez les pilotes, et il faut bien que quelqu'un le relise. Tu peux exiger zéro, un ou deux réviseurs par PR, îlot par îlot. Plus de regards attrapent plus de défauts ; surveille quand même la pile de papiers sur le bureau des réviseurs.",surveiller:["delai","prFusionnees","bogues"],reactions:[{dev:"nadia",texte:"Deux réviseurs, ça veut dire moi et… moi ?",ton:"moins"},{dev:"mathieu",texte:"Zéro réviseur, c'est une option ? Je demande pour un ami."},{dev:"amira",texte:"Deux, pour le firmware. Je ne négocie pas."},{dev:"sophie",texte:"Une revue, c'est un test qui sait parler.",ton:"plus"}]},{semaine:7,leviers:["tests"],signataire:"ginette",titre:"Les tests, au menu",texte:"L'assistant écrit des tests en deux secondes. Il les écrit pour qu'ils passent, ce qui n'est pas tout à fait pareil que pour qu'ils vérifient. Choisis ce qu'on exige dans chaque îlot : la couverture affichée va monter, regarde si les bogues baissent avec.",surveiller:["bogues","couvertureApparente"],reactions:[{dev:"sophie",texte:"Enfin un sujet sérieux.",ton:"plus"},{dev:"jeremy",texte:"Des tests ? L'assistant les fait, non ?"},{dev:"lucie",texte:"Un test sur des données fausses passe aussi, vous savez."},{dev:"patrick",texte:"Des tests sur WordPress. Courage, tout le monde."}]},{semaine:8,valeurs:[{levier:"autonomie",v:[2]}],signataire:"lavigueur",titre:"Le mode agent arrive",texte:"Les licences passent au mode agent : l'assistant enchaîne les étapes tout seul et demande votre approbation à chacune. C'est le niveau 2. On me dit que ça change beaucoup de choses ; je veux voir lesquelles dans les chiffres avant d'aller plus loin.",surveiller:["pointsLivres","volumeCode","delai"],reactions:[{dev:"laurence",texte:"Un agent ! Qui travaille pendant que je travaille !",ton:"plus"},{dev:"benoit",texte:"Il demande la permission. Pour l'instant."},{dev:"marieeve",texte:"Je mesure avant et après. Personne ne touche à rien d'autre."},{dev:"steve",texte:"Approbation à chaque étape. Je vais cliquer « oui » souvent."}]},{semaine:9,leviers:["ci"],signataire:"ginette",titre:"Le pipeline d'intégration continue",texte:"Chaque marche du pipeline attrape des défauts plus tôt : la compilation, puis les tests, puis le déploiement continu. Chaque marche prend aussi un peu de temps, et un agent pressé n'aime pas attendre. Monte un îlot d'une marche et compare ses bogues à ceux des autres.",surveiller:["bogues","incidents","tauxEchec"],reactions:[{dev:"marieeve",texte:"Un vrai pipeline. Je sors mes chronomètres.",ton:"plus"},{dev:"patrick",texte:"Adieu, FTP. Je ne t'oublierai pas.",ton:"plus"},{dev:"benoit",texte:"Des déploiements ennuyants. On peut rêver."},{dev:"mathieu",texte:"Si la CI me ralentit, je vais lui parler."}]},{semaine:11,leviers:["lint"],signataire:"ginette",titre:"Lint et formatage",texte:"Un outil qui chicane les virgules à notre place, c'est autant de commentaires de revue qui parlent enfin de logique. Une question reste à trancher : l'agent a-t-il le droit de désactiver une règle pour faire passer la CI ? Petit secret : il va essayer.",surveiller:["bogues","delai"],reactions:[{dev:"nadia",texte:"Plus de commentaires sur les espaces. Merci.",ton:"plus"},{dev:"chloe",texte:"Il va refuser mon CSS, hein ?"},{dev:"sebastien",texte:"Verrouillé. Sinon, l'agent va s'arranger."},{dev:"jeremy",texte:"C'est quoi, un linter ?"}]},{semaine:12,leviers:["approbation"],signataire:"ginette",titre:"Qui approuve les PR ?",texte:"C'est le dernier mot avant la fusion : un humain, le propriétaire du code, ou l'IA elle-même. L'IA approuve vite, avec les mêmes angles morts que l'IA qui a écrit le code. Le propriétaire connaît son code, mais il n'a que deux yeux et des semaines de 40 heures.",surveiller:["delai","bogues"],reactions:[{dev:"mathieu",texte:"L'IA qui m'approuve : enfin quelqu'un qui me suit.",ton:"plus"},{dev:"raymond",texte:"Le propriétaire de l'AS/400, c'est moi. Je signe."},{dev:"sebastien",texte:"Un modèle qui approuve un modèle. Deux miroirs face à face.",ton:"moins"}]},{semaine:14,valeurs:[{levier:"autonomie",v:[3]}],panneaux:["registre"],signataire:"lavigueur",titre:"Des agents qui ouvrent leurs PR, et le registre",texte:"Nouveau trimestre, nouvelle étape : l'agent peut maintenant ouvrir ses propres PR, c'est le niveau 3. Le registre ouvre aussi : des skills, des recettes écrites par l'équipe, qu'on équipe îlot par îlot. Je m'attends à beaucoup plus de PR ; dites-moi aussi qui va les relire.",surveiller:["prFusionnees","volumeCode","delai"],reactions:[{dev:"nadia",texte:"Plus de PR. Toujours une seule Nadia.",ton:"moins"},{dev:"mathieu",texte:"Mes agents ouvrent leurs PR. Je m'occupe du café.",ton:"plus"},{dev:"sophie",texte:"Ma skill tdd-strict est prête depuis longtemps.",ton:"plus"},{dev:"raymond",texte:"Une skill pour l'AS/400 ? Ça, j'écoute."}]},{semaine:15,leviers:["taillePR"],signataire:"ginette",titre:"La taille des PR",texte:"Une PR de 200 lignes se relit vraiment ; une PR de 4 000 lignes se survole, puis s'approuve. Tu peux maintenant plafonner la taille : plus de PR, plus petites, mieux lues. Regarde le délai et les approbations éclair dans les deux semaines qui suivent.",surveiller:["prFusionnees","delai","bogues"],reactions:[{dev:"mathieu",texte:"400 lignes ? Mes imports en font 300.",ton:"moins"},{dev:"nadia",texte:"Des PR de 200 lignes. Je vais pleurer de joie.",ton:"plus"},{dev:"laurence",texte:"Plus petites, mais quatre fois plus nombreuses."},{dev:"olivier",texte:"On découpe. C'est plus long pour moi, plus vite pour Nadia."}]},{semaine:17,leviers:["modele"],signataire:"regis",titre:"Le choix du modèle",texte:"Le contrat permet maintenant de choisir le modèle par défaut. J'ai fait un tableau : l'économique coûte quatre fois moins cher par jeton que le haut de gamme. On me dit que ce n'est pas le bon chiffre. Prouvez-le-moi avec le coût par point livré.",surveiller:["coutSemaine","bogues"],reactions:[{dev:"luc",texte:"Un modèle pas cher pour du C embarqué ? On va voir."},{dev:"sebastien",texte:"Le moins cher invente des noms de paquets. Je le note.",ton:"moins"},{dev:"marieeve",texte:"Le coût par point livré. Régis parle enfin mon langage.",ton:"plus"},{dev:"hugo",texte:"Le modèle local garderait la télémétrie chez nous."}]},{semaine:18,leviers:["sessionsMax"],signataire:"ginette",titre:"Plusieurs sessions en parallèle",texte:"Chacun peut maintenant faire rouler jusqu'à trois sessions d'agent en même temps ; ça s'appelle du multi-Clauding, paraît-il. La deuxième session rapporte moins que la première, la troisième encore moins. La fatigue, elle, ne fait pas de rabais.",surveiller:["pointsLivres","fatigue","jetonsSemaine"],reactions:[{dev:"laurence",texte:"Trois ? J'ai quatre écrans, mais je prends.",ton:"plus"},{dev:"diane",texte:"Trois sessions. J'ai déjà assez d'un Excel.",ton:"moins"},{dev:"tommy",texte:"Trois agents, et moi, j'apprends avec lequel ?"},{dev:"mathieu",texte:"Trois, c'est un début.",ton:"plus"}]},{semaine:20,leviers:["plafondJetons"],signataire:"regis",titre:"Un plafond de jetons",texte:"J'ai reçu le relevé de jetons. Je l'ai lu deux fois, puis j'ai demandé un plafond. Vous pouvez maintenant en mettre un par îlot : souple, il m'avertit ; strict, il coupe. Je veux aussi savoir combien de travail il coupe.",surveiller:["jetonsSemaine","coutSemaine","pointsLivres"],reactions:[{dev:"laurence",texte:"Coupée en plein élan ? On verra bien.",ton:"moins"},{dev:"marieeve",texte:"Une alerte avant la coupure, ça se mesure.",ton:"plus"},{dev:"yannick",texte:"Mes MCP mangent combien de jetons, au juste ?"}]},{semaine:22,leviers:["formation"],signataire:"ginette",titre:"Un programme de formation",texte:"Travailler avec un agent, ça s'apprend : écrire une bonne demande, relire un diff de 300 lignes, reconnaître une injection. Ça coûte du temps tout de suite, la formation prend quatre semaines à se mettre en place, et ça rapporte après. Le mentorat, c'est moi ; j'ai déjà quelqu'un en tête.",surveiller:["coutSemaine","pointsLivres"],reactions:[{dev:"diane",texte:"Si c'est Ginette qui montre, je viens.",ton:"plus"},{dev:"tommy",texte:"Une formation ! Je réserve ma place.",ton:"plus"},{dev:"mathieu",texte:"Je pourrais la donner, cette formation."},{dev:"jeremy",texte:"On va apprendre à coder sans l'agent ?"}]},{semaine:23,leviers:["disciplineNon"],signataire:"lavigueur",titre:"Savoir dire non",texte:"Les directions ont compris que le code va vite, et les demandes se multiplient : Francine a doublé les siennes. Je vous autorise à dire non, îlot par îlot. Je ne veux pas des refus pour le principe ; je veux qu'on livre ce qui compte.",surveiller:["backlog","satisfaction","volumeCode"],reactions:[{dev:"patrick",texte:"Un 15e site ? Je peux dire non ? Enfin.",ton:"plus"},{dev:"olivier",texte:"En agence, on disait toujours oui."},{dev:"karim",texte:"La version montre-bracelet, on peut dire non ?",ton:"plus"},{dev:"lucie",texte:"Moins de demandes, de meilleures données."}]},{semaine:24,valeurs:[{levier:"autonomie",v:[4]},{levier:"sessionsMax",v:[4,5,6]}],signataire:"lavigueur",titre:"Fusion automatique et six sessions",texte:"Le fournisseur permet maintenant à l'agent de fusionner seul (niveau 4), et chacun peut ouvrir jusqu'à six sessions. Je n'ai pas dit qu'il fallait le faire partout. Le site vitrine et le firmware des capteurs ne courent pas les mêmes risques : choisissez îlot par îlot.",surveiller:["incidents","bogues","fatigue"],reactions:[{dev:"laurence",texte:"Six sessions ! Il me manque deux écrans.",ton:"plus"},{dev:"amira",texte:"Fusion automatique sur le firmware : jamais.",ton:"moins"},{dev:"benoit",texte:"Il fusionne seul, et c'est mon téléphone qui sonne.",ton:"moins"},{dev:"mathieu",texte:"Ship it, sans attendre personne.",ton:"plus"}]},{semaine:25,leviers:["specs"],signataire:"ginette",titre:"Des specs avant le code",texte:"Un agent fait exactement ce qu'on lui demande, et c'est justement ça, le problème. Une spec légère, c'est une page : pour qui, quoi, et comment on saura que ça marche. Ça retarde un peu le départ et ça évite de tout refaire quand la direction change d'idée.",surveiller:["delai","satisfaction"],reactions:[{dev:"sophie",texte:"Une page de spec, et mes tests savent quoi vérifier.",ton:"plus"},{dev:"karim",texte:"Une page, pas un roman. Les inspecteurs n'ont pas le temps."},{dev:"jeremy",texte:"On écrit avant de coder ? Comme un plan ?"},{dev:"mathieu",texte:"Une spec. Pour 400 lignes. D'accord.",ton:"moins"}]},{semaine:27,leviers:["accesProd"],signataire:"berube",titre:"Les agents et la production",texte:"J'ai découvert que les agents ont accès à la production, en lecture et en écriture, depuis le début de l'année. Je l'ai imprimé. Vous pouvez maintenant choisir, îlot par îlot : écriture, lecture seule ou aucun accès. Un diagnostic rapide ne vaut pas une table de clients effacée.",surveiller:["incidents","mttr"],reactions:[{dev:"benoit",texte:"Lecture seule. Je vais mieux dormir.",ton:"plus"},{dev:"patrick",texte:"L'agent écrivait en prod ? Ça explique des choses."},{dev:"sebastien",texte:"Un agent n'a pas besoin d'écrire en production. Jamais.",ton:"plus"},{dev:"marieeve",texte:"Lecture seule et des journaux : je signe."}]},{semaine:28,leviers:["bacASable"],signataire:"ginette",titre:"Un bac à sable pour les agents",texte:"L'agent peut travailler dans une boîte : un conteneur, où un paquet douteux ne voit pas le reste du réseau. La boîte peut aussi ne parler qu'aux adresses permises, ce qui coupe court aux injections qui veulent envoyer nos données ailleurs. Ça coûte un peu, et Yannick va chialer.",surveiller:["surfaceAttaque","incidents"],reactions:[{dev:"sebastien",texte:"Un bac à sable. Je souris en dedans.",ton:"plus"},{dev:"yannick",texte:"Réseau filtré ? Mon serveur préféré est sur un forum.",ton:"moins"},{dev:"patrick",texte:"Mes extensions WordPress en quarantaine. Bonne idée."},{dev:"hugo",texte:"Mes pipelines ont besoin de quelles adresses, au juste ?"}]},{semaine:30,leviers:["approbationSorties"],signataire:"berube",titre:"Les sorties externes",texte:"Un agent qui lit un courriel peut obéir à ce courriel. Je l'ai lu dans un rapport de sécurité ; je l'ai imprimé trois fois. Vous pouvez désormais exiger qu'un humain confirme tout ce qui sort : courriels, requêtes web, billets externes. C'est un clic de plus, et une branche de la triade en moins.",surveiller:["expositionLoi25","delai"],reactions:[{dev:"sebastien",texte:"Une branche coupée. Il en reste deux à surveiller.",ton:"plus"},{dev:"lucie",texte:"Les factures des fournisseurs ne donneront plus d'ordres.",ton:"plus"},{dev:"steve",texte:"Un clic par courriel ? Mes flux en envoient 3 000.",ton:"moins"},{dev:"yannick",texte:"Je vais cliquer « approuver » souvent, moi."}]},{semaine:31,leviers:["politiqueRegistre"],signataire:"ginette",titre:"La politique du registre",texte:"Qui peut installer quoi, et qui en répond ? En libre-service, Yannick a déjà installé des MCP trouvés sur un forum ; je les ai comptés. Une liste blanche, c'est moins de surprises. Un propriétaire par carte, c'est quelqu'un à qui poser la question quand ça brise.",surveiller:["cartesOrphelines","surfaceAttaque"],reactions:[{dev:"yannick",texte:"Un propriétaire par MCP ? J'en ai combien, au juste ?"},{dev:"sebastien",texte:"Une liste blanche. Mon rapport d'incident attendra.",ton:"plus"},{dev:"steve",texte:"Mes 14 MCP vont passer en entrevue.",ton:"moins"},{dev:"marieeve",texte:"Des propriétaires : enfin un inventaire.",ton:"plus"}]},{semaine:32,leviers:["modeleParTache"],signataire:"regis",titre:"Un modèle selon la tâche",texte:"Un petit modèle pour le lint et la documentation, un gros pour l'architecture. Le fournisseur promet environ un tiers de moins sur la facture, à qualité presque égale. Je l'ai noté. Je vais vérifier.",surveiller:["coutSemaine","jetonsSemaine"],reactions:[{dev:"marieeve",texte:"Je compare les jetons avant et après. Évidemment."},{dev:"luc",texte:"Le gros modèle pour le firmware, s'il vous plaît."},{dev:"mathieu",texte:"Le petit pour mes commits, le gros pour moi.",ton:"plus"},{dev:"chloe",texte:"Un modèle pour les couleurs, un autre pour le code ?"}]},{semaine:33,leviers:["classification"],signataire:"berube",titre:"Classer les données sensibles",texte:"On ne protège bien que ce qu'on a étiqueté. Les photos des inspecteurs, les numéros de clients, les salaires : chaque donnée aura une étiquette, posée à la main ou automatiquement. La classification prend deux semaines à se mettre en place ; ensuite, on saura enfin ce qui sort.",surveiller:["expositionLoi25"],reactions:[{dev:"lucie",texte:"Des étiquettes ! Je commence par les fournisseurs.",ton:"plus"},{dev:"karim",texte:"Les photos des inspecteurs, c'est sensible ? Oui. Oups."},{dev:"diane",texte:"Les salaires sont sensibles depuis 2007. Je le sais."},{dev:"hugo",texte:"Une mesure de température, c'est sensible ?"}]},{semaine:34,leviers:["catalogue"],signataire:"ginette",titre:"Un catalogue de données",texte:"Il y a trois listes de fournisseurs, et l'agent prend toujours la première qu'il trouve. Un catalogue dit quelle source est la bonne, qui s'en occupe et de quand elle date. Il faut un mois pour le monter ; Lucie a déjà son crayon.",surveiller:["bogues","satisfaction"],reactions:[{dev:"lucie",texte:"Une seule liste. Je peux mourir heureuse. Pas tout de suite.",ton:"plus"},{dev:"raymond",texte:"La source officielle, c'est l'AS/400. Depuis 1994."},{dev:"hugo",texte:"Une source officielle pour les seuils. Enfin.",ton:"plus"},{dev:"yannick",texte:"Il va y avoir un MCP pour le catalogue ?"}]},{semaine:36,leviers:["passerelleMCP"],signataire:"ginette",titre:"Une passerelle MCP",texte:"Tous les appels d'outils des agents peuvent passer par un point de contrôle journalisé, en lecture seule par défaut. Si un MCP change sa description en douce, la passerelle le voit. Il faut deux semaines pour l'installer, et Sébastien va enfin avoir des journaux à lire le soir.",surveiller:["surfaceAttaque"],reactions:[{dev:"sebastien",texte:"Chaque appel journalisé. Je vais lire ça au lit.",ton:"plus"},{dev:"yannick",texte:"Mes MCP vont passer par un péage ?",ton:"moins"},{dev:"marieeve",texte:"Des journaux d'outils. J'en fais un tableau de bord.",ton:"plus"},{dev:"benoit",texte:"Si le MCP de la billetterie change, on va le savoir ?"}]},{semaine:37,leviers:["politiqueNonTI"],signataire:"kevin",titre:"Le développement hors TI",texte:"Salut l'équipe TI ! Je code. Pas beaucoup, juste une application de suivi des campagnes, faite en une fin de semaine avec un agent. La direction vous demande de décider quoi faire avec les gens comme moi : interdire, ignorer ou encadrer. Moi, je vote pour qu'on m'aide !",surveiller:["applisFantomes","satisfaction"],reactions:[{dev:"steve",texte:"Kevin, on va t'aider à faire ça comme du monde.",ton:"plus"},{dev:"sebastien",texte:"Kevin. Ton application. Elle stocke quoi ?"},{dev:"patrick",texte:"Si c'est encadré, je veux bien l'héberger."},{dev:"diane",texte:"Un développeur au marketing. Il ne manquait plus que ça.",ton:"moins"}]},{semaine:40,leviers:["observabilite"],signataire:"ginette",titre:"L'observabilité",texte:"Ce qu'on ne mesure pas, on ne le voit pas. Avec l'observabilité, des métriques cachées depuis janvier vont apparaître au tableau de bord : le temps de rétablissement précis, puis la couverture réelle et la compréhension. Il faut trois semaines pour tout brancher. Prépare-toi : ce n'est pas toujours beau.",surveiller:["mttr","incidents"],reactions:[{dev:"marieeve",texte:"Trois semaines. Je compte les jours.",ton:"plus"},{dev:"benoit",texte:"Des graphiques à 3 h du matin. Au moins, je vais voir.",ton:"plus"},{dev:"mathieu",texte:"Mesurer mon code ? Il est parfait."},{dev:"sophie",texte:"La couverture réelle. On va rire. Ou pleurer."}]},{semaine:42,leviers:["objectif"],signataire:"lavigueur",titre:"Un objectif pour la direction",texte:"Le conseil veut un chiffre, un seul, pour suivre la transition. Choisissez-le avec soin : les équipes vont l'optimiser, c'est humain. Si on compte les PR, on aura des PR. Moi, je voudrais surtout de la valeur.",surveiller:["prFusionnees","delai","satisfaction"],reactions:[{dev:"marieeve",texte:"Un seul chiffre. On va tous le regarder, et seulement lui.",ton:"moins"},{dev:"mathieu",texte:"Si c'est le nombre de PR, je gagne.",ton:"plus"},{dev:"nadia",texte:"Si c'est le délai, on va relire plus vite. Et moins bien.",ton:"moins"},{dev:"patrick",texte:"La satisfaction ? On va dire oui à tout."}]},{semaine:44,leviers:["revuesExplication"],signataire:"ginette",titre:"Les revues d'explication",texte:"Chacun explique son code à un collègue, sans l'IA, au tableau blanc. Ça prend du temps et ça rend nerveux. En échange, on saura enfin qui comprend quoi, et la compréhension remonte chez ceux qui expliquent.",surveiller:["comprehension","delai"],reactions:[{dev:"jeremy",texte:"Expliquer mon code sans l'agent ? Euh… demain ?",ton:"moins"},{dev:"sophie",texte:"J'ai un tableau blanc et des questions.",ton:"plus"},{dev:"laurence",texte:"Lequel de mes agents doit venir expliquer ?"},{dev:"tommy",texte:"Je vais enfin comprendre ce que l'agent a écrit.",ton:"plus"}]},{semaine:46,leviers:["pair"],signataire:"ginette",titre:"Le retour du binôme",texte:"Deux têtes sur le même code : avec un humain, ça va moins vite, mais les deux comprennent, et les juniors apprennent. Avec l'IA, ça va vite ; vérifie juste qui tient le volant. La rotation alterne les deux, une semaine sur deux.",surveiller:["comprehension","pointsLivres"],reactions:[{dev:"tommy",texte:"Benoît et moi, devant le même écran ? Oui !",ton:"plus"},{dev:"raymond",texte:"Je prends un binôme. Je vais lui montrer la colonne 6.",ton:"plus"},{dev:"mathieu",texte:"Un binôme va me ralentir de moitié.",ton:"moins"},{dev:"luc",texte:"Un binôme avec Amira. J'apporte le fer à souder."}]},{semaine:48,leviers:["embauche"],signataire:"lavigueur",titre:"La relève",texte:"Régis me propose de geler l'embauche des juniors : un agent coûte moins cher qu'un salaire, dit-il. Ginette me demande qui sera senior dans cinq ans. La décision vous revient : gel, embauche normale, ou programme de relève pour former ceux qu'on a déjà.",surveiller:["releve"],reactions:[{dev:"tommy",texte:"Un programme de relève ? Je lève la main.",ton:"plus"},{dev:"jeremy",texte:"Je vais être embauché après mon stage, ou remplacé par un agent ?",ton:"moins"},{dev:"raymond",texte:"Quelqu'un pour prendre l'AS/400 ? J'ai des notes."},{dev:"benoit",texte:"Qui va faire la garde quand je serai au chalet ?"}]}]})(globalThis.LTP=globalThis.LTP||{}),(function(r){"use strict";function e(w,W){var z={};for(var X in W)z[X]=W[X];for(var te=0;te<w.length;te++){var oe=w[te];if(!(!oe||typeof oe!="object"))for(var le in oe)Object.prototype.hasOwnProperty.call(oe,le)&&(z[le]=oe[le])}return z}function n(w){return e(Array.prototype.slice.call(arguments,1),{texte:w})}function m(w){return e(Array.prototype.slice.call(arguments,1),{texte:w,effet:!1})}function f(w){return e(Array.prototype.slice.call(arguments,1),{texte:w,effet:!0})}function q(){return{devs:Array.prototype.slice.call(arguments)}}function k(){return{traits:Array.prototype.slice.call(arguments)}}function D(w){return{condition:w}}var R={ton:"plus"},U={ton:"moins"},x={licence:!0},A={licence:!1},C={pilote:!0},_={pilote:!1},B={niveaux:["junior","stagiaire"]},F={niveaux:["senior"]};function p(w,W){return typeof w=="number"&&isFinite(w)?w:W}function L(w,W,z,X){try{return W.levier(w,z,X)}catch(te){return}}function j(w,W,z){try{return!!W.aLicence(w,z)}catch(X){return!1}}function M(w,W,z){return p(Number(L(w,W,"autonomie",z&&z.ilot)),0)}function J(w){return w&&w.derniere||{}}function I(w,W){return!!(w&&Array.isArray(w.traits)&&w.traits.indexOf(W)>=0)}function h(w,W){return w&&w.ilots&&W&&w.ilots[W.ilot]||null}function c(w){return p(w&&w.semaine,0)}function s(w){return p(w&&w.jour,0)}function o(w,W,z){try{return W.devsDe(w,z.ilot).filter(function(X){return X.id!==z.id})}catch(X){return[]}}function u(w,W){try{var z=w.defDev(W);return z&&z.nom||String(W)}catch(X){return String(W)}}function l(w,W){return!!(w&&w.org&&w.org.drapeaux&&w.org.drapeaux[W])}function i(w,W,z){return p(J(z).revues,0)>=2||I(z,"reviseur")}var t=D(i);function d(w,W,z){return!i(w,W,z)}function a(w,W){return function(z,X,te){return L(z,X,w,te&&te.ilot)===W}}function v(w){return function(W,z){try{return!!z.enAttente ube",trimestres:[3],poids:3,question:"Les photos et les formulaires des inspecteurs contiennent des noms, des adresses, parfois des plaques. Où passent ces données quand un agent y touche ?",reponses:[{id:"a",texte:function(g,P){if(!A(g,P,"expositionLoi25"))return"Notre exposition est minime : les agents ne gardent rien en mémoire, les échanges sont chiffrés et tout est conforme à la Loi 25.";var G=q(g,"expositionLoi25",0);return"Notre exposition Loi 25 est à "+e.nombre(G,0)+" sur 100. "+(G<40?"La classification fait son travail.":"C'est trop : on resserre.")},evaluer:function(g,P){return A(g,P,"expositionLoi25")?q(g,"expositionLoi25",0)<40?.9:.6:-.9},reaction:K("Un chiffre et une source. Je n'ajoute rien. Ça ne m'arrive pas souvent.","Hmm.","« Conforme », sans avoir classé une seule donnée ? Vous venez d'écrire mon prochain chapitre.")},{id:"b",texte:function(g,P){return"Je ne peux pas vous le dire avec précision tant que les données ne sont pas classifiées. La classification est "+(C(g,P,"classification")==="non"?"à lancer, et je la lance.":"en cours.")},evaluer:function(g,P){return A(g,P,"expositionLoi25")?-.3:C(g,P,"classification")!=="non"?.6:.4},reaction:K("On ne protège que ce qu'on a étiqueté. Vous m'avez écouté. Je suis ému.","Bon.","Vous la mesurez pourtant, cette exposition. Elle est sur votre tableau de bord.")},{id:"c",texte:"Nulle part : nos agents ne lisent que du code, jamais les photos ni les formulaires eux-mêmes.",evaluer:function(){return-.8},reaction:"Un agent qui lit un formulaire d'inspection lit un nom. Un nom, c'est un renseignement personnel."}]},{id:"berube-incident-securite",personnage:"berube",trimestres:[3],poids:4,condition:function(g){return!!S(g)},question:function(g){var P=S(g)||{};return"L'incident de sécurité de la semaine "+e.nombre(m(P.debut,0),0)+", dans l'îlot "+j(P.ilot)+" : qu'est-ce qui a changé depuis ?"},reponses:[{id:"a",texte:"On a enfermé les agents de cet îlot dans un bac à sable, et un humain approuve maintenant chaq endre:"jour",personnage:"ginette",texte:"Joue maintenant une journée. Du lundi au jeudi, l'open space vit et parle ; le vendredi, la semaine se calcule et le rapport sort. Si une carte d'événement arrive, tout s'arrête jusqu'à ta décision.",action:"Joue une journée pour continuer.",fait:"Une journée de passée. Il en reste quelques-unes, crois-moi."},{id:"notes",cibles:[".note-service",'[data-region="journal"]'],region:"journal",personnage:"ginette",texte:"Chaque nouveauté arrive par une note de service, une par semaine au plus : le clavardage, le mode agent, les réviseurs, les tests… Mon conseil : change un seul levier à la fois, puis attends un vendredi ou deux. Sinon, tu ne sauras jamais lequel a fait quoi."},{id:"comite",cibles:['[data-region="journal"]'],region:"journal",personnage:"ginette",texte:"À la fin de chaque trimestre, le comité te pose trois questions sur tes chiffres. Dis la vérité, même quand elle n'est pas belle : ils ont le tableau de bord, eux aussi. Bon courage. Je suis au bout de l'open space, à côté de la machine à café."}],r.donnees.indices={leviers:{licences:{aucune:"Plus de licences du tout ? Tu vas avoir des chiffres sans IA pour comparer. Et quelques visages longs.",pilote:"Sept pilotes, quatorze témoins : regarde vendredi si les pilotes livrent plus que leurs voisins. Rappelle-toi seulement que ce sont des volontaires, donc déjà convaincus.",tous:"Copilot pour tout le monde. Ça va écrire plus, et ça va coûter des licences et des jetons. Regarde surtout qui relit tout ce nouveau code."},pair:{humain:"Deux humains, un clavier : ça va moins vite, mais les deux comprennent. Pour les juniors, c'est de l'or.",ia:"Humain avec l'IA, ça va vite. Vérifie juste que l'humain tient encore le volant.",rotation:"La rotation, c'est un bon compromis : une semaine on apprend, une semaine on livre."},reviseurs:{0:"Aucun réviseur ? Le code part en production tel qu'il sort de l'agent. Courageux.",2:"Deux réviseurs, c'est solide. Regarde quand même la pile sur le bureau de Nadia dans deux semaines."},approbation:{auto:"L'IA qui approuve le code de l'IA. Mêmes angles morts, même sourire.",proprietaire:"Le propriétaire du code a le dernier mot. Bonne idée, tant qu'il a le temps de lire."},taillePR:{libre:"Taille libre ? Mathieu te remercie. Nadia, un peu moins.",400:"400 lignes : à peu près la limite où un humain lit encore vraiment.",200:"200 lignes, c'est très lisible. Surveille seulement que ça ne devienne pas 40 PR par jour."},ci:{aucune:"Sans CI, chaque défaut se découvre en production. C'est une façon d'apprendre, disons.",tests:"Compilation et tests à chaque PR : les agents commencent à avoir des rails.",complet:"Pipeline complet : les déploiements deviennent ennuyants. C'est exactement ce qu'on veut."},lint:{aucun:"Pas de lint : les revues vont parler de virgules au lieu de parler de logique.",strict:"Strict, mais pas verrouillé : un agent pressé peut désactiver une règle pour faire passer la CI. Je dis ça de même.",verrouille:"Verrouillé : l'agent ne peut plus faire taire le lint pour passer. Il doit corriger son code."},tests:{aucun:"Aucun test, avec des agents ? Tu leur enlèves les rails et tu montes la vitesse.",unitaires:"Les tests unitaires écrits par l'agent montent la couverture vite. La couverture affichée, en tout cas.",mutation:"Les tests de mutation modifient le code exprès pour voir si les tests s'en aperçoivent. Les tests qui ne vérifient rien ne s'en remettent pas."},revuesExplication:{mensuelles:"Une fois par mois, chacun explique son code sans l'IA. Tu vas apprendre des choses. Eux aussi.",majeures:"À chaque PR majeure : ça coûte du temps, mais tu sauras enfin qui comprend quoi."},autonomie:{0:"De l'autocomplétion seulement. Prudent. Raymond approuve, Laurence boude.",2:"Agent avec approbation à chaque étape : un bon niveau pour du code critique.",3:"L'agent ouvre ses PR tout seul. Ça va écrire beaucoup. Reste à savoir qui va relire.",4:"Il fusionne seul ? Sur un site vitrine, pourquoi pas. Sur le
