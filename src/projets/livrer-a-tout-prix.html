/* 00-jetons.css */
/* Jetons de design. Propriétaire : agent F.
   Direction : un open space en fin d'après-midi. Papier crème et moquette chaude, lumière dorée qui entre
   par les stores, post-it jaunes ; un seul accent, le bleu du stylo à bille, pour tout ce qui se clique.
   Les couleurs d'état (ok, warn, crit) restent réservées aux états et ne servent jamais de décor.
   Contrat avec l'agent E : --bg --surface --fg --muted --line --accent --ok --warn --crit
   --font-titre --font-texte --font-mono (les autres jetons sont des ajouts). */
:root {
  color-scheme: light;
  --bg: #efe7da;
  --surface: #fbf7ef;
  --surface-2: #f4ecdf;
  --paper: #fffdf8;
  --fg: #221c15;

  --line: #ddd0bc;
  --line-strong: #b5a48c;
  --accent: #2346c7;
  --accent-fg: #ffffff;
  --accent-soft: #e2e7fa;
  --accent-line: #8d9fe6;
  --ok: #276b37;
  --ok-soft: #dcefdc;
  --warn: #8a5a00;
  --warn-soft: #f8e8c4;
  --crit: #b3261e;
  --crit-soft: #f8dcd6;
  --postit: #fbe48f;
  --postit-fg: #3a2e10;
  --postit-line: #e3c75a;
  --soleil: #f2a541;
  --lueur: rgba(242, 165, 65, .22);
  --ciel-haut: #f6c98b;
  --ciel-bas: #f19a62;
  --ville: #b26a4b;
  --moquette: rgba(90, 64, 40, .035);
  --hachure: rgba(103, 92, 79, .18);
  --shadow: 0 1px 0 rgba(60, 40, 20, .05), 0 10px 28px -14px rgba(60, 40, 20, .35);
  --shadow-haute: 0 2px 0 rgba(60, 40, 20, .05), 0 24px 60px -20px rgba(40, 25, 10, .5);
  --backdrop: rgba(34, 24, 14, .46);

  --font-titre: 'Chakra Petch', 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
  --font-texte: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --fs-xs: .75rem; --fs-s: .8125rem; --fs-m: .9375rem; --fs-l: 1.0625rem; --fs-xl: 1.375rem; --fs-2xl: 1.875rem;
  --fs-3xl: clamp(2.25rem, 6.5vw, 4rem);
  --r: 4px;
  --r-l: 10px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));

/* 10-base.css */
/* Base, typographie, composants communs et grille de l'écran de jeu. Propriétaire : agent F. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  /* lumière de fin d'après-midi qui entre par la droite, sur une moquette discrète */
  background-image:
    radial-gradient(1100px 620px at 100% -10%, var(--lueur), transparent 70%),
    repeating-linear-gradient(45deg, var(--moquette) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, var(--moquette) 0 2px, transparent 2px 6px);
  color: var(--fg);
  font-family: var(--font-texte); font-size: var(--fs-m); line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-titre); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono, .mono * { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.petit { font-size: var(--fs-xs); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.app:focus { outline: none; }
[hidden] { display: none !important; }

.shell { min-height: 100vh; }
.notice { max-width: 640px; margin: 15vh auto; padding: 0 var(--gutter); display: grid; gap: 8px; }

.eyebrow { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h-sec { font-size: var(--fs-l); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
.h-sec .muted { font-family: var(--font-texte); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: var(--fs-s); }
.zone-titre { font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--paper); color: var(--fg);
  font-weight: 600; cursor: pointer; text-align: center; line-height: 1.2;
  transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
}
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn--primaire { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 6px 16px -8px var(--accent); }
.btn--primaire:hover:not([disabled]) { filter: brightness(1.08); }
.btn--fantome { background: transparent; }
.btn--grand { min-height: 48px; padding: 10px 20px; font-size: var(--fs-l); }
.btn--petit { min-height: 34px; padding: 5px 10px; font-size: var(--fs-s); }
.btn small { font-weight: 400; color: inherit; opacity: .8; font-size: var(--fs-xs); }
.lien { background: none; border: 0; padding: 2px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.lien--crit { color: var(--crit); }
.ibtn { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; border-radius: var(--r); border: 1px solid transparent; background: transparent; color: var(--fg); cursor: pointer; }
.ibtn:hover { border-color: var(--line-strong); background: var(--paper); }
.ibtn--texte { font-size: var(--fs-s); font-weight: 600; }

/* ---------- Badges, puces, provenance ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: .6875rem; font-weight: 600; letter-spacing: .02em; border: 1px solid var(--line-strong); color: var(--muted); background: var(--surface); white-space: nowrap; }
.badge--accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.badge--losange { color: var(--accent); border-color: transparent; background: transparent; padding: 0 2px; font-size: .75rem; }
.badge--verrou { font-family: var(--font-mono); }

/* ---------- Visages ---------- */
.visage { display: inline-flex; flex: none; border-radius: 50%; overflow: hidden; background: var(--surface-2); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--line); line-height: 0; }
.visage svg { display: block; }
.visage-secours { display: grid; place-items: center; font-family: var(--font-titre); font-weight: 700; color: var(--muted); }

/* ---------- Bulles et post-it ---------- */
.bulle { position: relative; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 4px var(--r-l) var(--r-l) var(--r-l); padding: 12px 14px; box-shadow: var(--shadow); }
.bulle--grande { font-size: var(--fs-l); font-weight: 500; }
.postit {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start;
  background: var(--postit); color: var(--postit-fg); padding: 10px 12px; border-radius: 2px 2px 14px 2px;
  box-shadow: 0 1px 0 var(--postit-line), 0 8px 18px -12px rgba(60, 40, 0, .6);
  font-size: var(--fs-s); transform: rotate(-.6deg);
}
.postit::before { content: ""; position: absolute; top: -6px; left: 50%; width: 46px; height: 12px; transform: translateX(-50%) rotate(2deg); background: rgba(255, 255, 255, .45); border: 1px solid rgba(0, 0, 0, .05); }
.postit .visage { box-shadow: 0 0 0 2px var(--postit); }
.postit b { font-family: var(--font-titre); font-weight: 600; margin-right: 2px; }
.postit-fermer { background: none; border: 0; color: inherit; font-size: 1.1rem; line-height: 1; padding: 2px 6px; cursor: pointer; opacity: .65; border-radius: 3px; }
.postit-fermer:hover { opacity: 1; background: rgba(0, 0, 0, .06); }

/* ---------- Jauges ---------- */
.jauge { display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, 1.2fr) auto; gap: 10px; align-items: center; font-size: var(--fs-s); }
.jauge-lib { min-width: 0; }
.jauge-piste { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.jauge-rempli { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
.jauge--ok .jauge-rempli { background: var(--ok); }
.jauge--warn .jauge-rempli { background: var(--warn); }
.jauge--crit .jauge-rempli { background: var(--crit); }
.jauge-val { min-width: 3.5em; text-align: right; color: var(--fg); }
.jauge--cachee .jauge-val { color: var(--muted); font-style: italic; font-size: var(--fs-xs); }
.jauge-piste--hachure { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--hachure) 4px 6px); }

/* ---------- Voyants de la triade ---------- */
.voyants { display: inline-flex; gap: 5px; align-items: center; }
.voyant { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); }
.voyant i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-strong); flex: none; }
.voyant.is-on i { background: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft), 0 0 8px var(--warn); }
.voyant.is-on { color: var(--fg); }
.voyants.is-complete .voyant.is-on i { background: var(--crit); box-shadow: 0 0 0 2px var(--crit-soft), 0 0 10px var(--crit); }
.voyants--etiquettes { flex-wrap: wrap; gap: 6px 14px; }

/* ---------- Groupes de choix (contrôle segmenté et liste) ---------- */
.choix { display: flex; flex-wrap: wrap; gap: 0; }
.choix--segmente { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface-2); padding: 2px; gap: 2px; }
.choix-opt {
  flex: 1 1 auto; min-height: 34px; padding: 5px 10px; border: 0; border-radius: 3px; background: transparent; color: var(--fg);
  font-size: var(--fs-s); font-weight: 500; cursor: pointer; text-align: center; line-height: 1.2; position: relative;
}
.choix--segmente .choix-opt:hover:not([disabled]):not(.is-actif) { background: var(--paper); }
.choix--segmente .choix-opt.is-actif { background: var(--accent); color: var(--accent-fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
.choix--segmente .choix-opt.is-programme:not(.is-actif) { box-shadow: inset 0 0 0 1.5px var(--accent); }
.choix--liste { flex-direction: column; gap: 2px; }
.choix--liste .choix-opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 7px 10px; border: 1px solid transparent; }
.choix--liste .choix-opt:hover:not([disabled]) { background: var(--paper); border-color: var(--line); }
.choix--liste .choix-opt.is-actif { background: var(--accent-soft); border-color: var(--accent-line); font-weight: 600; }
.choix-puce { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--paper); display: grid; place-items: center; }
.choix-opt.is-actif .choix-puce { border-color: var(--accent); }
.choix-opt.is-actif .choix-puce::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.choix-opt.is-programme .choix-puce { border-style: dashed; border-color: var(--accent); }
.choix-marque { font-size: var(--fs-xs); }
.choix.is-desactive { opacity: .55; }
.choix-opt[disabled] { cursor: not-allowed; }

/* ---------- Cases à cocher ---------- */
.case { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; cursor: pointer; position: relative; }
.case input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; cursor: pointer; }
.case-boite { width: 22px; height: 22px; border-radius: 4px; border: 1.5px solid var(--line-strong); background: var(--paper); display: grid; place-items: center; margin-top: 1px; transition: background .15s, border-color .15s; }
.case input:checked + .case-boite { background: var(--accent); border-color: var(--accent); }
.case input:checked + .case-boite::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-fg); border-width: 0 2.5px 2.5px 0; transform: translate(0, -1px) rotate(45deg); }
.case input:focus-visible + .case-boite { outline: 3px solid var(--accent); outline-offset: 2px; }
.case-texte { display: grid; gap: 2px; }
.case-texte small { color: var(--muted); font-size: var(--fs-s); }
.case--petite .case-boite { width: 18px; height: 18px; }
.case--petite input { width: 18px; height: 18px; }
.case--petite .case-texte { font-size: var(--fs-s); }

.erreur { color: var(--crit); font-size: var(--fs-s); font-weight: 600; }
.erreur::before { content: "⚠ "; }
.icone { flex: none; vertical-align: -3px; }

/* ---------- Grille de l'écran de jeu (créée par 40-ui-dom.js) ---------- */
.jeu {
  display: grid; gap: 16px; align-items: start;
  padding: 16px var(--gutter-r) 32px var(--gutter);
  max-width: 1720px; margin: 0 auto;
  grid-template-columns: minmax(0, 1fr) var(--panneau-l);
  grid-template-areas: "openspace panneau" "tableau panneau" "journal panneau";
}
.zone { min-width: 0; }
.zone-openspace { grid-area: openspace; }
.zone-panneau { grid-area: panneau; position: sticky; top: calc(var(--hud-h) + 12px); align-self: start; }
.zone-tableau { grid-area: tableau; }
.zone-journal { grid-area: journal; }
@media (min-width: 1440px) {
  .jeu { grid-template-columns: minmax(0, 1fr) 320px var(--panneau-l); grid-template-areas: "openspace openspace panneau" "tableau journal panneau"; }
}
@media (max-width: 1100px) { :root { --panneau-l: 340px; } }
@media (max-width: 900px) {
  .jeu { grid-template-columns: minmax(0, 1fr); grid-template-areas: "openspace" "tableau" "journal" "panneau"; padding-bottom: 96px; gap: 14px; }
  .zone-panneau { position: static; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* 20-hud.css */
/* HUD collant, accueil et journal. Propriétaire : agent F. */

/* ---------- HUD ---------- */
.hud { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding-top: env(safe-area-inset-top, 0px); }
.hud-inner {
  display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
  max-width: 1720px; margin: 0 auto; padding: 8px var(--gutter-r) 8px var(--gutter); min-height: 56px;
}
.hud-marque { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hud .tool--back { font-size: var(--fs-s); padding: 6px 0; }
.hud-nom { display: grid; line-height: 1.15; min-width: 0; }
.hud-titre { font-family: var(--font-titre); font-weight: 700; font-size: var(--fs-l); letter-spacing: .01em; white-space: nowrap; }
.hud-phase { font-family: var(--font-mono); font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hud[data-phase="execution"] .hud-phase { color: var(--ok); }
.hud[data-phase="execution"] .hud-phase::before { content: "● "; }
.hud[data-phase="comite"] .hud-phase { color: var(--accent); }

.hud-temps { display: grid; gap: 4px; min-width: 132px; }
.hud-quand { display: flex; align-items: baseline; gap: 8px; }
.hud-tri { font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 0 6px; border-radius: 3px; font-size: var(--fs-s); }
.hud-sem { font-weight: 600; font-size: var(--fs-s); white-space: nowrap; }
.annee { position: relative; display: block; height: 5px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.annee-rempli { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--soleil), var(--accent)); border-radius: 3px; transition: width .5s ease; }
.annee i { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--surface); }

.hud-stats { display: flex; gap: 6px; align-items: stretch; }
.hud-stat { display: grid; padding: 3px 10px; border-left: 1px solid var(--line); min-width: 0; position: relative; }
.hud-stat:first-child { border-left: 0; }
.hud-stat-lib { font-size: .6875rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.hud-stat-val { font-size: var(--fs-m); font-weight: 600; white-space: nowrap; }
.hud-stat[data-ton="warn"] .hud-stat-val { color: var(--warn); }
.hud-stat[data-ton="crit"] .hud-stat-val { color: var(--crit); }
.hud-stat[data-ton="warn"] .hud-stat-val::after, .hud-stat[data-ton="crit"] .hud-stat-val::after { content: " !"; }
.conf-metre { display: block; height: 3px; border-radius: 2px; background: var(--surface-2); margin-top: 2px; overflow: hidden; }
.conf-metre i { display: block; height: 100%; background: var(--fg); opacity: .7; border-radius: 2px; transition: width .4s ease; }
.hud-stat[data-ton="warn"] .conf-metre i { background: var(--warn); opacity: 1; }
.hud-stat[data-ton="crit"] .conf-metre i { background: var(--crit); opacity: 1; }

.hud-commandes { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.btn--lecture { min-width: 104px; }
.btn--lecture.btn--grand { font-family: var(--font-titre); letter-spacing: .02em; animation: appel 2.4s ease-in-out infinite; }
@keyframes appel { 0%, 100% { box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 6px 16px -8px var(--accent); } 50% { box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 0 0 5px var(--accent-soft), 0 6px 20px -6px var(--accent); } }
.vitesses { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); padding: 2px; gap: 2px; background: var(--surface-2); }
.vitesse { min-width: 38px; min-height: 34px; border: 0; border-radius: 3px; background: transparent; font-family: var(--font-mono); font-size: var(--fs-s); font-weight: 600; cursor: pointer; }
.vitesse:hover:not([disabled]) { background: var(--paper); }
.vitesse.is-actif { background: var(--fg); color: var(--bg); }
.vitesse.is-actif.is-pause { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
.vitesse[disabled] { opacity: .45; cursor: not-allowed; }
.btn--semaine { font-size: var(--fs-s); }
.hud-attente { font-size: var(--fs-xs); font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.hud-attente::before { content: "● "; }
.hud-outils { display: flex; align-items: center; gap: 2px; }
.hud-commandes[hidden] + .hud-outils { margin-left: auto; }
.ibtn--anim { color: var(--accent); }

/* Tiroir du mode animateur */
.tiroir {
  position: fixed; z-index: 45; right: var(--gutter-r); top: calc(var(--hud-h) + 8px); width: min(360px, calc(100vw - 32px));
  background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r-l); box-shadow: var(--shadow-haute);
  padding: 14px 16px 16px; display: grid; gap: 12px; animation: glisse .2s ease both;
}
@keyframes glisse { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
.tiroir-tete { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line-strong); padding-bottom: 8px; }
.tiroir-tete h2 { font-size: var(--fs-m); text-transform: uppercase; letter-spacing: .08em; }
.tiroir-ligne { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-s); }
.tiroir-ligne label { font-weight: 600; min-width: 52px; }
.tiroir-ligne input { width: 7.5em; min-height: 34px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
.tiroir-ligne input[type="number"] { width: 4.5em; }

/* ---------- Accueil ---------- */
.accueil { max-width: 1180px; margin: 0 auto; padding: 24px var(--gutter-r) 64px var(--gutter); display: grid; gap: 40px; }
.accueil-hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; padding: 20px 0 32px; border-bottom: 2px solid var(--fg); }
.accueil-texte { display: grid; gap: 18px; min-width: 0; }
.titre-jeu { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -.015em; line-height: 1; }
.lede { font-size: var(--fs-l); max-width: 60ch; }
.univers { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); max-width: 600px; font-size: var(--fs-s); }
.gpu-badge { font-weight: 600; padding: 6px 8px; background: var(--fg); color: var(--bg); border-radius: 2px; font-size: var(--fs-s); }
.accueil .case { max-width: 600px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .btn small { display: block; }
#btn-reprendre { flex-direction: column; gap: 0; }
.accueil-pied { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: var(--fs-s); }
.confirmer { color: var(--crit); display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.accueil-illu { min-width: 0; }
.accueil-art { width: 100%; max-width: 440px; height: auto; display: block; margin-left: auto; filter: drop-shadow(0 18px 30px rgba(80, 40, 10, .18)); }
.art-cadre { fill: var(--paper); stroke: var(--line-strong); stroke-width: 2; }
.art-soleil { fill: var(--soleil); opacity: .9; }
.art-ville { fill: var(--ville); opacity: .55; }
.art-store { fill: var(--paper); opacity: .38; }
.art-meneau { stroke: var(--paper); stroke-width: 5; }
.art-bureau { fill: var(--line-strong); }
.art-ecran { fill: var(--fg); }
.art-ecran-vitre { fill: #1d2430; }
.art-code { fill: #8794a8; }
.art-code--accent { fill: #93a6ff; }
.art-pied { fill: var(--fg); }
.art-postit { fill: var(--postit); stroke: var(--postit-line); }
.art-postit-ecrit { stroke: var(--postit-fg); stroke-width: 1.6; stroke-linecap: round; opacity: .55; }
.art-tasse { fill: var(--accent); }
.art-anse { fill: none; stroke: var(--accent); stroke-width: 3; }
.art-vapeur { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; opacity: .5; animation: vapeur 3s ease-in-out infinite; }
@keyframes vapeur { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-3px); opacity: .2; } }
.art-papier { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1; }

.trims { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.trim-carte { display: grid; gap: 4px; padding: 14px 14px 16px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 2px; position: relative; }
.trim-carte b { font-family: var(--font-titre); font-size: var(--fs-l); }
.trim-carte span:last-child { color: var(--muted); font-size: var(--fs-s); }
.trim-num { color: var(--accent); font-weight: 600; font-size: var(--fs-s); }
.trims li:nth-child(2) { transform: rotate(.4deg); }
.trims li:nth-child(3) { transform: rotate(-.3deg); }

.equipe { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.equipe-ilot { display: grid; gap: 4px; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-top: 4px solid hsl(var(--teinte, 30) 45% 55%); min-width: 0; }
.equipe-visages { display: flex; margin-bottom: 4px; }
.equipe-visages > span + span { margin-left: -8px; }
.equipe-ilot b { font-family: var(--font-titre); }
.equipe-noms { font-size: var(--fs-xs); color: var(--muted); }

/* ---------- Journal ---------- */
.journal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 14px 8px; display: grid; gap: 8px; }
.journal-liste { list-style: none; display: grid; max-height: 340px; overflow-y: auto; overscroll-behavior: contain; }
.entree { display: grid; grid-template-columns: 22px 32px minmax(0, 1fr); gap: 6px; align-items: start; padding: 6px 4px; border-top: 1px dotted var(--line); font-size: var(--fs-s); }
.entree:first-child { border-top: 0; }
.entree-icone { color: var(--muted); padding-top: 1px; }
.entree-sem { color: var(--muted); font-size: var(--fs-xs); padding-top: 2px; }
.entree-texte { min-width: 0; overflow-wrap: anywhere; }
.entree.is-semaine { background: linear-gradient(90deg, var(--accent-soft), transparent 80%); border-radius: 3px; }
.entree.is-semaine .entree-sem { color: var(--accent); font-weight: 600; }
.entree--incident .entree-icone { color: var(--crit); }
.entree--alerte .entree-icone { color: var(--warn); }
.entree--evenement .entree-icone, .entree--comite .entree-icone { color: var(--accent); }
.entree--personne .entree-icone { color: var(--ok); }
.entree--vide { grid-template-columns: 1fr; color: var(--muted); font-style: italic; }

/* 30-open-space.css */
/* L'open space : moquette en tuiles, lumière rasante de fin d'après-midi, îlots de bureaux vus de haut.
   Propriétaire : agent E. Variables préfixées --os-, dérivées des jetons de base (00-jetons.css) avec replis.
   Au téléphone (< 700 px), la grille devient une liste d'îlots repliables. */

:root {
  --os-texte: var(--fg, #1f1a14);
  --os-attenue: var(--muted, #6b6155);
  --os-ligne: var(--line, #d8cdbb);
  --os-surface: var(--surface, #fffaf1);
  --os-moquette: color-mix(in oklab, var(--bg, #f4efe6) 40%, #a58f72);
  --os-fibre: rgba(70, 45, 20, 0.07);
  --os-tuile: rgba(70, 45, 20, 0.055);
  --os-soleil: rgba(255, 205, 130, 0.34);
  --os-soleil-faible: rgba(255, 205, 130, 0.16);
  --os-ombre-fenetre: rgba(60, 35, 10, 0.1);
  --os-vitre: #f7ecd2;
  --os-meneau: #8f7b60;
  --os-bois: #ecdab8;
  --os-bois-survol: #f4e6c9;
  --os-bois-bord: #c6a97d;
  --os-cloison: #7d8b93;
  --os-ecran-cadre: #24211e;
  --os-ecran-off: #3d3a36;
  --os-ecran-on: #1b2838;
  --os-ecran-alerte: #5a1712;
  --os-lueur: #8fd6ff;
  --os-code-1: #7ee0a1;
  --os-code-2: #ffd27a;
  --os-code-3: #8fc3ff;
  --os-alerte: #ff5a3c;
  --os-clavier: #f3efe7;
  --os-touches: #bdb3a2;
  --os-chaise: #403a35;
  --os-chaise-dos: #2c2825;
  --os-papier: #fffdf7;
  --os-papier-ombre: #c4b597;
  --os-postit: #ffe169;
  --os-postit-l: 78%;
  --os-brouillard: #a3a9b1;
  --os-sueur: #5fb4ec;
  --os-zzz: #3f4f6b;
  --os-nom: var(--fg, #1f1a14);
  --os-plaque: #221d18;
  --os-voyant-off: #4a433b;
  --os-voyant-ico-off: #8d8273;
  --os-bulle-bg: var(--surface, #fffaf1);
  --os-cafe-sol: #e7e1d3;
  --os-cafe-carreau: rgba(80, 60, 30, 0.07);
  --os-ilot-fond: 0.13;
  --os-crit: var(--crit, #c0261c);
  --os-accent: var(--accent, #c2410c);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --os-moquette: color-mix(in oklab, var(--bg, #17140f) 70%, #5b4b3a);
    --os-fibre: rgba(255, 240, 220, 0.035);
    --os-tuile: rgba(255, 240, 220, 0.03);
    --os-soleil: rgba(255, 150, 70, 0.085);
    --os-soleil-faible: rgba(255, 150, 70, 0.04);
    --os-ombre-fenetre: rgba(0, 0, 0, 0.25);
    --os-vitre: #31394a;
    --os-meneau: #18140f;
    --os-bois: #6e5c46;
    --os-bois-survol: #7c6850;
    --os-bois-bord: #4b3d2e;
    --os-cloison: #3b444b;
    --os-ecran-off: #2b2926;
    --os-ecran-on: #172537;
    --os-lueur: #6ccaff;
    --os-clavier: #b9b1a3;
    --os-touches: #857c6e;
    --os-chaise: #1e1a17;
    --os-chaise-dos: #141110;
    --os-papier: #ece6d8;
    --os-papier-ombre: #8f826a;
    --os-postit-l: 64%;
    --os-brouillard: #7b828b;
    --os-zzz: #b9c7e6;
    --os-plaque: #0f0d0b;
    --os-voyant-off: #3a342d;
    --os-voyant-ico-off: #6f665a;
    --os-cafe-sol: #2f2b25;
    --os-cafe-carreau: rgba(255, 255, 255, 0.035);
    --os-ilot-fond: 0.16;
  }
}
:root[data-theme="dark"] {
  --os-moquette: color-mix(in oklab, var(--bg, #17140f) 70%, #5b4b3a);
  --os-fibre: rgba(255, 240, 220, 0.035);
  --os-tuile: rgba(255, 240, 220, 0.03);
  --os-soleil: rgba(255, 150, 70, 0.085);
  --os-soleil-faible: rgba(255, 150, 70, 0.04);
  --os-ombre-fenetre: rgba(0, 0, 0, 0.25);
  --os-vitre: #31394a;
  --os-meneau: #18140f;
  --os-bois: #6e5c46;
  --os-bois-survol: #7c6850;
  --os-bois-bord: #4b3d2e;
  --os-cloison: #3b444b;
  --os-ecran-off: #2b2926;
  --os-ecran-on: #172537;
  --os-lueur: #6ccaff;
  --os-clavier: #b9b1a3;
  --os-touches: #857c6e;
  --os-chaise: #1e1a17;
  --os-chaise-dos: #141110;
  --os-papier: #ece6d8;
  --os-papier-ombre: #8f826a;
  --os-postit-l: 64%;
  --os-brouillard: #7b828b;
  --os-zzz: #b9c7e6;
  --os-plaque: #0f0d0b;
  --os-voyant-off: #3a342d;
  --os-voyant-ico-off: #6f665a;
  --os-cafe-sol: #2f2b25;
  --os-cafe-carreau: rgba(255, 255, 255, 0.035);
  --os-ilot-fond: 0.16;
}

/* ---------- Cadre de la région ---------- */
.os {
  container: os / inline-size;
  position: relative;
  overflow-x: clip;
  color: var(--os-texte);
  font-family: var(--font-texte, system-ui, sans-serif);
}
.os-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.os-entete {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  padding: 0 2px 8px;
}
.os-titre {
  margin: 0;
  font: 700 0.95rem/1.2 var(--font-titre, system-ui, sans-serif);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.os-sommaire {
  margin: 0;
  font: 12px/1.3 var(--font-mono, ui-monospace, monospace);
  font-variant-numeric: tabular-nums;
  color: var(--os-attenue);
}
.os-tout-replier { display: none; }
.os-legende { margin-left: auto; position: relative; font-size: 12px; }
.os-legende > summary {
  cursor: pointer; color: var(--os-attenue); padding: 2px 4px; border-radius: 6px;
  list-style: none; user-select: none;
}
.os-legende > summary::-webkit-details-marker { display: none; }
.os-legende > summary::before { content: "?"; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-right: 5px;
  border-radius: 50%; border: 1px solid currentColor; font: 700 10px/1 var(--font-mono, monospace); }
.os-legende > summary:hover { color: var(--os-texte); }
.os-legende > summary:focus-visible { outline: 2px solid var(--os-accent); outline-offset: 1px; }
.os-legende ul {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 9;
  width: min(360px, calc(100vw - 32px)); margin: 0; padding: 10px 12px;
  list-style: none; display: grid; gap: 6px;
  background: var(--os-surface); color: var(--os-texte);
  border: 1px solid var(--os-ligne); border-radius: 10px;
  box-shadow: 0 14px 30px -12px rgba(30, 18, 6, 0.45);
  line-height: 1.35;
}
.os-legende li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; }
.os-leg-ico { width: 22px; height: 16px; border-radius: 3px; display: block; }
.os-leg-ico--ecrans { background: linear-gradient(90deg, #1b2838 0 30%, transparent 30% 35%, #1b2838 35% 65%, transparent 65% 70%, #1b2838 70%); box-shadow: 0 0 6px var(--os-lueur); }
.os-leg-ico--pile { background: repeating-linear-gradient(180deg, var(--os-papier) 0 3px, var(--os-papier-ombre) 3px 4px); }
.os-leg-ico--brouillard { background: radial-gradient(circle, var(--os-brouillard), transparent 70%); }
.os-leg-ico--flamme { background: radial-gradient(circle at 50% 70%, #ffd84a 0 25%, #ff7a1a 26% 50%, transparent 52%); }
.os-leg-ico--sueur { background: radial-gradient(circle at 50% 62%, var(--os-sueur) 0 30%, transparent 32%); }
.os-leg-ico--valise { background: linear-gradient(#b0562e, #8a3f1f); border-radius: 4px; transform: scale(0.75); }
.os-leg-ico--compteur { background: var(--os-plaque); box-shadow: inset 6px 0 0 -2px #ffb347; }
.os-leg-ico--triade { background: radial-gradient(circle at 20% 50%, #f5a524 0 3px, transparent 4px), radial-gradient(circle at 50% 50%, #f5a524 0 3px, transparent 4px), radial-gradient(circle at 80% 50%, var(--os-voyant-off) 0 3px, transparent 4px), var(--os-plaque); border-radius: 8px; }
.os-leg-ico--losange { background: hsl(32 70% 45%); clip-path: polygon(50% 0, 80% 50%, 50% 100%, 20% 50%); }

/* ---------- Le plancher : moquette en tuiles, fenêtres, lumière rasante ---------- */
.os-plancher {
  position: relative;
  display: grid; gap: 16px 12px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 26px 14px 14px;
  border-radius: 14px;
  background-color: var(--os-moquette);
  background-image:
    radial-gradient(var(--os-fibre) 0.7px, transparent 1.1px),
    conic-gradient(var(--os-tuile) 0 25%, transparent 0 50%, var(--os-tuile) 0 75%, transparent 0);
  background-size: 4px 4px, 112px 112px;
  box-shadow: inset 0 0 0 1px var(--os-ombre-fenetre), inset 0 26px 30px -26px var(--os-ombre-fenetre);
}
/* Rangée de fenêtres au nord de l'étage */
.os-plancher::after {
  content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 9px;
  border-radius: 0 0 4px 4px;
  background: repeating-linear-gradient(90deg, var(--os-vitre) 0 84px, var(--os-meneau) 84px 88px);
  box-shadow: 0 1px 0 var(--os-meneau), 0 6px 14px -4px var(--os-soleil);
  pointer-events: none;
}
/* Lumière de fin d'après-midi qui passe par les stores, en biais depuis l'ouest */
.os-plancher::before {
  content: ""; position: absolute; inset: 0; z-index: 1;
  border-radius: inherit; pointer-events: none;
  background: repeating-linear-gradient(118deg,
    transparent 0 40px, var(--os-soleil) 40px 118px, transparent 118px 142px,
    var(--os-soleil-faible) 142px 158px, transparent 158px 236px);
  -webkit-mask-image: linear-gradient(102deg, #000 0%, rgba(0, 0, 0, 0.55) 40%, transparent 82%);
  mask-image: linear-gradient(102deg, #000 0%, rgba(0, 0, 0, 0.55) 40%, transparent 82%);
  mix-blend-mode: soft-light;
}
@container os (min-width: 560px) {
  .os-plancher { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .os-cafe { grid-column: span 2; }
}
@container os (min-width: 800px) {
  .os-plancher { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 14px; }
  .os-cafe { grid-column: span 1; }
}

/* ---------- Îlot ---------- */
.os-ilot {
  position: relative;
  align-self: start;
  border-radius: 12px;
  padding: 6px 6px 4px;
  background: hsl(var(--os-teinte, 30) 40% 50% / var(--os-ilot-fond));
  box-shadow: 0 0 0 1px hsl(var(--os-teinte, 30) 35% 40% / 0.2);
  transition: box-shadow 0.3s ease;
}
.os-ilot--choisi {
  box-shadow: 0 0 0 2px hsl(var(--os-teinte, 30) 65% 42%), 0 0 0 7px hsl(var(--os-teinte, 30) 65% 50% / 0.22);
}
.os-ilot--triade {
  outline: 2px dashed var(--os-crit); outline-offset: 3px;
  animation: os-alarme-contour 1.4s ease-in-out infinite alternate;
}
.os-ilot-tete { display: flex; gap: 6px; align-items: stretch; margin-bottom: 4px; }

.os-etiquette {
  appearance: none; -webkit-appearance: none;
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 5px;
  margin: 0; padding: 3px 3px 4px; border: 0; border-radius: 8px;
  background: transparent; color: inherit; font: inherit; text-align: left;
  cursor: pointer;
}
.os-etiquette:hover { background: hsl(var(--os-teinte, 30) 50% 50% / 0.1); }
.os-etiquette:focus-visible { outline: 2px solid var(--os-accent); outline-offset: 1px; }
.os-etiquette-haut, .os-etiquette-bas { display: flex; align-items: center; gap: 6px; min-width: 0; }
.os-etiquette-haut { justify-content: space-between; }
.os-etiquette-bas { flex-wrap: wrap; }

.os-postit {
  display: inline-block; min-width: 0; max-width: 100%;
  padding: 4px 9px 5px;
  background: hsl(var(--os-teinte, 30) 85% var(--os-postit-l));
  color: hsl(var(--os-teinte, 30) 70% 14%);
  border-bottom-right-radius: 12px 5px;
  box-shadow: 0 2px 3px rgba(40, 25, 10, 0.28), inset 0 -7px 9px -7px rgba(0, 0, 0, 0.16);
  transform: rotate(-2.2deg);
  transition: transform 0.2s ease;
}
.os-ilot:nth-child(even) .os-postit { transform: rotate(1.6deg); }
.os-etiquette:hover .os-postit { transform: rotate(-0.6deg) translateY(-1px); }
.os-postit-nom {
  display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 700 11.5px/1.1 var(--font-titre, system-ui, sans-serif);
  letter-spacing: 0.045em; text-transform: uppercase;
}

.os-triade {
  flex: none; display: inline-flex; gap: 3px; padding: 2px 3px;
  border-radius: 999px; background: var(--os-plaque);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.15);
}
.os-voyant {
  --os-creux: var(--os-voyant-off);
  width: 17px; height: 17px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--os-voyant-off); color: var(--os-voyant-ico-off);
  transition: background 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
}
.os-voyant.allume {
  --os-creux: #f5a524;
  background: radial-gradient(circle at 35% 30%, #ffe6a8, #f5a524 58%, #b56800);
  color: #3a2000;
  box-shadow: 0 0 7px 1px rgba(255, 170, 40, 0.7);
}
.os-ilot--triade .os-voyant.allume {
  --os-creux: #f0483a;
  background: radial-gradient(circle at 35% 30%, #ffc6ba, #f0483a 58%, #9c1d12);
  color: #2e0400;
  box-shadow: 0 0 9px 2px rgba(240, 72, 58, 0.8);
  animation: os-alarme 1.1s ease-in-out infinite alternate;
}
.os-ico { width: 10px; height: 10px; display: block; fill: currentColor; stroke: currentColor; stroke-width: 0; }
.os-ico .creux { fill: var(--os-creux); }

.os-compteur {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 6px; border-radius: 4px;
  background: var(--os-plaque);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.15);
  font: 500 11px/1 var(--font-mono, ui-monospace, monospace);
  font-variant-numeric: tabular-nums;
}
.os-compteur-val { color: #ffc66b; text-shadow: 0 0 6px rgba(255, 170, 60, 0.55); min-width: 3.6em; text-align: right; white-space: nowrap; }
.os-compteur-u { color: #b9a98f; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
.os-compteur-barre { width: 26px; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.13); }
.os-compteur-remplie { display: block; height: 100%; width: calc(var(--os-part, 0) * 100%); background: #ffb347; transition: width 0.7s ease; }

.os-badges { display: inline-flex; gap: 4px; }
.os-badge {
  display: none; align-items: center; gap: 3px;
  padding: 2px 6px 2px 4px; border-radius: 999px;
  background: var(--os-surface); color: var(--os-texte);
  box-shadow: 0 0 0 1px var(--os-ligne);
  font: 600 11px/1 var(--font-mono, ui-monospace, monospace);
}
.os-badge.on { display: inline-flex; }
.os-badge--surcharge .os-ico { color: hsl(var(--os-teinte, 30) 70% 40%); }
.os-badge--inc { color: var(--os-crit); }
.os-resume { display: none; }
.os-replier { display: none; }

/* ---------- Bureaux ---------- */
.os-bureaux { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.os-bureau {
  appearance: none; -webkit-appearance: none;
  position: relative;
  display: flex; flex-direction: column; align-items: stretch;
  margin: 0; padding: 0; border: 0; border-radius: 6px;
  background: transparent; color: inherit; font: inherit;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.os-bureau:focus-visible { outline: 2px solid var(--os-accent); outline-offset: 1px; }
.os-scene-cadre { display: block; }
.os-scene { display: block; width: 100%; height: auto; overflow: visible; }
.os-plaque { display: block; padding: 1px 2px 2px; text-align: center; }
.os-nom {
  display: inline-block;
  margin: 0 -8px; padding: 1px 5px; border-radius: 999px;
  white-space: nowrap; vertical-align: top;
  font: 600 10.5px/1.3 var(--font-texte, system-ui, sans-serif); letter-spacing: -0.01em;
  color: var(--os-nom);
  transition: background 0.2s ease, color 0.2s ease;
}
.os-etat-texte { display: none; }
.os-bureau:hover .os-nom { background: hsl(var(--os-teinte, 30) 50% 50% / 0.18); }
.os-b--choisi .os-nom, .os-b--choisi:hover .os-nom { background: hsl(var(--os-teinte, 30) 65% 38%); color: #fff; }
.os-b--vide .os-nom { opacity: 0.7; font-style: italic; }

/* Bulle de pensée */
.os-bulle {
  position: absolute; z-index: 6;
  bottom: 40%;
  width: max-content; max-width: min(156px, 230%);
  padding: 6px 10px 7px;
  border-radius: 14px;
  background: var(--os-bulle-bg); color: var(--os-texte);
  box-shadow: 0 8px 18px -8px rgba(40, 25, 10, 0.55), 0 0 0 1px var(--os-ligne);
  font: 12px/1.32 var(--font-texte, system-ui, sans-serif);
  text-align: left; white-space: normal;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.os-bulle::before, .os-bulle::after {
  content: ""; position: absolute; border-radius: 50%;
  background: var(--os-bulle-bg); box-shadow: 0 0 0 1px var(--os-ligne);
}
.os-bulle::after { width: 9px; height: 9px; bottom: -12px; }
.os-bulle::before { width: 5px; height: 5px; bottom: -19px; }
.os-bureau--0 .os-bulle { left: -2px; transform: translateY(6px) scale(0.96); transform-origin: 20% 100%; }
.os-bureau--0 .os-bulle::after { left: 22px; } .os-bureau--0 .os-bulle::before { left: 30px; }
.os-bureau--1 .os-bulle { left: 50%; transform: translate(-50%, 6px) scale(0.96); transform-origin: 50% 100%; }
.os-bureau--1 .os-bulle::after { left: calc(50% - 4px); } .os-bureau--1 .os-bulle::before { left: calc(50% + 4px); }
.os-bureau--2 .os-bulle { right: -2px; transform: translateY(6px) scale(0.96); transform-origin: 80% 100%; }
.os-bureau--2 .os-bulle::after { right: 22px; } .os-bureau--2 .os-bulle::before { right: 30px; }
.os-bulle--vue,
.os-bureau:hover .os-bulle:not(.os-bulle--vide),
.os-bureau:focus-visible .os-bulle:not(.os-bulle--vide) { opacity: 1; }
.os-bureau--0 .os-bulle--vue, .os-bureau--0:hover .os-bulle, .os-bureau--0:focus-visible .os-bulle,
.os-bureau--2 .os-bulle--vue, .os-bureau--2:hover .os-bulle, .os-bureau--2:focus-visible .os-bulle { transform: none; }
.os-bureau--1 .os-bulle--vue, .os-bureau--1:hover .os-bulle, .os-bureau--1:focus-visible .os-bulle { transform: translate(-50%, 0); }
.os-bureau:hover .os-bulle, .os-bureau:focus-visible .os-bulle { z-index: 7; animation: none; }
.os-bulle--a { animation: os-bulle-a 6s ease forwards; }
.os-bulle--b { animation: os-bulle-b 6s ease forwards; }

/* ---------- Scène SVG d'un bureau ---------- */
.os-scene .s-cloison { fill: var(--os-cloison); }
.os-scene .s-bureau { fill: var(--os-bois); transition: fill 0.2s ease; }
.os-bureau:hover .s-bureau { fill: var(--os-bois-survol); }
.os-scene .s-bureau-bord { fill: var(--os-bois-bord); }
.os-scene .s-joint { stroke: var(--os-bois-bord); stroke-width: 0.8; }
.os-bureau--0 .s-joint { display: none; }

.s-alerte { opacity: 0; transition: opacity 0.4s ease; }
.os-b--incident .s-alerte { opacity: 1; animation: os-pulsation 1.4s ease-in-out infinite alternate; }
.os-bureau:not(.os-b--actif) .s-flaque { visibility: hidden; }
.os-b--epuise .s-flaque { visibility: hidden; }

.s-ecran, .s-ecran-lueur { opacity: 0; transition: opacity 0.35s ease, transform 0.45s ease; }
.s-ecran.on { opacity: 1; }
.os-b--actif .s-ecran-lueur.on { opacity: 0.55; animation: os-lueur 2.8s ease-in-out infinite alternate; }
.os-b--epuise .s-ecran-lueur.on { opacity: 0.25; animation: none; }
.s-cadre, .s-pied { fill: var(--os-ecran-cadre); }
.s-dalle { fill: var(--os-ecran-off); transition: fill 0.4s ease; }
.os-b--actif .s-dalle { fill: var(--os-ecran-on); }
.os-b--incident .s-dalle { fill: var(--os-ecran-alerte); animation: os-clignote 1.2s steps(2, jump-none) infinite; }
.s-code { opacity: 0; transition: opacity 0.3s ease; }
.os-b--actif .s-code { opacity: 0.95; }
.s-code--1 { fill: var(--os-code-1); } .s-code--2 { fill: var(--os-code-2); } .s-code--3 { fill: var(--os-code-3); }
.os-b--incident .s-code { fill: #ff9d8a; }
.s-frappe { transform-box: fill-box; transform-origin: 0 50%; }
.os-b--actif .s-ecran.on .s-frappe { animation: os-frappe 1.9s steps(7, end) infinite; }
.os-b--epuise .s-frappe { animation: none !important; }

.s-clavier { fill: var(--os-clavier); }
.s-touches { fill: none; stroke: var(--os-touches); stroke-width: 1; stroke-dasharray: 1.4 0.8; }
.s-souris { fill: var(--os-clavier); }
.os-scene .s-postit-cloison { opacity: 0.95; }

.s-feuille {
  fill: var(--os-papier); stroke: var(--os-papier-ombre); stroke-width: 0.6;
  transform-box: fill-box; transform-origin: center;
  opacity: 0; transition: opacity 0.35s ease;
}
.s-feuille.on { opacity: 1; }
.s-pile-badge { display: none; }
.os-b--pile .s-pile-badge { display: inline; }
.s-pile-postit { fill: var(--os-postit); }
.s-pile-n { font: 700 6.6px var(--font-mono, ui-monospace, monospace); fill: #4a3a00; text-anchor: middle; dominant-baseline: middle; }

.s-livre, .s-boite, .s-flamme, .s-valise, .s-sueur, .s-zzz, .s-bras-plies { display: none; }
.os-b--formation .s-livre { display: inline; }
.os-b--absent .s-boite { display: inline; }
.os-b--incident .s-flamme { display: inline; }
.os-b--conge .s-valise { display: inline; }
.os-b--sueur .s-sueur { display: inline; }
.os-b--epuise .s-zzz, .os-b--epuise .s-bras-plies { display: inline; }
.os-b--epuise .s-bras { display: none; }
.os-b--absent .s-accessoire { opacity: 0.35; }

.s-livre-couv { fill: #7a3b2e; } .s-livre-page { fill: #fbf6ea; } .s-livre-lignes { stroke: #b9ad94; stroke-width: 0.7; fill: none; }
.s-boite-corps { fill: #c8995f; } .s-boite-rabat { stroke: #8a6334; stroke-width: 0.8; fill: none; }
.s-boite-ruban { fill: #e6d3a6; opacity: 0.8; } .s-postit-boite { fill: var(--os-postit); }
.s-valise-corps { fill: #b0562e; } .s-valise-poignee { fill: #3b2a20; }
.s-valise-sangle { stroke: #6e2f15; stroke-width: 1.4; fill: none; } .s-valise-autocollant { fill: #f3d36b; }
.s-flamme-ext { fill: #ff7a1a; } .s-flamme-int { fill: #ffd84a; }
.s-flamme-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: os-flamme 0.45s ease-in-out infinite alternate; }
.s-sueur { fill: var(--os-sueur); animation: os-sueur 2.2s ease-in infinite; }
.s-z { font: 700 8px var(--font-mono, ui-monospace, monospace); fill: var(--os-zzz); }
.s-z2 { font-size: 10px; } .s-z3 { font-size: 12px; }
.s-zzz text { animation: os-zzz 2.6s ease-in-out infinite; }
.s-zzz .s-z2 { animation-delay: -0.9s; } .s-zzz .s-z3 { animation-delay: -1.8s; }

.s-personne { transition: transform 0.6s ease, opacity 0.4s ease; }
.os-b--epuise .s-personne { transform: translateY(-8px); }
.os-b--epuise .s-corps .av-tete { transform-box: fill-box; transform-origin: 50% 90%; transform: rotate(-16deg); }
.os-b--vide .s-personne { opacity: 0; }
.s-chaise { fill: var(--os-chaise); transform-box: view-box; transform-origin: 40px 99px; transition: transform 0.6s ease; }
.s-chaise-dossier { fill: var(--os-chaise-dos); }
.os-b--vide .s-chaise { transform: translate(4px, 9px) rotate(10deg); }

.s-brouillard { pointer-events: none; transition: opacity 0.8s ease; }
.os-stop-brouillard { stop-color: var(--os-brouillard); }
.os-stop-lueur { stop-color: var(--os-lueur); }
.os-stop-alerte { stop-color: var(--os-alerte); }
.s-nappe1 { animation: os-derive 9s ease-in-out infinite alternate; }
.s-nappe2 { animation: os-derive 12s ease-in-out infinite alternate-reverse; }
.os-b--flou-inconnu .s-nappe { animation: none; }

.acc-clignote { animation: os-clignote 1.1s steps(2, jump-none) infinite; }
.acc-vapeur { animation: os-vapeur 3s ease-in-out infinite; }

/* Rebond quand l'état d'une personne change d'une semaine à l'autre */
.os-b--change-a .os-scene-cadre { animation: os-rebond-a 0.7s ease; }
.os-b--change-b .os-scene-cadre { animation: os-rebond-b 0.7s ease; }

/* ---------- Coin café (hors zone TI) ---------- */
.os-cafe {
  position: relative; min-height: 150px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
  padding: 8px;
  border-radius: 12px;
  background-color: var(--os-cafe-sol);
  background-image: conic-gradient(var(--os-cafe-carreau) 0 25%, transparent 0 50%, var(--os-cafe-carreau) 0 75%, transparent 0);
  background-size: 22px 22px;
  box-shadow: 0 0 0 1px var(--os-ombre-fenetre);
}
.os-cafe-scene { width: 100%; height: auto; max-height: 176px; display: block; margin: auto; }
.os-cafe-titre {
  position: absolute; top: 8px; left: 10px;
  padding: 2px 7px; background: hsl(48 90% var(--os-postit-l)); color: #3d3000;
  font: 700 10.5px/1.3 var(--font-titre, system-ui, sans-serif); letter-spacing: 0.07em; text-transform: uppercase;
  transform: rotate(-3deg); box-shadow: 0 2px 3px rgba(40, 25, 10, 0.25);
}
.os-cafe-legende { font: 600 11px/1.2 var(--font-mono, ui-monospace, monospace); color: var(--os-crit); text-align: right; min-height: 1.2em; }
.c-comptoir { fill: var(--os-bois); stroke: var(--os-bois-bord); stroke-width: 1; }
.c-machine { fill: #2d2a28; } .c-machine-voyant { fill: #ff5a3c; } .c-tasse { fill: #f3efe8; }
.c-boite-dons { fill: #c8995f; }
.c-micro { fill: #d8d3ca; } .c-micro-vitre { fill: #3a3734; }
.c-frigo { fill: #eeeae3; stroke: #b9b2a5; stroke-width: 1; }
.c-postit { fill: #ffe169; } .c-postit--2 { fill: #ffa7c4; }
.c-fontaine { fill: #dfe7ec; stroke: #9fb0bb; stroke-width: 1; } .c-fontaine-eau { fill: #8fcdf0; }
.c-pot { fill: #b5643a; } .c-feuille { fill: #4f8a3c; } .c-feuille--2 { fill: #3f7a33; }
.c-chaise { fill: var(--os-chaise); }
.c-table { fill: var(--os-bois); stroke: var(--os-bois-bord); stroke-width: 1.2; }
.c-fantome { opacity: 0; transition: opacity 0.5s ease; }
.c-fantome.on { opacity: 1; }
.c-fantome-base { fill: #b9bdc1; } .c-fantome-ecran { fill: #ff8fb8; } .c-fantome-autocollant { fill: #9be15d; }

/* ---------- Animations ---------- */
@keyframes os-bulle-a { 0% { opacity: 0; } 6%, 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes os-bulle-b { 0% { opacity: 0; } 6%, 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes os-frappe { 0% { transform: scaleX(0.08); } 85%, 100% { transform: scaleX(1); } }
@keyframes os-lueur { from { opacity: 0.32; } to { opacity: 0.7; } }
@keyframes os-clignote { from { opacity: 1; } to { opacity: 0.55; } }
@keyframes os-pulsation { from { opacity: 0.55; } to { opacity: 1; } }
@keyframes os-flamme { from { transform: scale(0.94, 0.9) skewX(-3deg); } to { transform: scale(1.04, 1.08) skewX(3deg); } }
@keyframes os-sueur { 0% { transform: translate(55px, 74px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(56px, 86px); opacity: 0; } }
@keyframes os-zzz { 0%, 100% { opacity: 0.25; transform: translateY(1px); } 50% { opacity: 1; transform: translateY(-2px); } }
@keyframes os-derive { from { transform: translate(-3px, 1px); } to { transform: translate(4px, -2px); } }
@keyframes os-vapeur { 0% { opacity: 0; transform: translateY(2px); } 40% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-3px); } }
@keyframes os-alarme { from { filter: brightness(0.85); } to { filter: brightness(1.25); } }
@keyframes os-alarme-contour { from { outline-color: color-mix(in oklab, var(--os-crit) 40%, transparent); } to { outline-color: var(--os-crit); } }
@keyframes os-rebond-a { 0% { transform: translateY(0); } 35% { transform: translateY(-4px); } 70% { transform: translateY(1px); } 100% { transform: translateY(0); } }
@keyframes os-rebond-b { 0% { transform: translateY(0); } 35% { transform: translateY(-4px); } 70% { transform: translateY(1px); } 100% { transform: translateY(0); } }

/* ---------- Téléphone : liste d'îlots repliables ---------- */
@media (max-width: 699px) {
  .os-entete { align-items: center; }
  .os-sommaire { order: 3; flex-basis: 100%; }
  .os-tout-replier {
    display: inline-flex; align-items: center; margin-left: auto; min-height: 36px; padding: 0 12px;
    border: 1px solid var(--os-ligne); border-radius: 999px; background: var(--os-surface); color: var(--os-texte);
    font: 600 12px/1 var(--font-texte, system-ui, sans-serif); cursor: pointer;
  }
  .os-tout-replier:focus-visible { outline: 2px solid var(--os-accent); outline-offset: 1px; }
  .os-legende { margin-left: 0; }
  .os-legende ul { position: static; width: auto; margin-top: 6px; box-shadow: none; }
  .os-legende[open] { flex-basis: 100%; order: 4; }

  .os-plancher { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 18px 8px 10px; }
  .os-plancher::after { left: 10px; right: 10px; height: 7px; }
  .os-cafe { grid-column: auto; min-height: 0; }
  .os-cafe-scene { max-height: 130px; }

  .os-ilot { padding: 6px; }
  .os-ilot-tete { align-items: center; margin-bottom: 0; }
  .os-etiquette { min-height: 44px; gap: 4px; }
  .os-etiquette-haut { justify-content: flex-start; flex-wrap: wrap; }
  .os-resume { display: block; font: 11px/1.3 var(--font-mono, ui-monospace, monospace); color: var(--os-attenue); }
  .os-replier {
    display: grid; place-items: center; flex: none;
    width: 44px; min-height: 44px; margin: 0; padding: 0;
    border: 1px solid var(--os-ligne); border-radius: 10px;
    background: var(--os-surface); color: var(--os-texte); cursor: pointer;
  }
  .os-replier:focus-visible { outline: 2px solid var(--os-accent); outline-offset: 1px; }
  .os-replier .os-ico { width: 16px; height: 16px; transition: transform 0.25s ease; }
  .os-ilot--replie .os-replier .os-ico { transform: rotate(-90deg); }
  .os-ilot--replie .os-bureaux { display: none; }
  .os-bureaux { margin-top: 6px; gap: 4px; }

  .os-scene-cadre { width: 100%; max-width: 100px; margin: 0 auto; }
  .os-etat-texte { display: block; margin-top: 1px; font: 10.5px/1.25 var(--font-mono, ui-monospace, monospace); color: var(--os-attenue); }
  .os-bulle, .os-bureau:hover .os-bulle, .os-bureau:focus-visible .os-bulle {
    position: static; display: none; width: auto; max-width: none;
    margin: 4px 0 2px; padding: 5px 7px; border-radius: 10px;
    font-size: 11.5px; opacity: 1; transform: none !important;
  }
  .os-bulle::before, .os-bulle::after { display: none; }
  .os-bulle.os-bulle--vue { display: block; animation: none; }
}

/* ---------- Mouvement réduit ---------- */
@media (prefers-reduced-motion: reduce) {
  .os *, .os *::before, .os *::after { animation: none !important; transition: none !important; }
  .os-b--actif .s-ecran-lueur.on { opacity: 0.5; }
}

/* 40-panneaux.css */
/* Panneau des leviers, registre et tableau de bord. Propriétaire : agent F. */

/* ---------- Panneau ---------- */
.panneau {
  display: flex; flex-direction: column; max-height: calc(100vh - var(--hud-h) - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: var(--shadow); overflow: hidden;
}
.panneau-poignee { display: none; }
.panneau-tete { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; background: var(--surface); }
.panneau-titre { font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.onglets { display: flex; flex-wrap: wrap; gap: 4px; }
.onglet {
  display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--paper); color: var(--fg); font-size: var(--fs-s); font-weight: 600; cursor: pointer;
}
.onglet:hover { border-color: var(--accent-line); }
.onglet.is-actif { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.onglet.is-verrou { color: var(--muted); background: transparent; border-style: dashed; }
.onglet.is-verrou.is-actif { background: var(--surface-2); color: var(--fg); border-style: solid; border-color: var(--line-strong); }
.onglet-verrou { display: inline-flex; align-items: center; gap: 2px; font-size: .6875rem; font-weight: 500; }

.portee { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: var(--fs-s); }
.portee-lib { font-weight: 600; }
.portee-select { min-height: 34px; padding: 4px 30px 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--paper); font-weight: 600; min-width: 0; max-width: 100%;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.portee.is-ilot .portee-select { border-color: var(--accent); color: var(--accent); background-color: var(--accent-soft); }
.portee-note { grid-column: 1 / -1; color: var(--muted); font-size: var(--fs-xs); }

.panneau-corps { overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px 18px; display: grid; gap: 12px; align-content: start; }

.ouverture { display: grid; gap: 8px; padding-bottom: 6px; }
.ouverture-nouveau { font-size: var(--fs-s); }

/* ---------- Leviers ---------- */
.panneau-leviers { display: grid; gap: 10px; }
.levier { display: grid; gap: 7px; padding: 11px 12px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.levier.is-surcharge { border-color: var(--accent-line); box-shadow: inset 3px 0 0 var(--accent); }
.levier.is-verrou { background: transparent; border-style: dashed; }
.levier.is-verrou .levier-aide { color: var(--muted); }
.levier-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.levier-nom { font-family: var(--font-titre); font-weight: 600; font-size: var(--fs-m); }
.levier-badges { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.levier-aide { font-size: var(--fs-s); color: var(--muted); line-height: 1.4; }
.levier-note { font-size: var(--fs-xs); color: var(--muted); }
.levier-attente { font-size: var(--fs-s); color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.levier .btn--petit { justify-self: start; }
.levier-courant { font-size: var(--fs-s); font-weight: 600; color: var(--accent); margin-top: -2px; }
.postit--levier { margin-top: 4px; }

.panneau-verrou { display: grid; gap: 10px; justify-items: start; padding: 18px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r);
  background: repeating-linear-gradient(135deg, transparent 0 10px, var(--surface-2) 10px 12px); }
.verrou-icone { color: var(--muted); }
.panneau-verrou h3 { font-size: var(--fs-l); }
.verrou-liste { padding-left: 18px; display: grid; gap: 3px; font-size: var(--fs-s); }

/* ---------- Registre ---------- */
.panneau-registre { display: grid; gap: 12px; }
.registre-titre { font-size: var(--fs-l); }
.registre-intro { font-size: var(--fs-s); color: var(--muted); margin-top: -6px; }
.registre-entete { display: grid; gap: 8px; }
.triades { display: grid; gap: 6px; }
.triades-liste { list-style: none; display: grid; gap: 4px; }
.triade-ligne { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); cursor: pointer; text-align: left; font-size: var(--fs-s); }
.triade-ligne:hover { border-color: var(--accent); }
.triade-ligne.is-complete { border-color: var(--crit); background: var(--crit-soft); }
.triade-ilot { font-weight: 600; }
.triade-n { color: var(--muted); font-size: var(--fs-xs); }
.apercu { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--paper); }
.apercu.is-complete { border-color: var(--crit); box-shadow: inset 3px 0 0 var(--crit); }
.apercu-alerte { color: var(--crit); font-weight: 600; font-size: var(--fs-s); }
.apercu-sature { color: var(--warn); font-size: var(--fs-xs); font-weight: 600; margin-top: 4px; }
.apercu-alertes { padding-left: 18px; font-size: var(--fs-s); color: var(--warn); }
.registre-filtres { display: grid; gap: 8px; }
.filtre { display: grid; gap: 4px; }
.filtre-lib { font-size: .6875rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.filtre .choix-opt { font-size: var(--fs-xs); min-height: 30px; padding: 4px 8px; }
.registre-liste { display: grid; gap: 10px; }
.registre-vide { color: var(--muted); font-style: italic; font-size: var(--fs-s); padding: 8px 0; }

.cap { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); position: relative; }
.cap--mcp { border-left: 4px solid var(--fg); }
.cap--skill { border-left: 4px solid var(--line-strong); }
.cap.is-equipee { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-line); }
.cap.is-perimee { background: repeating-linear-gradient(135deg, var(--paper) 0 12px, var(--surface-2) 12px 14px); }
.cap-tete { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cap-type { font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 2px; background: var(--fg); color: var(--bg); }
.cap--skill .cap-type { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-strong); }
.cap-nom { font-size: var(--fs-m); font-weight: 600; min-width: 0; overflow-wrap: anywhere; flex: 1 1 auto; }
.prov { font-size: .6875rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); white-space: nowrap; }
.prov--maison { color: var(--ok); border-color: currentColor; }
.prov--fournisseur { color: var(--fg); }
.prov--communaute { color: var(--warn); border-color: currentColor; border-style: dashed; }
.prov--personnelle { color: var(--muted); border-style: dotted; }
.cap-desc { font-size: var(--fs-s); }
.cap-attr { margin: 0; display: grid; gap: 5px; font-size: var(--fs-s); }
.cap-attr > div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px; align-items: center; }
.cap-attr dt { color: var(--muted); font-size: var(--fs-xs); }
.cap-attr dd { margin: 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.cap-attr .jauge { grid-template-columns: minmax(60px, 1fr) auto; width: 100%; }
.puce { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg); }
.puce span[aria-hidden] { font-size: .55rem; }
.puce--ok span[aria-hidden] { color: var(--ok); }
.puce--crit span[aria-hidden] { color: var(--crit); }
.mini-barre { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.mini-barre i { display: block; height: 100%; background: var(--muted); }
.cap-risque { color: var(--warn); font-weight: 600; }
.cap-orpheline { color: var(--warn); font-weight: 600; }
.cap-note { font-size: var(--fs-xs); color: var(--muted); }
.cap-prerequis { font-size: var(--fs-xs); font-weight: 600; }
.cap-prerequis.is-ok { color: var(--ok); }
.cap-prerequis.is-manque { color: var(--warn); }
.cap-equipee { font-size: var(--fs-xs); }
.cap-actions { display: grid; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.cap-actions > .btn { justify-self: start; }
.cap-dev, .cap-proprio-choix { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: var(--fs-xs); }
.cap-dev label, .cap-proprio-choix label { color: var(--muted); }
.cap select { min-height: 32px; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: var(--fs-s); max-width: 100%; }
.cap-encours { font-size: var(--fs-s); color: var(--accent); font-weight: 600; }

/* ---------- Tableau de bord ---------- */
.tableau { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.tableau-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tableau-entete { display: none; min-width: 0; max-width: 100%; }
.tableau-corps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; align-items: start; }
.groupe { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 10px 12px 6px; min-width: 0; }
.groupe-titre { font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
.groupe-cachees { font-size: var(--fs-xs); font-weight: 500; color: var(--muted); letter-spacing: 0; }
.metriques { list-style: none; }
.metrique {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(4.6em, auto);
  grid-template-areas: "lib spark val" "lib spark delta";
  gap: 0 12px; align-items: center; padding: 6px 0; border-bottom: 1px dotted var(--line); min-height: 44px;
}
.metrique:last-child { border-bottom: 0; }
.met-lib { grid-area: lib; font-size: var(--fs-s); min-width: 0; line-height: 1.25; }
.met-val { grid-area: val; font-size: var(--fs-m); font-weight: 600; text-align: right; white-space: nowrap; line-height: 1.2; }
.metrique.is-cachee .met-val { grid-row: 1 / 3; }
.met-val small { font-size: var(--fs-xs); color: var(--muted); font-weight: 400; }
.met-spark { grid-area: spark; position: relative; display: flex; align-items: center; min-width: 0; }
.met-delta { grid-area: delta; font-size: var(--fs-xs); font-weight: 600; text-align: right; white-space: nowrap; color: var(--muted); }
.met-delta--mieux { color: var(--ok); }
.met-delta--pire { color: var(--crit); }
.met-delta--neutre { color: var(--muted); font-weight: 500; }
.met-scrub { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: .6875rem; color: var(--bg); background: var(--fg); padding: 1px 6px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
.met-scrub:empty { display: none; }
.spark { display: block; overflow: visible; cursor: crosshair; touch-action: pan-y; }
.spark-ligne { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark-aire { fill: var(--muted); opacity: .08; }
.spark-point { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.spark-point.is-neutre { fill: var(--muted); }
.spark-curseur { fill: var(--fg); stroke: var(--surface); stroke-width: 1.5; }
.spark-vide { stroke: var(--line-strong); stroke-dasharray: 2 3; }
.metrique.is-neutre .met-val { color: var(--muted); }

.metrique.is-cachee { cursor: help; }
.metrique.is-cachee .met-lib { color: var(--muted); }
.met-val--cache { font-family: var(--font-texte); font-size: var(--fs-xs); font-weight: 500; font-style: italic; color: var(--muted); }
.spark--hachure { grid-area: spark; width: 76px; height: 12px; border-radius: 2px; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--hachure) 4px 6px); }
.met-indice {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% - 4px);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start;
  background: var(--postit); color: var(--postit-fg); padding: 8px 10px; border-radius: 2px 2px 12px 2px; font-size: var(--fs-xs);
  box-shadow: 0 10px 20px -10px rgba(60, 40, 0, .6); transform: rotate(-.5deg);
  opacity: 0; visibility: hidden; transition: opacity .15s, visibility .15s;
}
.met-indice b { font-family: var(--font-titre); }
.metrique.is-cachee:hover .met-indice, .metrique.is-cachee:focus .met-indice, .metrique.is-cachee:focus-within .met-indice { opacity: 1; visibility: visible; }

/* 50-modales.css */
/* Couches superposées : carte d'événement, fiche de développeur, bandeau de conséquence, comité,
   visite guidée ; et l'écran du bilan annuel. Propriétaire : agent F. */

.voile { position: fixed; inset: 0; z-index: 40; background: var(--backdrop); animation: fondu .2s ease both; }
@keyframes fondu { from { opacity: 0; } to { opacity: 1; } }
@keyframes monte { from { transform: translate(-50%, calc(-50% + 14px)); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }

.modale {
  position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--r-l);
  box-shadow: var(--shadow-haute); padding: 22px 24px 24px; animation: monte .28s cubic-bezier(.2, .9, .3, 1.1) both;
}
.modale-fermer { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.modale-fermer:hover { border-color: var(--line-strong); color: var(--fg); }

/* ---------- Carte d'événement ---------- */
.carte-evenement { padding-top: 0; display: grid; gap: 16px; overflow-x: hidden; }
.ev-bande { height: 8px; margin: 0 -24px; background: repeating-linear-gradient(-45deg, var(--warn) 0 10px, var(--fg) 10px 20px); opacity: .85; }
.ev-tete { display: grid; gap: 6px; }
.ev-tete .eyebrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.ev-theme { margin-left: auto; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 2px; font-size: .625rem; }
.ev-titre { font-size: var(--fs-2xl); font-weight: 700; }
.ev-corps { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; }
.ev-perso { margin: 0; display: grid; justify-items: center; gap: 6px; text-align: center; max-width: 110px; }
.ev-perso figcaption { display: grid; font-size: var(--fs-s); line-height: 1.2; }
.ev-perso figcaption span { font-size: var(--fs-xs); color: var(--muted); }
.ev-texte { font-size: var(--fs-l); }
.ev-choix { display: grid; gap: 8px; padding-top: 4px; }
.choix-ev {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
  padding: 12px 14px; min-height: 48px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
.choix-ev:hover { border-color: var(--accent); background: var(--accent-soft); }
.choix-ev:active { transform: translateY(1px); }
.choix-ev-cle { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 3px; font-size: var(--fs-s); background: var(--paper); }
.choix-ev:hover .choix-ev-cle { border-color: var(--accent); color: var(--accent); }

/* ---------- Fiche de développeur ---------- */
.fiche { display: grid; gap: 14px; }
.fiche-tete { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding-right: 32px; }
.fiche-visage { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--line-strong); }
.fiche-id { display: grid; gap: 3px; min-width: 0; }
.fiche-id h2 { font-size: var(--fs-2xl); }
.fiche-niveau { font-size: var(--fs-s); color: var(--muted); }
.fiche-etat { font-weight: 600; color: var(--fg); }
.etat--incident { color: var(--crit); }
.etat--conge, .etat--absent { color: var(--warn); }
.etat--formation { color: var(--accent); }
.traits { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.trait { font-size: var(--fs-xs); padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.fiche-tagline { font-size: var(--fs-m); font-style: italic; color: var(--muted); }
.fiche-replique { margin: 0; font-size: var(--fs-m); }
.fiche-parti { color: var(--warn); font-weight: 600; }
.fiche-jauges { display: grid; gap: 7px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fiche-jauges h3 { margin-bottom: 2px; }
.fiche-sessions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, 1.2fr) auto; gap: 10px; align-items: center; font-size: var(--fs-s); }
.ecrans { display: flex; gap: 3px; }
.ecrans i { width: 14px; height: 10px; border-radius: 2px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.ecrans i.is-on { background: var(--accent); box-shadow: 0 0 6px var(--accent-line); }
.fiche-semaine { font-size: var(--fs-xs); color: var(--muted); }
.fiche-reactions ul { list-style: none; display: grid; gap: 4px; margin-top: 6px; font-size: var(--fs-s); }
.fiche-reactions li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; }
.reaction-signe { font-weight: 700; text-align: center; }
.is-aime .reaction-signe { color: var(--ok); }
.is-naime .reaction-signe { color: var(--crit); }

/* ---------- Bandeau de conséquence ---------- */
.couche-toast { position: fixed; z-index: 35; right: var(--gutter-r); bottom: 20px; width: min(400px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  pointer-events: auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start;
  background: var(--paper); border: 1px solid var(--line-strong); border-left: 4px solid var(--accent); border-radius: var(--r);
  padding: 12px 10px 12px 14px; box-shadow: var(--shadow-haute); animation: toast .3s cubic-bezier(.2, .9, .3, 1.2) both;
}
@keyframes toast { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast-corps { display: grid; gap: 3px; min-width: 0; }
.toast-titre { font-family: var(--font-titre); font-weight: 600; }
.toast-choix { font-size: var(--fs-s); color: var(--muted); }
.toast-consequence { font-size: var(--fs-s); }
.toast-fermer { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
.toast-fermer:hover { background: var(--surface-2); color: var(--fg); }

/* ---------- Comité ---------- */
.voile--comite { background: color-mix(in srgb, var(--backdrop) 100%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.comite { width: min(820px, calc(100vw - 32px)); display: grid; gap: 16px; padding: 22px clamp(16px, 4vw, 30px) 26px; }
.comite-tete { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; border-bottom: 3px double var(--fg); padding-bottom: 12px; }
.comite-tete h2 { font-size: var(--fs-2xl); font-weight: 700; margin-top: 4px; }
.comite-jauge { display: grid; justify-items: end; }
.comite-jauge b { font-size: var(--fs-2xl); line-height: 1; }
.comite-intro { color: var(--muted); font-size: var(--fs-s); max-width: 62ch; }
.comite-points { list-style: none; display: flex; gap: 6px; }
.comite-points li { width: 28px; height: 4px; border-radius: 2px; background: var(--line); }
.comite-points li.is-faite { background: var(--fg); }
.comite-points li.is-courante { background: var(--accent); }
.salle { position: relative; display: grid; gap: 14px; padding: 18px; border-radius: var(--r-l); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.salle::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -8px; height: 16px; border-radius: 50% / 100% 100% 0 0; background: var(--line-strong); opacity: .45; pointer-events: none; }
.salle-mur { font-size: .6875rem; letter-spacing: .14em; color: var(--muted); border-bottom: 1px solid var(--line-strong); padding-bottom: 8px; }
.salle-question { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
.fauteuil { margin: 0; display: grid; justify-items: center; gap: 6px; text-align: center; max-width: 130px; }
.fauteuil figcaption { display: grid; font-size: var(--fs-s); line-height: 1.2; }
.fauteuil figcaption span { font-size: var(--fs-xs); color: var(--muted); }
.reponses { display: grid; gap: 8px; position: relative; z-index: 1; }
.reponse {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; text-align: left;
  padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--paper); cursor: pointer;
  transition: border-color .15s, background .15s;
}
.reponse:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.reponse[disabled] { cursor: default; opacity: .55; }
.reponse.is-choisie { opacity: 1; border-width: 2px; padding: 11px 13px; }
.reponse.is-choisie.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.reponse.is-choisie.is-warn { border-color: var(--warn); background: var(--warn-soft); }
.reponse.is-choisie.is-crit { border-color: var(--crit); background: var(--crit-soft); }
.reponse-cle { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 2px; font-size: var(--fs-s); background: var(--surface); }
.reaction { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; position: relative; z-index: 1; animation: toast .3s ease both; }
.reaction > div { display: grid; gap: 6px; }
.reaction-tete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.reaction-confiance { font-size: var(--fs-s); }
.verdict { font-size: .6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 2px; border: 1.5px solid currentColor; }
.verdict--ok { color: var(--ok); }
.verdict--warn { color: var(--warn); }
.verdict--crit { color: var(--crit); }
.confiance-delta { font-weight: 600; }
.delta--ok { color: var(--ok); }
.delta--crit { color: var(--crit); }
.comite-resume { list-style: none; display: grid; gap: 8px; }
.comite-resume li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: var(--fs-s); }
.comite-aucune { color: var(--muted); font-style: italic; }
.comite-total { font-size: var(--fs-l); }
.comite-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

/* ---------- Visite guidée ---------- */
.tuto-spot {
  position: fixed; z-index: 41; border-radius: var(--r-l); pointer-events: none;
  box-shadow: 0 0 0 3px var(--accent), 0 0 0 9999px var(--backdrop);
  transition: top .3s ease, left .3s ease, width .3s ease, height .3s ease;
}
.tuto-bulle {
  position: fixed; z-index: 52; width: min(380px, calc(100vw - 24px)); display: grid; gap: 10px;
  background: var(--postit); color: var(--postit-fg); padding: 14px 16px; border-radius: 3px 3px 18px 3px;
  box-shadow: 0 1px 0 var(--postit-line), var(--shadow-haute); transition: top .3s ease, left .3s ease;
}
.tuto-bulle::before { content: ""; position: absolute; top: -7px; left: 50%; width: 56px; height: 14px; transform: translateX(-50%) rotate(-2deg); background: rgba(255, 255, 255, .5); }
.tuto-tete { display: flex; gap: 10px; align-items: center; }
.tuto-tete .eyebrow { color: inherit; opacity: .75; }
.tuto-tete b { font-family: var(--font-titre); font-size: var(--fs-l); }
.tuto-texte { font-size: var(--fs-m); }
.tuto-action { font-size: var(--fs-s); font-weight: 600; }
.tuto-points { display: flex; gap: 5px; }
.tuto-points i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .25; }
.tuto-points i.is-on { opacity: .9; }
.tuto-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tuto-actions .lien { color: inherit; }
.tuto-nav { display: flex; gap: 6px; }
.tuto-bulle .btn--fantome { border-color: currentColor; color: inherit; }

/* ---------- Bilan annuel ---------- */
.bilan { max-width: 980px; margin: 0 auto; padding: 24px var(--gutter-r) 64px var(--gutter); display: grid; gap: 28px; }
.bilan-tete { display: grid; gap: 4px; border-bottom: 2px solid var(--fg); padding-bottom: 12px; }
.bilan-raison { color: var(--muted); }
.profil-fin {
  position: relative; display: grid; gap: 14px; justify-items: center; text-align: center;
  padding: 36px clamp(16px, 5vw, 48px) 32px; background: var(--paper); border: 2px solid var(--fg); border-radius: 2px; box-shadow: var(--shadow);
  overflow: hidden;
}
